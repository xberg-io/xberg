name: Install System Dependencies
description: |
  Install and cache platform-specific dependencies required for document conversion.
  Includes: Tesseract OCR, fonts, and build tools.
  Features robust caching with architecture/version awareness, timeout handling, and retry logic.

inputs:
  libheif-version:
    description: "Linux libheif runtime; 1.19.8 is an explicit ABI-floor experiment only"
    required: false
    default: "1.23.7"
  enable-retry:
    description: Enable retry logic with exponential backoff
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Detect Tesseract version (macOS)
      if: runner.os == 'macOS'
      id: detect-tesseract-macos
      shell: bash
      run: scripts/ci/install-system-deps/detect-tesseract-macos.sh

    - name: Cache Tesseract & tessdata (macOS)
      if: runner.os == 'macOS'
      id: cache-tesseract-macos
      uses: actions/cache@v6
      with:
        path: |
          /usr/local/opt/tesseract/
          /usr/local/Cellar/tesseract/
          /opt/homebrew/opt/tesseract/
          /opt/homebrew/Cellar/tesseract/
        key: tesseract-macos-${{ runner.arch }}-v5-${{ steps.detect-tesseract-macos.outputs.version }}
        restore-keys: |
          tesseract-macos-${{ runner.arch }}-v5-
          tesseract-macos-${{ runner.arch }}-

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: scripts/ci/install-system-deps/install-macos.sh

    - name: Detect Tesseract version (Linux)
      if: runner.os == 'Linux'
      id: detect-tesseract-linux
      shell: bash
      run: scripts/ci/install-system-deps/detect-tesseract-linux.sh

    - name: Cache Tesseract data (Linux)
      if: runner.os == 'Linux'
      id: cache-tesseract-linux
      uses: actions/cache@v6
      with:
        path: |
          /usr/share/tesseract-ocr/5/tessdata/
          /usr/share/tesseract-ocr/tessdata/
        key: tesseract-linux-${{ runner.arch }}-v5-${{ steps.detect-tesseract-linux.outputs.version }}
        restore-keys: |
          tesseract-linux-${{ runner.arch }}-v5-
          tesseract-linux-${{ runner.arch }}-

    - name: Identify Linux distribution for libheif cache
      if: runner.os == 'Linux'
      id: libheif-linux-distro
      shell: bash
      run: |
        set -euo pipefail
        source /etc/os-release
        printf 'distro=%s-%s\n' "$ID" "${VERSION_ID:-rolling}" >>"$GITHUB_OUTPUT"

    - name: Restore libheif cache (Linux)
      if: runner.os == 'Linux'
      id: cache-libheif-linux
      uses: actions/cache@v6
      with:
        path: |
          /tmp/libheif-cache/usr/local/lib/libheif*
          /tmp/libheif-cache/usr/local/lib/pkgconfig/libheif.pc
          /tmp/libheif-cache/usr/local/include/libheif/
          /tmp/libheif-cache/usr/local/share/libheif/
        key: libheif-linux-${{ steps.libheif-linux-distro.outputs.distro }}-${{ runner.arch }}-v${{ inputs.libheif-version }}-cache-v6

    - name: Restore cached libheif to /usr/local (Linux)
      if: runner.os == 'Linux' && steps.cache-libheif-linux.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cache_root=/tmp/libheif-cache/usr/local
        echo "Restoring cached libheif from ${cache_root} to /usr/local..."
        # Every downstream cargo build resolves libheif through the .pc file this step drops in
        # /usr/local/lib/pkgconfig, so a failed copy here is not recoverable -- it must abort the
        # job. The previous `2>/dev/null || true` made a failure indistinguishable from success:
        # /usr/local/lib/pkgconfig does not exist on a fresh runner, so the .pc copy silently
        # failed on every cache hit and install-linux.sh rebuilt libheif from source anyway. ~keep
        for required in \
          "${cache_root}/lib/pkgconfig/libheif.pc" \
          "${cache_root}/include/libheif"; do
          if [ ! -e "${required}" ]; then
            echo "::error::libheif cache reported a hit but ${required} is missing; the cache entry is incomplete"
            exit 1
          fi
        done
        sudo mkdir -p /usr/local/lib/pkgconfig /usr/local/include /usr/local/share
        sudo cp -a "${cache_root}"/lib/libheif* /usr/local/lib/
        sudo cp -a "${cache_root}/lib/pkgconfig/libheif.pc" /usr/local/lib/pkgconfig/
        sudo cp -a "${cache_root}/include/libheif" /usr/local/include/
        # libheif 1.19.x installs no share/libheif; newer releases do. Genuinely optional. ~keep
        if [ -d "${cache_root}/share/libheif" ]; then
          sudo cp -a "${cache_root}/share/libheif" /usr/local/share/
        fi
        sudo ldconfig
        echo "✓ Restored cached libheif"

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        LIBHEIF_VERSION: ${{ inputs.libheif-version }}
      run: scripts/ci/install-system-deps/install-linux.sh

    - name: Cache Tesseract (Windows)
      if: runner.os == 'Windows'
      id: cache-tesseract-windows
      uses: actions/cache@v6
      with:
        path: |
          C:\Program Files\Tesseract-OCR
          C:\ProgramData\chocolatey\lib\tesseract
        key: tesseract-windows-${{ runner.arch }}-v5.5.4-source-7e548e6-data-v2
        restore-keys: |
          tesseract-windows-${{ runner.arch }}-v5.5.4-source-7e548e6-data-

    - name: Cache LLVM (Windows)
      if: runner.os == 'Windows'
      id: cache-llvm-windows
      uses: actions/cache@v6
      with:
        path: |
          C:\Program Files\LLVM
          C:\ProgramData\chocolatey\lib\llvm
        key: llvm-windows-${{ runner.arch }}-23.1.3-v2

    - name: Cache CMake (Windows)
      if: runner.os == 'Windows'
      id: cache-cmake-windows
      uses: actions/cache@v6
      with:
        path: |
          C:\Program Files\CMake
          C:\ProgramData\chocolatey\lib\cmake
        key: cmake-windows-${{ runner.arch }}-4.4.4-v2

    - name: Cache libheif + boost + zlib vcpkg (Windows)
      if: runner.os == 'Windows'
      id: cache-libheif-windows
      uses: actions/cache@v6
      with:
        path: C:\xberg-vcpkg-5363acb7
        key: libheif-windows-${{ runner.arch }}-v1.23.7-vcpkg-5363acb7-v5
        restore-keys: |
          libheif-windows-${{ runner.arch }}-v1.23.7-vcpkg-5363acb7-v5-

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        TESSERACT_CACHE_HIT: ${{ steps.cache-tesseract-windows.outputs.cache-hit }}
        LLVM_CACHE_HIT: ${{ steps.cache-llvm-windows.outputs.cache-hit }}
        CMAKE_CACHE_HIT: ${{ steps.cache-cmake-windows.outputs.cache-hit }}
        LIBHEIF_CACHE_HIT: ${{ steps.cache-libheif-windows.outputs.cache-hit }}
      run: pwsh -File scripts/ci/install-system-deps/install-windows.ps1
