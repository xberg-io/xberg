version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/cache-benchmark-harness"
      - "/.github/actions/cache-hf-fastembed"
      - "/.github/actions/cache-pdfium"
      - "/.github/actions/download-pdfium"
      - "/.github/actions/install-system-deps"
      - "/.github/actions/qualify-ocr-orientation"
      - "/.github/actions/qualify-ocr-paddle-sideways"
      - "/.github/actions/setup-layout-models"
      - "/.github/actions/setup-onnx-runtime"
      - "/.github/actions/setup-paddle-ocr-models"
      - "/.github/actions/setup-tesseract-cache"
      - "/.github/actions/stage-pdfium-runtime"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "xberg-io/*"
      - dependency-name: "erlef/setup-beam"
      - dependency-name: "rubygems/configure-rubygems-credentials"
      # Helm still uses cosign 2 legacy signatures for Artifact Hub. ~keep
      - dependency-name: "sigstore/cosign-installer"
