name: CI Focused PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/ci-focused-pr.yaml"
      - ".github/workflows/ci-rust.yaml"
      - ".github/actions/setup-onnx-runtime/**"
      - "scripts/ci/actions/setup-onnx-runtime/**"
      - "crates/**"
      - "fixtures/**"
      - "vendored/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/rust.toml"
      - "mise-tasks/nli/**"
      - "tools/benchmark-harness/nli_qualification/**"
      - "scripts/ci/rust/run-focused-pr-tests.sh"
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/ci-focused-pr.yaml"
      - ".github/workflows/ci-rust.yaml"
      - ".github/actions/setup-onnx-runtime/**"
      - "scripts/ci/actions/setup-onnx-runtime/**"
      - "crates/**"
      - "fixtures/**"
      - "vendored/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/rust.toml"
      - "mise-tasks/nli/**"
      - "tools/benchmark-harness/nli_qualification/**"
      - "scripts/ci/rust/run-focused-pr-tests.sh"
      - "test_documents"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-focused-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: short
  RUST_MIN_STACK: "16777216"
  OMP_THREAD_LIMIT: "1"
  HF_HUB_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  regressions:
    if: >-
      ${{ github.repository == 'xberg-io/xberg' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    name: Focused ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [pdf-ocr, office-pages, api-jobs, nli]
        # ~keep The public test documents a suite reads. A suite that names some gets the test_documents
        # submodule, because the fetch action reads test_documents/corpus.lock.json from it.
        include:
          - suite: pdf-ocr
            documents: |
              pdf/regression_pages/nist-sp811-2008-p7.pdf
              pdf/regression_pages/irs-fw9--2024-p1.pdf
              pdf/a_course_in_machine_learning_ciml_v0_9_all.pdf
          - suite: office-pages
            documents: |
              docx/budget_fy2027_memo.docx
              docx/docx_tables.docx
              docx/test_emf_docx.docx
              docx/unit_test_headers.docx
              docx/word_sample.docx
              vendored/docling/docx/table_with_equations.docx
              pptx/powerpoint_sample.pptx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: ${{ matrix.documents != '' }}

      - name: Fetch the public test documents of the suite
        if: matrix.documents != ''
        uses: xberg-io/actions/fetch-test-documents@v1
        with:
          include: ${{ matrix.documents }}
          cache: "false"

      - name: Verify NIST input for the public Type0 target
        if: matrix.suite == 'pdf-ocr'
        shell: bash
        run: |
          nist_fixture="$GITHUB_WORKSPACE/test_documents/pdf/regression_pages/nist-sp811-2008-p7.pdf"
          printf '%s  %s\n' 71c2a76af332a9b796899a78e99ce2d835026d624048cf239069276fcacce79b \
            "$nist_fixture" | sha256sum --check
          printf 'XBERG_NIST_FIXTURE=%s\n' "$nist_fixture" >> "$GITHUB_ENV"

      - uses: xberg-io/actions/setup-rust@v1
        with:
          disable-cache: "true"
          use-sccache: "false"
          install-llvm-cov: "false"

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: ${{ matrix.suite == 'nli' && 'true' || 'false' }}
          install-args: cargo-deny
          cache: "false"

      - name: Setup ONNX Runtime for NLI admission tests
        if: matrix.suite == 'nli'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          verify-linux-archive: "true"

      - name: Install OCR build dependencies and pinned English data
        if: matrix.suite == 'pdf-ocr'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libicu-dev libjpeg-dev libpng-dev libtiff-dev pkg-config zlib1g-dev
          tessdata="$RUNNER_TEMP/xberg-focused-tessdata"
          mkdir -p "$tessdata"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata \
            --output "$tessdata/eng.traineddata"
          printf '%s  %s\n' 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2 \
            "$tessdata/eng.traineddata" | sha256sum --check
          printf 'TESSDATA_PREFIX=%s\n' "$tessdata" >> "$GITHUB_ENV"

      - name: Run exact regression tests
        shell: bash
        env:
          FOCUSED_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$FOCUSED_SUITE" = nli ]; then
            mise run nli:ci
          else
            mise run rust:test:focused-pr "$FOCUSED_SUITE"
          fi

      - name: Verify Khmer recovery with the implicit Paddle fallback enabled
        if: matrix.suite == 'pdf-ocr'
        shell: bash
        run: |
          set -euo pipefail
          features="pdf,ocr,tokio-runtime,bundle-tessdata-eng,layout-types,paddle-ocr-tract"
          route="extractors::pdf::ocr::tests::tests::implicit_classical_fallback_is_decided_per_page_on_all_pdf_routes"
          cargo test --locked -p xberg --no-default-features --features "$features" --lib \
            -- --exact "$route" --color never 2>&1 | tee "$RUNNER_TEMP/khmer-paddle-route.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/khmer-paddle-route.log"
          name="paddle_enabled_pdf_keeps_khmer_from_its_detached_tesseract_read"
          cargo test --locked -p xberg --no-default-features --features "$features" --test pdf_khmer_minority_2826 \
            -- --exact "$name" --color never 2>&1 | tee "$RUNNER_TEMP/khmer-paddle-output.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/khmer-paddle-output.log"

      - name: Verify layer-token recovery with the implicit Paddle fallback enabled
        if: matrix.suite == 'pdf-ocr'
        shell: bash
        run: |
          set -euo pipefail
          features="pdf,ocr,tokio-runtime,bundle-tessdata-eng,layout-types,paddle-ocr-tract"
          name="the_mixed_route_keeps_the_layer_tokens_of_its_ocr_page"
          args=(test --locked -p xberg --no-default-features --features "$features" --test ocr_layer_tokens_2952)
          cargo "${args[@]}" -- --exact "$name" --list --color never 2>&1 | tee "$RUNNER_TEMP/layer-token-list.log"
          grep -Fx "$name: test" "$RUNNER_TEMP/layer-token-list.log"
          grep -Fx '1 test, 0 benchmarks' "$RUNNER_TEMP/layer-token-list.log"
          cargo "${args[@]}" -- --exact "$name" --color never 2>&1 | tee "$RUNNER_TEMP/layer-token-run.log"
          grep -Fx "test $name ... ok" "$RUNNER_TEMP/layer-token-run.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/layer-token-run.log"
