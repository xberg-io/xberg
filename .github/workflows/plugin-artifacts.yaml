name: Plugin release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach plugin artifacts to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Verify public skill exports
        run: python3 scripts/sync_public_skills.py --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@v1
        with:
          cursor-marketplace: "true"
          tag: ${{ inputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_integration_versions.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
          PLUGIN_PRODUCT: xberg
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Upload verified plugin archive and metadata
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release-assets-${{ github.run_attempt }}
          path: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  attach:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified plugin archive and metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist
      - name: Verify the transferred archive checksum
        working-directory: dist
        run: sha256sum --check -- *-plugins-*.tar.gz.sha256
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ inputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256
