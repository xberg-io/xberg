name: Native libheif runtime qualification
on:
  push:
    branches: [main]
    paths:
      - ".github/actions/install-system-deps/**"
      - "scripts/ci/verify_heif_runtime.py"
      - ".github/workflows/ci-native-runtime.yaml"
      - "scripts/ci/install-system-deps/**"
      - "scripts/ci/rust/check-libheif-runtime.sh"
      - "crates/xberg-libheif/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise-tasks/rust.toml"
      - "mise-tasks/rust/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-native-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    if: github.ref == 'refs/heads/main'
    name: libheif ${{ matrix.version }} ABI and real decoding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1.19.8", "1.23.7"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
          config-ref: ${{ github.sha }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: rust-native-runtime-${{ matrix.version }}
          use-sccache: "true"
          install-llvm-cov: "false"
      - name: Fetch actual decoder fixtures
        uses: xberg-io/actions/fetch-test-documents@v1
        with:
          include: |
            images/test.heic
            images/test.heif
            images/test.avif
            images/alpha.heif
      - name: Provision selected runtime
        uses: ./.github/actions/install-system-deps
        with:
          libheif-version: ${{ matrix.version }}
      - name: Verify selected C ABI, decoder and actual Rust floor wrapper
        env:
          EXPECTED_HEIF_VERSION: ${{ matrix.version }}
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: mise run rust:check:libheif-runtime
