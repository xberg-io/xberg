      - name: Stage native lib for Java classifier layout
        env:
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          mkdir -p "dist/java-natives/${CLASSIFIER}"
          cp build-output/libxberg_ffi.so "dist/java-natives/${CLASSIFIER}/libxberg_ffi.so"

      # The step above only proves libxberg_ffi.so was produced -- never that
      # a JVM can load it and call into it correctly. io.xberg.NativeLib
      # already validates every required C symbol resolves by name the first
      # time any io.xberg class is touched, but symbol presence does not
      # prove a real extraction call works end to end. This compiles the
      # io.xberg sources against a real JDK inside a genuine Alpine (musl
      # libc) container and runs a real extraction against a known fixture,
      # asserting the exact expected text comes back. See
      # scripts/ci/fixtures/java-smoke/Smoke.java for details. No
      # continue-on-error: a broken native library must fail this job, not
      # merely warn.
      - name: Smoke-test musl Java native (real extraction, not just symbol presence)
        run: |
          bash scripts/ci/smoke-test-musl-java-ffi.sh build-output

      - uses: actions/upload-artifact@v7
        with:
          name: java-natives-${{ matrix.classifier }}
          path: dist/java-natives
          if-no-files-found: error
          retention-days: 14

  kotlin-android-natives:
    name: Build Kotlin Android natives (${{ matrix.abi }})
    needs: [prepare, check-maven]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          (needs.prepare.outputs.release_kotlin_android == 'true' || needs.prepare.outputs.release_kotlin == 'true') &&
          (needs.prepare.outputs.dry_run == 'true' ||
           (needs.prepare.outputs.is_tag == 'true' && needs.check-maven.result == 'success' &&
            (needs.check-maven.outputs.kotlin_exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a }
          - { abi: x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.source_sha || needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-android-natives@v1
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.abi == 'arm64-v8a' && 'thin' || 'fat' }}
        with:
          # xberg-jni has no [features] table of its own; it pulls in
          # xberg's android-target feature automatically via
          # cfg(target_os = "android") dependency selection, so no
          # --features/--no-default-features flags are passed here. ~keep
          crate-name: xberg-jni
          abis: ${{ matrix.abi }}
      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-android-${{ matrix.abi }}
          path: dist/android-natives
          if-no-files-found: error
          retention-days: 14

  csharp-natives:
    name: Build C# natives (${{ matrix.rid }})
    needs: [prepare, check-nuget]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_csharp == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-26, rid: osx-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, rid: win-x64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          add-macos-rpath: "false"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # Build the libheif closure from source at the macOS floor (#1243) and make
      # the FFI dylib link it instead of Homebrew's runner-OS bottles, so the
      # osx-arm64 NuGet native bundles a heif closure at the macOS floor. ~keep
      - name: Build libheif stack for the macOS floor
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=15.0
          bash scripts/ci/build-macos-heif-deps.sh
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            echo "PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: zig
          config-ref: ${{ github.sha }}

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"

      - uses: xberg-io/actions/build-csharp-natives@v1
        with:
          target: ${{ matrix.target }}
          crate-name: xberg-ffi
          lib-name: xberg_ffi
          rid: ${{ matrix.rid }}
          glibc-version: ${{ contains(matrix.target, '-linux-gnu') && env.GLIBC_FLOOR || '' }}

      - name: Ship and verify native closure (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          bash scripts/ci/vendor-native-closure.sh dist/csharp-natives
          bash scripts/ci/verify-glibc-floor.sh dist/csharp-natives "$GLIBC_FLOOR"

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-natives-${{ matrix.rid }}
          path: dist/csharp-natives
          if-no-files-found: error
          retention-days: 14

  csharp-natives-musl:
    name: Build C# natives (linux-musl-${{ matrix.arch }})
    needs: [prepare, check-nuget]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_csharp == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, arch: arm64, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      - name: Build xberg-ffi via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-ffi \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --output type=local,dest=./build-output .

      - name: Stage native lib for NuGet RID layout
        env:
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "dist/csharp-natives/runtimes/${RID}/native"
          # Dockerfile.musl-ffi bundles the FFI library plus its vendored shared-lib
          # closure (libonnxruntime + codecs) with RUNPATH=$ORIGIN, so ship all of
          # them — not just libxberg_ffi.so — or .NET fails to load ORT at runtime (#1280).
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          cp build-output/*.so* "dist/csharp-natives/runtimes/${RID}/native/"

      # The step above only proves the shared-lib closure was produced --
      # never that .NET can load it and call into it correctly. [DllImport]
      # entry points bind lazily on first call, so nothing before this point
      # has ever executed a P/Invoke into the library. This builds a small
      # program against it inside a genuine Alpine (musl libc) container and
      # runs a real extraction against a known fixture, asserting the exact
      # expected text comes back. See scripts/ci/fixtures/csharp-smoke/Program.cs
      # for details. No continue-on-error: a broken native library must fail
      # this job, not merely warn.
      - name: Smoke-test musl C# native (real extraction, not just P/Invoke resolution)
        run: |
          bash scripts/ci/smoke-test-musl-csharp-ffi.sh "dist/csharp-natives/runtimes/${{ matrix.rid }}/native"

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-natives-${{ matrix.rid }}
          path: dist/csharp-natives
          if-no-files-found: error
          retention-days: 14

  elixir-natives:
    name: Build Elixir NIF (${{ matrix.label }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, publish-crates]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
        nif: ["2.16"]
        include:
          - os: macos-26
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2022
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # BEAM stays on its setup action until mise's Erlang/Elixir install is evaluated. ~keep
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Disable sccache wrapper on Windows
        if: contains(matrix.target, 'windows')
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      # The NIF links libheif, which Homebrew installs at an absolute path no user Mac has. Build
      # the encoder codec stack from source at the macOS floor and ship it as archive siblings
      # resolved through @loader_path (#2547). Tagged source retries use this workflow revision's
      # tools. ~keep
      - name: Checkout macOS closure tools
        if: runner.os == 'macOS'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/build-macos-heif-deps.sh
            scripts/ci/macos_elixir_archive.py
            scripts/ci/smoke_macos_elixir_archive.exs
            scripts/ci/vendor-native-closure-macos.sh
            scripts/lib/retry.sh
            scripts/lib/macho.sh
            GPL-SOURCE-OFFER.txt
            mise.toml
            mise.lock

      - name: Setup Python for the macOS closure tools
        if: runner.os == 'macOS'
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: .release-tools
          tools: python

      - name: Build the encoder codec stack at the macOS floor
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export XBERG_HEIF_PROFILE=elixir-encoders
          export XBERG_HEIF_PREFIX="$RUNNER_TEMP/xberg-elixir-heif"
          bash .release-tools/scripts/ci/build-macos-heif-deps.sh
          {
            echo "XBERG_HEIF_PREFIX=$XBERG_HEIF_PREFIX"
            echo "PKG_CONFIG_PATH=$XBERG_HEIF_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"

      # Windows falls through to pyke's default download strategy, which
      # always imports DirectML.dll on Windows (xberg-io/xberg#1456), so
      # force ORT_STRATEGY=system so that import is never introduced. The
      # linux-gnu legs of this matrix moved to elixir-natives-manylinux,
      # which sets up ONNX Runtime inside its own Docker build instead.
      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - uses: xberg-io/actions/build-elixir-natives@v1
        id: build-nif
        with:
          target: ${{ matrix.target }}
          nif-crate-name: xberg_nif
          nif-crate-path: packages/elixir/native/xberg_nif
          package-dir: packages/elixir
          nif-version: ${{ needs.prepare.outputs.version }}
          nif-api-version: ${{ matrix.nif }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Stage, audit and load the macOS Elixir NIF archive
        if: runner.os == 'macOS' && needs.prepare.outputs.dry_run != 'true'
        shell: bash
        timeout-minutes: 15
        env:
          NIF_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/elixir-natives/*.tar.gz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one macOS NIF archive, found ${#archives[@]}"
            exit 1
          }
          raw="${archives[0]}"
          name="$(basename "$raw")"
          work="$(mktemp -d "$RUNNER_TEMP/xberg-elixir-stage.XXXXXXXX")"
          work="$(cd "$work" && pwd -P)"
          mkdir "$work/final" "$work/positive" "$work/negative" "$work/home" "$work/cache"
          tools=.release-tools/scripts/ci
          python3 "$tools/macos_elixir_archive.py" stage "$raw" \
            --codec-prefix "$XBERG_HEIF_PREFIX" --project-source "$GITHUB_WORKSPACE" \
            --source-offer .release-tools/GPL-SOURCE-OFFER.txt --output-dir "$work/final"
          python3 "$tools/macos_elixir_archive.py" verify "$work/final/$name" \
            --codec-prefix "$XBERG_HEIF_PREFIX" --project-source "$GITHUB_WORKSPACE" \
            --source-offer .release-tools/GPL-SOURCE-OFFER.txt
          beam_path="$(dirname "$(command -v elixir)"):$(dirname "$(command -v erl)"):/usr/bin:/bin:/usr/sbin:/sbin"
          probe=(env -i "PATH=$beam_path" "HOME=$work/home" "XBERG_CACHE_DIR=$work/cache"
            XBERG_EXPECT_HOSTED_BEAM=1 elixir "$tools/smoke_macos_elixir_archive.exs")
          native="$GITHUB_WORKSPACE/packages/elixir/lib/xberg/native.ex"
          "${probe[@]}" encode-decode "$work/final/$name" "$native" "$work/positive"
          if "${probe[@]}" missing-x265 "$work/final/$name" "$native" "$work/negative" >"$work/negative.log" 2>&1; then
            echo "::error::The missing-x265 control unexpectedly loaded"
            exit 1
          fi
          grep -Fq "Library not loaded: @loader_path/libx265." "$work/negative.log"
          rm -f "$raw"
          cp "$work/final/$name" "dist/elixir-natives/$name"
          echo "Staged and loaded $name with four relocated codec siblings." >> "$GITHUB_STEP_SUMMARY"

      # Retries of older source tags must use closure tools from this workflow revision. ~keep
      - name: Checkout Windows release closure tools
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-windows-dll-closure.ps1
            scripts/ci/vendor-windows-native-closure.ps1
            scripts/ci/windows_wheel_closure.py
            scripts/ci/windows_raw_staging.py
            scripts/ci/elixir_nif_assets.py
            mise.toml
            mise.lock

      - name: Setup Python for Windows release closure
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: .release-tools
          tools: python

      - name: Stage and audit Windows Elixir NIF closure
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          BUILDER_ARCHIVE: ${{ steps.build-nif.outputs.archive-path }}
          NIF_VERSION: ${{ needs.prepare.outputs.version }}
          NIF_API: ${{ matrix.nif }}
          TARGET: ${{ matrix.target }}
        run: |
          $closureTools = Join-Path $env:GITHUB_WORKSPACE ".release-tools/scripts/ci"
          if ($env:DRY_RUN -ne 'true') {
            $name = "xberg_nif-v${env:NIF_VERSION}-nif-${env:NIF_API}-${env:TARGET}.dll"
            python (Join-Path $closureTools "elixir_nif_assets.py") normalize-windows $env:BUILDER_ARCHIVE $name
            if ($LASTEXITCODE -ne 0) { throw "Windows NIF archive normalization failed" }
          }
          $tarballs = @(Get-ChildItem -Path dist/elixir-natives -Filter "*.tar.gz" -File -ErrorAction SilentlyContinue)
          if ($tarballs.Count -eq 0) {
            if ($env:DRY_RUN -eq 'true') {
              Write-Host "::notice::no Windows NIF archive produced by the dry run"
              exit 0
            }
            throw "No Windows NIF archive to audit"
          }
          $ortRuntime = Get-Item -LiteralPath $env:ORT_DYLIB_PATH -ErrorAction Stop
          foreach ($archive in $tarballs) {
            & (Join-Path $closureTools "vendor-windows-native-closure.ps1") -Archive $archive.FullName -DllSourceDir $ortRuntime.DirectoryName -NativeGlob "xberg_nif-*.dll"
            if ($LASTEXITCODE -ne 0) { throw "Windows NIF closure staging failed for $($archive.FullName)" }
            & (Join-Path $closureTools "verify-windows-dll-closure.ps1") -Artifact $archive.FullName -NativeGlob "xberg_nif-*.dll" -ArtifactKind raw -RequireCrtNotices
            if ($LASTEXITCODE -ne 0) { throw "Windows NIF closure audit failed for $($archive.FullName)" }
          }

      # `build-elixir-natives` returns before creating the tarball on a dry run
      # (scripts/build.py writes its outputs and skips the cargo build), so the
      # glob below matches nothing and `if-no-files-found: error` fails the job
      # -- on exactly the case the ship+verify step above deliberately tolerates
      # as a "dry-run stub". Sibling actions emit a stub and so do not hit this.
      # Gate on dry_run, NOT on is_tag: publish.yaml synthesizes a dry-run tag,
      # so `is_tag` is true on a dry run and would not skip anything. ~keep
      - uses: actions/upload-artifact@v7
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          name: elixir-${{ matrix.label }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  elixir-natives-musl:
    name: Build Elixir NIF (linux-musl-${{ matrix.arch }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, publish-crates]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_elixir == 'true' && (needs.prepare.outputs.dry_run == 'true' || needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        nif: ["2.16"]
        include:
          - os: ubuntu-latest
            # The v1.4.2 dry run was still compiling at the 90-minute cap. ~keep
            timeout: 240
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            # The native v1.4.0 ARM build was still compiling at the 90-minute cap. ~keep
            timeout: 240
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Resolve Elixir NIF version
        id: nif-version
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ "$DRY_RUN" == 'true' ]]; then
            version="$(sed -n 's/^ *version: "\([^"]*\)",$/\1/p' packages/elixir/mix.exs)"
          fi
          [[ -n "$version" && "$version" != *$'\n'* ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      - name: Build xberg_nif via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-rustler \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --output type=local,dest=./build-output .

      - name: Package NIF as RustlerPrecompiled tarball
        env:
          TARGET: ${{ matrix.target }}
          NIF_API: ${{ matrix.nif }}
          NIF_VERSION: ${{ steps.nif-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/elixir-natives staging
          # RustlerPrecompiled loads the versioned .so by name after extracting the archive. ~keep
          RENAMED="libxberg_nif-v${NIF_VERSION}-nif-${NIF_API}-${TARGET}.so"
          cp -a build-output/*.so* staging/
          mv staging/libxberg_nif.so "staging/${RENAMED}"
          python3 scripts/ci/package-notices.py stage staging
          TARBALL="${RENAMED}.tar.gz"
          tar -czf "dist/elixir-natives/${TARBALL}" -C staging .
          python3 scripts/ci/package-notices.py verify "dist/elixir-natives/${TARBALL}" .
          ( cd dist/elixir-natives && sha256sum "${TARBALL}" >"${TARBALL}.sha256" )

      - name: Smoke-test the staged musl Elixir NIF archive
        env:
          TARGET: ${{ matrix.target }}
          NIF_API: ${{ matrix.nif }}
          NIF_VERSION: ${{ steps.nif-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR=dist/elixir-natives
          RENAMED="libxberg_nif-v${NIF_VERSION}-nif-${NIF_API}-${TARGET}.so"
          (cd "$ARCHIVE_DIR" && sha256sum -c "${RENAMED}.tar.gz.sha256")
          archive="$ARCHIVE_DIR/${RENAMED}.tar.gz"
          bash scripts/ci/smoke-test-musl-elixir-nif.sh "$archive" "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-musl-${{ matrix.arch }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  elixir-natives-manylinux:
    name: Build Elixir NIF (${{ matrix.label }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, publish-crates]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.31-1@sha256:43f7ce12d79ed98b6dbfa3291d5afe389efd40a7e76de089959ffe99501b6edf
            nif: "2.16"
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.31-1@sha256:724b504247662e1cf122590957c857211ec2d16b113ec134f92c570a2d01250f
            nif: "2.16"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      # cargo-zigbuild (the linux-gnu approach used by build-elixir-natives@v1
      # for every other NIF platform) only lowers the glibc floor of
      # Rust-compiled objects. The `full` feature set pulls in libheif ->
      # libde265/libaom/libx265/libnuma, vendored as prebuilt/system .so files
      # by scripts/ci/vendor-native-closure.sh -- zigbuild never touches them,
      # so they kept the ubuntu-24.04 runner's glibc 2.39 floor. Building
      # inside manylinux_2_28 compiles that whole codec closure against glibc
      # 2.28 instead; this mirrors node-bindings-manylinux, which runs the
      # same verify-glibc-floor.sh check via docker/Dockerfile.manylinux-node
      # and already passes it. ~keep
      - name: Build Elixir NIF via manylinux Docker
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          docker build -f docker/Dockerfile.manylinux-rustler \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --build-arg MANYLINUX_IMAGE=${{ matrix.image }} \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      # Reproduces xberg-io/actions/build-elixir-natives@v1's naming contract
      # (scripts/build.py: lib{crate}-v{version}-nif-{api}-{target}.so[.tar.gz])
      # by hand, since this leg bypasses that action. The full vendored native
      # dependency closure built inside the container ships beside the
      # renamed .so -- verify-glibc-floor.sh below walks every .so in the
      # tarball, and that vendored closure is exactly what was failing the
      # floor check before this fix. ~keep
      - name: Package NIF as RustlerPrecompiled tarball
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          TARGET: ${{ matrix.target }}
          NIF_API: ${{ matrix.nif }}
          NIF_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/elixir-natives staging
          RENAMED="libxberg_nif-v${NIF_VERSION}-nif-${NIF_API}-${TARGET}.so"
          cp build-output/libxberg_nif.so "staging/${RENAMED}"
          python3 scripts/ci/package-notices.py stage staging
          for notice in tesseract-5.5.4/LICENSE tesseract-5.5.4/AUTHORS leptonica-1.87.0/leptonica-license.txt; do
            test -s "build-output/licenses/xberg-system-ocr/$notice" || {
              echo "::error::Missing OCR notice: $notice" >&2; exit 1; }
          done
          mkdir -p staging/licenses
          cp -R build-output/licenses/xberg-system-ocr staging/licenses/
          find build-output -maxdepth 1 -name '*.so*' ! -name 'libxberg_nif.so' -exec cp {} staging/ \;
          # ~keep A zero-match `find` exits 0 and would ship the NIF with no closure --
          # verify-glibc-floor.sh would then pass trivially, having examined nothing.
          # The closure is never empty: the NIF always links at least libonnxruntime.
          vendored=$(find staging -maxdepth 1 -name '*.so*' ! -name "${RENAMED}" | wc -l)
          echo "vendored ${vendored} library/libraries beside ${RENAMED}"
          [ "$vendored" -gt 0 ] || { echo "::error::no vendored libraries in build-output" >&2; exit 1; }
          TARBALL="${RENAMED}.tar.gz"
          tar -czf "dist/elixir-natives/${TARBALL}" -C staging .
          python3 scripts/ci/package-notices.py verify "dist/elixir-natives/${TARBALL}" .
          ( cd dist/elixir-natives && sha256sum "${TARBALL}" >"${TARBALL}.sha256" )

      # Verify only -- do NOT re-run vendor-native-closure.sh here. The closure was
      # already vendored inside the manylinux container against glibc 2.28; re-running
      # it on the ubuntu-24.04 runner (glibc 2.39) would resolve any gap against the
      # host and reintroduce the too-new libraries this job exists to avoid. ~keep
      - name: Verify glibc floor over the container-vendored closure
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/elixir-natives/*.tar.gz; do
            shipped=1
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      # Gate on dry_run, NOT on is_tag: publish.yaml synthesizes a dry-run tag,
      # so `is_tag` is true on a dry run and would not skip anything. Matches
      # the equivalent gate in the elixir-natives job. ~keep
      - uses: actions/upload-artifact@v7
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          name: elixir-${{ matrix.label }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  dart-server-natives:
    name: Build Dart server native (${{ matrix.blob }})
    needs: [prepare, check-pub]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_dart == 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, blob: linux-x86_64, lib: libxberg_dart.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, blob: linux-aarch64, lib: libxberg_dart.so }
          - {
              os: macos-26,
              target: aarch64-apple-darwin,
              # Asset blob uses the aarch64 spelling to match native_loader.dart's
              # nativeAssetBlob() (and the linux-aarch64 asset); the cache RID stays
              # macos-arm64. A macos-arm64 asset name here 404s on Apple Silicon. ~keep
              blob: macos-aarch64,
              lib: libxberg_dart.dylib,
            }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, blob: windows-x86_64, lib: xberg_dart.dll }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: zig
          config-ref: ${{ github.sha }}
      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"
      - name: Disable sccache wrapper on Windows
        if: contains(matrix.target, 'windows')
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"

      - name: Build Dart server native
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          # `cargo zigbuild` REPLACES the `build` subcommand (no literal "build"
          # after it), so bake the whole subcommand into BUILD_CMD.
          BUILD_CMD="cargo build"
          TARGET_ARG="$TARGET"
          # Use zigbuild for linux-gnu targets to set glibc floor to 2.28
          if [[ "$TARGET" == *"-linux-gnu" ]]; then
            BUILD_CMD="cargo zigbuild"
            TARGET_ARG="${TARGET}.${GLIBC_FLOOR}"
            echo "[publish] glibc floor: ${GLIBC_FLOOR} (target: ${TARGET_ARG})"
          fi
          ${BUILD_CMD} --locked -p xberg-dart --release --target "${TARGET_ARG}"
      - name: Stage native library and vendor its ONNX Runtime closure
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIB: ${{ matrix.lib }}
        run: |
          set -euxo pipefail
          STAGE=dist/server-natives
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/${LIB}" "$STAGE/${LIB}"
          python3 scripts/ci/package-notices.py stage "$STAGE"
          # The Dart native dynamically links ONNX Runtime; the download-based
          # pub package ships only these staged files, so the ORT runtime must be
          # bundled beside the native or `RustLib.init()` fails to dlopen it.
          case "$TARGET" in
            *-apple-darwin)
              # Native loads `@rpath/libonnxruntime.<ver>.dylib` with rpath
              # `@loader_path`, so ship that exact basename next to it.
              base="$(otool -L "$STAGE/${LIB}" | awk '/onnxruntime/{print $1; exit}' | xargs -r basename)"
              [ -n "$base" ] || { echo "::error::dart native does not link onnxruntime"; exit 1; }
              src="${ORT_LIB_LOCATION:?}/$base"
              [ -f "$src" ] || src="${ORT_DYLIB_PATH:?}"
              cp "$src" "$STAGE/$base"
              chmod u+w "$STAGE/$base"
              install_name_tool -id "@loader_path/$base" "$STAGE/$base"
              # This leg builds aarch64-apple-darwin, where signature state is
              # fatal, not cosmetic: dyld refuses an unsigned library outright
              # and AMFI SIGKILLs the process for an invalid one. `codesign` was
              # suppressed here and nothing ever verified the result, so a bad
              # signature would have reached Dart pub users as a hard crash.
              codesign --force -s - "$STAGE/$base"
              codesign --verify --strict "$STAGE/$base" \
                || { echo "::error::$base has no valid code signature; it would be killed at dlopen on arm64"; exit 1; }
              # The native and the ORT dylib must not resolve non-system libs.
              bad="$(otool -L "$STAGE/${LIB}" "$STAGE/$base" | tail -n +2 \
                | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)/' || true)"
              [ -z "$bad" ] || { echo "::error::dart native links non-system libs:"; echo "$bad"; exit 1; }
              ;;
            *-unknown-linux-gnu)
              # patchelf the $ORIGIN rpath and copy the .so closure (libonnxruntime + codecs).
              bash scripts/ci/vendor-native-closure.sh "$STAGE/${LIB}"
              bash scripts/ci/verify-glibc-floor.sh "$STAGE" "$GLIBC_FLOOR"
              compgen -G "$STAGE/libonnxruntime.so*" >/dev/null \
                || { echo "::error::libonnxruntime not vendored beside dart native"; exit 1; }
              ;;
            *-pc-windows-msvc)
              # Windows resolves imports from the loader's own directory, so ship
              # every ORT DLL beside the native.
              cp "${ORT_LIB_LOCATION:?}"/*.dll "$STAGE/"
              [ -f "$STAGE/onnxruntime.dll" ] || { echo "::error::onnxruntime.dll not staged"; exit 1; }
              ;;
          esac
          ls -l "$STAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: dart-server-${{ matrix.blob }}
          path: dist/server-natives
          if-no-files-found: error
          retention-days: 14

  upload-dart-release:
    name: Upload Dart server natives to GitHub Release
    needs: [prepare, check-pub, dart-server-natives]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_dart == 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: GitHub Release (Dart)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            dart-server-natives

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: dart-server-*
          path: dart-server-artifacts

      - name: Package server natives as tarballs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/dart-release
          for dir in dart-server-artifacts/dart-server-*; do
            [[ -d "$dir" ]] || continue
            blob="$(basename "$dir" | sed 's/^dart-server-//')"
            [[ -n "$(ls -A "$dir")" ]] || continue
            # Ship the whole vendored native closure (native + libonnxruntime +
            # codecs), flattened to the tarball root so native_loader.dart extracts
            # them side by side in the versioned cache dir — the native then
            # resolves ORT via @loader_path (macOS) / $ORIGIN (Linux) / the load
            # directory (Windows).
            tarball="xberg-dart-v${VERSION}-${blob}.tar.gz"
            python3 scripts/ci/package-notices.py stage "$dir"
            tar -czf "dist/dart-release/${tarball}" -C "$dir" .
            python3 scripts/ci/package-notices.py verify "dist/dart-release/${tarball}" .
            ( cd dist/dart-release && sha256sum "${tarball}" >"${tarball}.sha256" )
          done

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/dart-release
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          # Include the .sha256 sidecars: native_loader.dart verifies the
          # downloaded tarball against them before extracting, so a bare
          # xberg-dart-*.tar.gz pattern (no trailing *) would ship natives the
          # loader then refuses to install. ~keep
          assets: xberg-dart-*.tar.gz*

  swift-target:
    name: Build Swift library (${{ matrix.target }})
    needs: [prepare, check-swift]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_swift == 'true' && (needs.prepare.outputs.dry_run == 'true' || needs.check-swift.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: macos-26
    # One triple per job. The monolithic job built all five back to back and was killed by its
    # own 330-minute cap twice running (a timeout kill reports as `cancelled`, which is why it
    # read as a spurious cancellation for two releases). Its four successful runs took 227-294
    # minutes, so the true post-fat-LTO duration was never measured -- both post-LTO runs hit
    # the cap. Per triple the work is a fifth of that even before the parallelism, and an
    # Apple-only job additionally skips the cargo-zigbuild and Zig install. ~keep
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Exactly the triples the bundle ships: include-macos-x86_64 and include-ios-x86_64 are
        # both false below, so x86_64-apple-darwin and x86_64-apple-ios are deliberately absent.
        # A triple listed here but not built by the assemble step would fail that step, not this
        # one. ~keep
        target:
          - aarch64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          macos-dynamic-lookup: "false"
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"
          macos-dynamic-lookup: "false"

      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: libs
        # Must equal the `.iOS(.vN)` floor in Package.swift. Unset, rustc links at its iOS default
        # (10.0) while cc/cmake compile for the runner SDK (18.5), and prebuilt ORT objects call
        # ___chkstk_darwin, which libcompiler_rt hides from iOS 7.0-12.1 links (#2146). ~keep
        # MACOSX_DEPLOYMENT_TARGET likewise equals the `.macOS(.vN)` floor, which is the
        # workflow-wide macOS floor (the bundled ONNX Runtime prebuilt needs 13.4 or later). ~keep
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        with:
          crate-name: xberg-swift
          artifact-name: Xberg-rs
          include-macos-x86_64: "false"
          include-ios-x86_64: "false"
          # Build-only: stages `<triple>/libxberg_swift.a` under libs-dir and assembles nothing.
          targets: ${{ matrix.target }}
          zig-version: "0.17.0"

      - uses: actions/upload-artifact@v7
        with:
          name: swift-lib-${{ matrix.target }}
          path: ${{ steps.libs.outputs.libs-dir }}
          if-no-files-found: error
          retention-days: 14

  swift-artifactbundle:
    name: Build Swift artifact bundle
    # Keeps its name: upload-swift-bundle and update-swift-package-manifest both gate on this
    # job's result, so renaming it would silently skip the release upload. ~keep
    needs: [prepare, swift-target]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_swift == 'true') }}
    runs-on: macos-26
    # Assemble mode compiles nothing -- it lipos, zips and checksums already-built libraries, so
    # neither Rust nor the system deps are installed here. ~keep
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - uses: actions/download-artifact@v8
        with:
          pattern: swift-lib-*
          merge-multiple: true
          path: swift-libs

      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: bundle
        with:
          crate-name: xberg-swift
          # Must match the asset filename the alef-generated root Package.swift
          # binaryTarget resolves: `<name>.artifactbundle.zip`. The manifest
          # references Xberg-rs.artifactbundle.zip, so the uploaded asset (named
          # after artifact-name) must be Xberg-rs, not XbergSwift, or SwiftPM 404s. ~keep
          artifact-name: Xberg-rs
          include-macos-x86_64: "false"
          include-ios-x86_64: "false"
          prebuilt-libs-dir: swift-libs
          additional-license-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: ${{ steps.bundle.outputs.bundle-zip }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: swift-checksum
          path: ${{ steps.bundle.outputs.checksum-file }}
          if-no-files-found: error
          retention-days: 14

  swift-package:
    name: Build Swift package
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_swift == 'true') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          macos-dynamic-lookup: "false"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-swift-package@v1
        with:
          package-dir: packages/swift
          crate-name: xberg-swift

      - uses: actions/upload-artifact@v7
        with:
          name: swift-package
          path: packages/swift
          retention-days: 14

  update-swift-package-manifest:
    name: Update Swift Package.swift manifest with version and checksum
    # A real release checks the exact uploaded asset; a dry run checks the run artifact
    # because upload-release-assets intentionally creates no release. Only the real
    # release may rewrite Package.swift or move remote refs. ~keep
    # A skipped upload means the bundle is already on the release; the job still runs so a
    # release whose upload landed but whose manifest update did not gets pinned, and it moves
    # nothing when the tag's Package.swift already pins that exact bundle. ~keep
    needs: [prepare, upload-swift-bundle]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_swift == 'true' && (needs.upload-swift-bundle.result == 'success' || (needs.upload-swift-bundle.result == 'skipped' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          name: swift-artifactbundle
          path: bundle-dl

      - name: Compute checksum from the artifact bundle
        id: checksum
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern 'Xberg-rs.artifactbundle.zip' --dir bundle-dl --clobber
          fi
          CHECKSUM=$(sha256sum bundle-dl/Xberg-rs.artifactbundle.zip | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already pins this bundle
        id: pinned
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          set -euo pipefail
          # Read the remote tag, not the checkout: a re-run may have checked out the
          # pre-move commit while an earlier run already moved the tag. ~keep
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          manifest="$(git show "refs/tags/${TAG}:Package.swift")"
          if grep -qF "/releases/download/${TAG}/Xberg-rs.artifactbundle.zip\"" <<<"$manifest" \
            && grep -qE "checksum:[[:space:]]*\"${CHECKSUM}\"" <<<"$manifest"; then
            echo "Package.swift at ${TAG} already pins ${CHECKSUM}; leaving the tag where it is"
            echo "pinned=true" >>"$GITHUB_OUTPUT"
          else
            echo "pinned=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Update Package.swift with version and checksum
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.pinned.outputs.pinned != 'true' }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"

          # Substitute version + checksum. Match the current value (placeholder OR a
          # real prior checksum), so a re-run re-pins the freshly-computed checksum
          # instead of no-op'ing on an already-substituted manifest.
          sed -i "s/__ALEF_SWIFT_VERSION__/${VERSION}/g" Package.swift
          sed -i -E "s|(checksum:[[:space:]]*\")[^\"]*(\")|\1${CHECKSUM}\2|" Package.swift

          echo "Updated Package.swift:"
          head -40 Package.swift

      - name: Commit and push Package.swift
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.pinned.outputs.pinned != 'true' }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(swift): update Package.swift with checksum for v${{ needs.prepare.outputs.version }}"
          git tag -f "${{ needs.prepare.outputs.tag }}"
          git push origin -f "refs/tags/${{ needs.prepare.outputs.tag }}"
          # Also publish the checksummed commit to a release/swift/<version> branch. The
          # alef-generated Swift e2e/test-app pins `branch: "release/swift/<version>"`, so this
          # ref must exist for SwiftPM to resolve the package with the substituted XCFramework
          # checksum.
          git push origin -f "HEAD:refs/heads/release/swift/${{ needs.prepare.outputs.version }}"

      - name: Ensure the release/swift branch exists
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.pinned.outputs.pinned == 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # HEAD may be the pre-pin commit; the branch must carry the pinned manifest. ~keep
          branch="refs/heads/release/swift/${VERSION}"
          if git ls-remote --exit-code origin "$branch" >/dev/null; then
            echo "$branch exists"
          else
            git push origin "refs/tags/${TAG}^{commit}:${branch}"
          fi

  zig-package:
    name: Build Zig package (smoke check)
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_zig == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-zig-package@v1
        with:
          ffi-crate: xberg-ffi
          package-dir: packages/zig

  cli-proxy-wheels:
    name: Build CLI proxy wheel (${{ matrix.target }})
    needs: [prepare, check-cli, cli-binaries, cli-binaries-musl]
    # Runs on dry runs too, matching `check-cli` and `zig-package`. This job is where the
    # runtime wheel-payload smoke test lives (GH#1407), and gating it on `is_tag` alone meant
    # a dry run SKIPPED the one check that would have caught a 257-byte launcher wheel -- the
    # matrix never expanded, so the run went green having exercised nothing. Safe to widen:
    # the job ends at `upload-artifact` and contains no twine, token or secret, and
    # `cli-binaries`/`cli-binaries-musl` carry no `is_tag` term either, so they produce real
    # binaries on a dry run rather than stubs. ~keep
    if: >-
      ${{ !inputs.plugins-only && ((needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.cli-binaries.result == 'success' && needs.cli-binaries-musl.result == 'success' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin }
          - { target: aarch64-unknown-linux-gnu }
          - { target: aarch64-unknown-linux-musl }
          - { target: x86_64-apple-darwin }
          - { target: x86_64-unknown-linux-gnu }
          - { target: x86_64-unknown-linux-musl }
          - { target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python
          config-ref: ${{ github.sha }}

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-${{ matrix.target }}
          path: dist-cli-binaries
          merge-multiple: true

      - name: Prepare binary for wheel
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"

          # Find the binary artifact
          if [ -f "dist-cli-binaries/xberg-cli-${TARGET}.tar.gz" ]; then
            ARTIFACT="dist-cli-binaries/xberg-cli-${TARGET}.tar.gz"
          elif [ -f "dist-cli-binaries/xberg-cli-${TARGET}.zip" ]; then
            ARTIFACT="dist-cli-binaries/xberg-cli-${TARGET}.zip"
          else
            echo "Error: No binary found for ${TARGET}"
            ls -la dist-cli-binaries/ || true
            exit 1
          fi

          # Extract to repo root so hatch_build.py can find it
          cp "$ARTIFACT" "xberg-cli-${TARGET}.$([ "${ARTIFACT##*.}" = "gz" ] && echo tar.gz || echo zip)"
          echo "Binary prepared: xberg-cli-${TARGET}.*"

      - name: Build wheel with bundled binary
        shell: bash
        working-directory: cli-proxy/pypi
        env:
          XBERG_CLI_TARGET: ${{ matrix.target }}
        run: |
          pip install hatchling build
          python -m build --wheel

      # Runtime half of the wheel payload guard. `hatch_build.py` refuses to
      # build a wheel whose staged payload is incomplete, but a build-time file
      # check cannot prove the packaged binary actually starts: `xberg_cli-1.0.14`
      # musllinux reached PyPI as a 257-byte launcher script with neither
      # `xberg.bin` nor the `lib/` tree it execs (GH#1407). Unzip the wheel and
      # run the binary it ships, mirroring the tarball smoke tests in the
      # `cli-binaries` job (`compgen -G` + `env -u LD_LIBRARY_PATH ... --version`)
      # so a wheel cannot pass on a library the runner happens to have.
      - name: Smoke-test wheel payload
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu | x86_64-unknown-linux-musl) ;;
            *)
              echo "::notice title=Wheel smoke test not run::${TARGET} binaries cannot execute on this x86_64 linux runner; the ${TARGET} wheel payload is covered only by the build-time checks in cli-proxy/pypi/hatch_build.py"
              exit 0
              ;;
          esac

          shopt -s nullglob
          wheels=(cli-proxy/pypi/dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in cli-proxy/pypi/dist, found ${#wheels[@]}"
            exit 1
          fi

          UNPACK="${RUNNER_TEMP}/wheel-smoke/${TARGET}"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          unzip -q "${wheels[0]}" -d "$UNPACK"

          STAGE="${UNPACK}/xberg_cli/bin/${TARGET}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::wheel ships no payload directory xberg_cli/bin/${TARGET}"
            find "$UNPACK" -maxdepth 4
            exit 1
          fi
          # Wheels do not reliably carry the execute bit through force_include.
          find "$STAGE" -type f -exec chmod u+rx {} +
          case "$TARGET" in
            *-unknown-linux-gnu)
              compgen -G "$STAGE/libheif.so*" >/dev/null \
                || { echo "::error::wheel payload for ${TARGET} has no libheif.so* beside the binary"; ls -la "$STAGE"; exit 1; }
              ;;
            *-unknown-linux-musl)
              test -f "$STAGE/xberg.bin" \
                || { echo "::error::wheel payload for ${TARGET} has no xberg.bin; 'xberg' is only a launcher script"; ls -la "$STAGE"; exit 1; }
              compgen -G "$STAGE/lib/ld-musl-*.so.1" >/dev/null \
                || { echo "::error::wheel payload for ${TARGET} has no lib/ld-musl-*.so.1 for the launcher to exec"; ls -la "$STAGE"; exit 1; }
              ;;
          esac
          # On failure, dump the closure before exiting. The loader's own message
          # usually names the missing library, but on musl `$STAGE/xberg` is a
          # launcher script that execs `ld-musl-*.so.1 xberg.bin`, so the failure
          # is one indirection away from the binary that actually failed to link
          # and the bare message can be ambiguous. Task #490 has been unable to
          # name the missing library across several cycles precisely because the
          # evidence was never captured at the moment of failure; this makes one
          # run conclusive instead of buying another round trip. Diagnostics only
          # -- the `exit 1` preserves the existing failure behaviour exactly.
          if ! env -u LD_LIBRARY_PATH "$STAGE/xberg" --version; then
            echo "::group::vendor closure for ${TARGET}"
            ls -la "$STAGE" || true
            for probe in "$STAGE/xberg.bin" "$STAGE/xberg"; do
              [ -f "$probe" ] || continue
              echo "--- readelf -d $probe (NEEDED/RPATH/RUNPATH) ---"
              readelf -d "$probe" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || echo "(not an ELF, or readelf unavailable)"
              echo "--- ldd $probe ---"
              ldd "$probe" 2>&1 || true
            done
            echo "::endgroup::"
            echo "::error::wheel payload for ${TARGET} failed to run; see the closure dump above for the unresolved library"
            exit 1
          fi
          echo "Wheel smoke test passed for ${TARGET}: $(basename "${wheels[0]}")"

      # The payload is copied from the CLI release tarball, which carries libheif and friends.
      # The tarball's own LICENSE/THIRD_PARTY files land under xberg_cli/bin/<target>/; add the
      # canonical set to .dist-info/licenses as well, then gate both copies.
      - name: Inject canonical notices (CLI proxy wheel)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(cli-proxy/pypi/dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || {
            echo "::error::expected exactly one CLI proxy wheel, found ${#wheels[@]}"; exit 1;
          }
          python3 scripts/ci/package-notices.py inject --format wheel --expected-count 1 "${wheels[@]}"

      - name: Verify CLI proxy wheel notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: cli-proxy/pypi/dist
          artifact-format: wheel
          expected-artifact-count: "1"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: cli-proxy-wheel-${{ matrix.target }}
          path: cli-proxy/pypi/dist/*.whl
          retention-days: 14

  upload-cli-release:
    name: Upload CLI binaries to GitHub Release
    needs: [prepare, check-cli, cli-binaries, cli-binaries-musl, cli-binaries-binstall]
    # Requiring all three to succeed meant one failed matrix leg skipped this job
    # outright, publishing a release with NONE of the nine CLI archives: v1.2.0
    # shipped 12 assets and v1.2.1 shipped 54, both with zero `xberg-cli-*`, off a
    # single hung aarch64-musl link (#1638). A skipped job reports no failure, so
    # two releases went out before anyone noticed. Upload whatever did build, and
    # let the completeness step below fail the run on the shortfall. ~keep
    # Skipped when every asset is already on the release: a rebuild for the PyPI proxy must not
    # replace archives whose hashes Scoop, Homebrew and binstall already consumed. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && (needs.check-cli.outputs.assets_exist != 'true' || needs.prepare.outputs.force_republish == 'true') && (needs.cli-binaries.result == 'success' || needs.cli-binaries-musl.result == 'success' || needs.cli-binaries-binstall.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      # A retry of an older tag runs this workflow revision, which can postdate the source that
      # built the archives. Take the verifier from the workflow revision so it exists, and the
      # canonical notice bytes from the checkout the build jobs packed them from. ~keep
      - name: Checkout the CLI notice verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .notice-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/package-notices.py

      - name: Checkout the release notice bundle
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: .release-notices
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            LICENSE
            THIRD_PARTY_LICENSES.md

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true

      # These are the bytes that become release assets, so verify the archives themselves and
      # not the scripts that built them: `package-notices.py verify` opens each one and compares
      # both notices with the release source's generated copies. A missing, empty, truncated or
      # stale notice fails here, naming the archive and file, before anything is uploaded. Each
      # archive packs a single top-level directory named after the archive, which is its prefix;
      # `prepare`'s exact asset names supply both, never a glob. A leg that failed to build leaves
      # its archive absent (the live asset gate names that shortfall and the partial upload still
      # lets a retry resume), but this step fails when it would otherwise verify nothing. One
      # step over the collected `dist/cli`, not a copy in every build matrix leg. ~keep
      - name: Verify notice bytes in every CLI archive
        shell: bash
        env:
          CLI_ASSETS: ${{ needs.prepare.outputs.cli_assets_multiline }}
          NOTICE_ROOT: ${{ github.workspace }}/.release-notices
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            assets+=("$asset")
          done <<<"$CLI_ASSETS"
          test "${#assets[@]}" -gt 0 || { echo "::error::no expected CLI archives to verify"; exit 1; }
          verified=0
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.tar.gz) prefix="${asset%.tar.gz}" ;;
              *.zip) prefix="${asset%.zip}" ;;
              *) echo "::error::unsupported CLI archive name: $asset"; exit 1 ;;
            esac
            archive="dist/cli/$asset"
            if [ ! -e "$archive" ]; then
              echo "::warning::no CLI archive at $archive; the live asset gate reports the shortfall"
              continue
            fi
            test -s "$archive" || { echo "::error::empty CLI archive: $archive"; exit 1; }
            python3 .notice-tools/scripts/ci/package-notices.py verify \
              --canonical-root "$NOTICE_ROOT" "$archive" "$prefix"
            verified=$((verified + 1))
          done
          test "$verified" -gt 0 || { echo "::error::no staged CLI archive was verified"; exit 1; }
          echo "Verified notices in $verified CLI archives"

      # `cli-*` also matches the `cli-binstall-*` and `cli-proxy-wheel-*` artifacts, so the
      # uploader is given prepare's ten explicit names rather than an `xberg-cli-*.zip` glob:
      # only the archives the release is expected to carry can be attached. ~keep
      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/cli
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: ${{ needs.prepare.outputs.cli_assets_multiline }}

      # The upload above attaches whatever built. Without a gate the run stays green on a
      # partial CLI set, which is the half of #1638 that let it recur: the release itself
      # looked fine and only a user's `mise install` surfaced it. The gate reads the LIVE
      # release against prepare's ten explicit names, never `dist/cli`: a local check proves
      # only what this run built, and the glob pair it used (`xberg-cli-*.zip`) matched the
      # plain Windows zip, so a missing `-no-gpl-lgpl` archive was invisible. ~keep
      - name: Verify the live release carries every CLI archive
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/verify-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: ${{ needs.prepare.outputs.cli_assets_multiline }}

  # Prove a consumer can actually `cargo binstall xberg-cli` the freshly uploaded
  # (--manifest-path) so it verifies the exact metadata against the release assets
  # without waiting on the crates.io publish. Only the musl targets have binstall
  # archives, so the matrix is overridden to those triples.
  verify-binstall:
    name: Verify cargo-binstall
    needs: [prepare, finalize-github-release-after-uploads]
    # Not runnable on a dry run, and not adaptable to local artifacts: `cargo binstall` resolves
    # and downloads its archive over HTTP from a real, published GitHub Release, which a dry run
    # never creates (see the "Ensure GitHub Release exists" step). This is the reusable workflow's
    # entire job -- proving the public download URL resolves -- so there is no local-artifact
    # substitute that would still test the thing this job exists to test. A dry run therefore does
    # NOT verify that a consumer can actually `cargo binstall xberg-cli` against this release. ~keep
    # It follows finalize, not upload-cli-release: prepare now also creates the release as a draft
    # and only finalize un-drafts it after verify-assets passes, so before that point the asset
    # URLs are not publicly downloadable and binstall would 404 on a healthy release. ~keep
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.finalize-github-release-after-uploads.result == 'success' && needs.prepare.outputs.dry_run != 'true') }}
    permissions:
      contents: read
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: xberg-cli
      binary-name: xberg
      manifest-path: crates/xberg-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      targets: >-
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"}
        ]

  upload-go-release:
    name: Upload Go FFI archives to GitHub Release
    needs: [prepare, check-go, go-ffi-libraries]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_go == 'true' && (needs.prepare.outputs.dry_run == 'true' || (needs.check-go.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: GitHub Release (Go FFI)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            go-ffi-libraries

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: go-ffi-*
          path: dist/go-ffi
          merge-multiple: true

      # The generated Go cmd/setup tool verifies each downloaded archive against
      # its .sha256 sidecar before extracting (dart download_libs parity), so the
      # sidecars must ship as release assets alongside the tarballs. ~keep
      - name: Generate SHA-256 sidecars for cmd/setup verification
        shell: bash
        run: |
          set -euo pipefail
          cd dist/go-ffi
          for t in xberg-go-*.tar.gz; do
            sha256sum "$t" > "$t.sha256"
          done
          ls -la

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/go-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          # Trailing * includes the .sha256 sidecars (same pattern as dart). ~keep
          assets: xberg-go-*.tar.gz*

  tag-go-module:
    name: Tag Go module for pkg.go.dev resolution
    # Must run AFTER update-swift-package-manifest force-moves the release tag onto
    # the Package.swift-checksum commit. Otherwise this job races the tag-mover and
    # its checkout asserts the original triggering SHA, failing with "ref does not
    # point to expected commit". Ordering also removes a concurrent tag-push race.
    # `skipped` is accepted so a non-Swift release still tags the Go module. ~keep
    # A skipped Go upload is accepted when check-go found the archives already released, so a
    # re-run can still tag; the tag script is a no-op when the tags already name the release
    # commit and fails when they name another. ~keep
    needs: [prepare, check-go, upload-go-release, update-swift-package-manifest]
    # dry-run releases must NEVER mint real remote tags; the tag script has no
    # dry-run awareness of its own, so this job is skipped entirely when dry_run
    # is true instead of trying to thread a flag through the script. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.upload-go-release.result == 'success' || (needs.upload-go-release.result == 'skipped' && needs.check-go.outputs.exists == 'true')) && (needs.update-swift-package-manifest.result == 'success' || needs.update-swift-package-manifest.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          # Pin to the tag by name so checkout takes its CURRENT commit rather
          # than asserting the triggering `github.sha`. update-swift-package-manifest
          # force-moves this tag onto the Package.swift-checksum commit before this
          # job runs; without an explicit ref, checkout fails "ref does not point to
          # the expected commit". Tagging the Go module at the moved (released) tip
          # is correct for pkg.go.dev. ~keep
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "xberg-bot[bot]"
          git config user.email "xberg-bot[bot]@users.noreply.github.com"

      - name: Create and push packages/go tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/publish/go/tag-and-push-go-module.sh "${{ needs.prepare.outputs.tag }}"

  upload-c-ffi-release:
    name: Upload C FFI archives to GitHub Release
    needs: [prepare, check-c-ffi, c-ffi-libraries]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_c_ffi == 'true' && (needs.check-c-ffi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: GitHub Release (C FFI)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            c-ffi-libraries

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/c-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: xberg-ffi-*.tar.gz

  upload-elixir-release:
    name: Upload Elixir NIF archives to GitHub Release
    needs: [prepare, check-elixir-release, elixir-natives, elixir-natives-musl, elixir-natives-manylinux]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' &&
          needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true' &&
          (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: GitHub Release (Elixir NIFs)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            elixir-natives
            elixir-natives-musl
            elixir-natives-manylinux

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: elixir-*
          path: dist/elixir
          merge-multiple: true

      - name: Verify current-run Elixir archives
        shell: bash
        env:
          NIF_ASSETS: ${{ needs.prepare.outputs.elixir_assets }}
        run: |
          set -euo pipefail
          IFS=, read -ra names <<< "$NIF_ASSETS"
          if [[ "${#names[@]}" != 6 ]]; then
            echo "::error::Expected six Elixir NIF asset names"
            exit 1
          fi
          for name in "${names[@]}"; do
            if [[ ! -s "dist/elixir/$name" ]]; then
              echo "::error::Missing current-run Elixir NIF archive: $name"
              exit 1
            fi
          done

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/elixir
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: ${{ needs.prepare.outputs.elixir_assets }}

  upload-php-pie-release:
    name: Upload PHP PIE archives to GitHub Release
    needs: [prepare, php-extension]
    # php-extension is a fail-fast:false matrix (php x platform). Gating on
    # result == 'success' discards every leg's archive -- including working
    # ones -- whenever a single unrelated cell fails (xberg-io/xberg#1585:
    # one Windows/php8.3 leg hit a transient upstream 504 and the whole PHP
    # release went out with zero assets). Upload whatever legs did produce
    # an artifact instead of requiring all of them to succeed. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.is_tag == 'true' && needs.php-extension.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: php-package-*
          path: dist/php-package
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: |
            php_*.tgz
            php_*.tgz.sha256
            php_*.zip
            php_*.zip.sha256

  upload-swift-bundle:
    name: Upload Swift artifact bundle to GitHub Release
    needs: [prepare, check-swift, swift-artifactbundle]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_swift == 'true' && (needs.check-swift.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: GitHub Release (Swift)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            swift-artifactbundle

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
          path: dist/swift-bundle

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift-bundle
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: "*.zip"

  verify-assets:
    name: Verify release assets
    needs:
      - prepare
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
    # Runs on dry runs too, but checks different evidence. A real tag verifies against the
    # live GitHub Release (verify-release-assets queries it by tag, which does not exist on a
    # dry run — nothing is ever created at line ~150). A dry run instead verifies the same
    # selected CLI/Go FFI/C FFI run-artifacts that upload-*-release would have uploaded.
    # Elixir and PHP are NOT covered here: elixir-natives and php-extension both skip
    # producing real artifacts on a dry run (see their own ~keep comments), so
    # upload-elixir-release/upload-php-pie-release have nothing to check and a dry run does not
    # verify NIF or PHP-PIE asset packaging. ~keep
    #
    # No `!contains(needs.*.result, 'failure')` term: that made this job skip exactly when an
    # upload failed, so a failed `upload-cli-release` was never contradicted by the live
    # release and `finalize-github-release-after-uploads` could not be told apart from a
    # green run. A skipped verifier is not evidence. On a real tag this job therefore runs
    # after a failed upload, inspects the release, and fails naming the absent assets. ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Mint the App token for release asset lookups (push access), consistent
      # with finalize and the other release-writing jobs. Without it the lookup
      # failed every retry with "release not found", skipping finalize and
      # cascading into a skipped Homebrew bottle build (issue #1247). ~keep
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/verify-release-assets@v1
        name: Verify CLI release assets
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_cli == 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          # Exact names from `prepare`, shared with check-cli and upload-cli-release. No
          # glob: `xberg-cli-*.zip` matched the plain Windows zip and hid an absent
          # `-no-gpl-lgpl` archive. ~keep
          expected-assets: ${{ needs.prepare.outputs.cli_assets_multiline }}

      - uses: xberg-io/actions/verify-release-assets@v1
        name: Verify Go FFI release assets
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_go == 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            xberg-go-*.tar.gz

      - uses: xberg-io/actions/verify-release-assets@v1
        name: Verify C FFI release assets
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_c_ffi == 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            xberg-ffi-*.tar.gz

      - uses: xberg-io/actions/verify-release-assets@v1
        name: Verify PHP PIE release assets
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_php == 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            # Require every supported PHP version and platform (#2113).
            php_xberg-*_php8.3-x86_64-linux-glibc-nts.tgz
            php_xberg-*_php8.3-arm64-linux-glibc-nts.tgz
            php_xberg-*_php8.3-arm64-darwin-bsdlibc-nts.tgz
            php_xberg-*-8.3-nts-vs17-x86_64.zip
            php_xberg-*_php8.4-x86_64-linux-glibc-nts.tgz
            php_xberg-*_php8.4-arm64-linux-glibc-nts.tgz
            php_xberg-*_php8.4-arm64-darwin-bsdlibc-nts.tgz
            php_xberg-*-8.4-nts-vs17-x86_64.zip
            php_xberg-*_php8.5-x86_64-linux-glibc-nts.tgz
            php_xberg-*_php8.5-arm64-linux-glibc-nts.tgz
            php_xberg-*_php8.5-arm64-darwin-bsdlibc-nts.tgz
            php_xberg-*-8.5-nts-vs17-x86_64.zip

      - uses: xberg-io/actions/verify-release-assets@v1
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_elixir == 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: ${{ needs.prepare.outputs.elixir_assets_multiline }}

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.release_cli == 'true' }}
        with:
          pattern: cli-*
          path: dist/verify-assets/cli
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.release_go == 'true' }}
        with:
          pattern: go-ffi-*
          path: dist/verify-assets/go-ffi
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.release_c_ffi == 'true' }}
        with:
          pattern: c-ffi-*
          path: dist/verify-assets/c-ffi
          merge-multiple: true

      # Same expected set as the live-release check above, minus Elixir/PHP (not
      # built on a dry run -- see the job comment). CLI uses prepare's ten exact names;
      # Go FFI and C FFI keep their prefix globs. Checks the run-artifacts directly rather
      # than a GitHub Release, since a dry run never creates one. ~keep
      - name: Verify locally built release assets
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        env:
          RELEASE_CLI: ${{ needs.prepare.outputs.release_cli }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_C_FFI: ${{ needs.prepare.outputs.release_c_ffi }}
          CLI_ASSETS: ${{ needs.prepare.outputs.cli_assets_multiline }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A globs=()
          if [[ "$RELEASE_CLI" == 'true' ]]; then
            globs["dist/verify-assets/cli"]="$CLI_ASSETS"
          fi
          if [[ "$RELEASE_GO" == 'true' ]]; then
            globs["dist/verify-assets/go-ffi"]="xberg-go-*.tar.gz"
          fi
          if [[ "$RELEASE_C_FFI" == 'true' ]]; then
            globs["dist/verify-assets/c-ffi"]="xberg-ffi-*.tar.gz"
          fi
          missing=0
          for dir in "${!globs[@]}"; do
            for pattern in ${globs[$dir]}; do
              if ! compgen -G "${dir}/${pattern}" >/dev/null; then
                echo "::error::no local asset matched ${dir}/${pattern}" >&2
                missing=1
              else
                echo "OK: ${dir}/${pattern}"
              fi
            done
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::one or more expected dry-run release assets were not built" >&2
            exit 1
          fi

  # Publish-job gating. A job's `if:` says only whether its channel is wanted (target
  # selected, tag, version not yet on the registry); its first step, require-job-results,
  # then fails the job, naming the channel, when a build or upload it publishes from did not
  # succeed. Putting `needs.<build>.result == 'success'` in the `if:` instead SKIPS the job
  # on one failed matrix leg, and a skipped job leaves the run looking healthy for a channel
  # that never shipped. Every registry channel is all-or-nothing per version: npm's parent
  # package pins each platform package, Maven and NuGet versions are immutable once released,
  # RubyGems/Hex/pub.dev versions cannot be replaced, and a PyPI wheel missing for a platform
  # silently degrades pip to a source build. Channels depend on publish-crates only when they
  # build or ship something that resolves the xberg crates from crates.io (python-sdist, the
  # Ruby gem, the PHP extension, the Elixir NIFs and Hex package), and accept it `skipped`,
  # which is what a re-run with every crate already published produces; they also require
  # check-cratesio and validate-versions, whose failure would skip publish-crates too. WASM is
  # the one exception: wasm-bindings is continue-on-error by design, so publish-wasm keeps
  # its success requirement in the `if:` and stays best-effort. publish-crates also runs on a
  # dry run, where the action verifies the whole set with one multi-package
  # `cargo publish --dry-run` and never publishes (its `dry-run` input is the dry_run output);
  # a real publish still needs is_tag. check-cratesio, which it needs, runs on dry runs too
  # (read-only registry lookup); a skipped need would skip publish-crates. ~keep
  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, validate-versions, check-cratesio]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_crates == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-cratesio.outputs.all_exist != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/publish-crates@v1
        with:
          crates: xberg-libheif xberg-tesseract xberg-paddle-ocr xberg-candle-ocr xberg-gliner xberg-libwpd xberg-native-pdf xberg-pdfium-render xberg xberg-cli
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-pypi:
    name: Publish to PyPI
    needs:
      [
        prepare,
        python-wheels,
        python-wheels-musl,
        python-sdist,
        check-pypi,
        publish-crates,
        validate-versions,
        check-cratesio,
      ]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.release_python == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: python-archive-xberg-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: PyPI
          needs: ${{ toJSON(needs) }}
          succeeded: |
            python-wheels
            python-wheels-musl
            ${{ needs.prepare.outputs.dry_run != 'true' && 'python-sdist' || '' }}
          succeeded-or-skipped: |
            validate-versions
            check-cratesio
            publish-crates
            ${{ needs.prepare.outputs.dry_run == 'true' && 'python-sdist' || '' }}

      - name: Checkout publication helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout pinned shared publication verifier
        uses: actions/checkout@v7
        with:
          repository: xberg-io/actions
          ref: v1
          path: .python-publication-actions
          persist-credentials: false
      - name: Install mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.dry_run != 'true'
        with:
          name: python-sdist
          path: dist

      - name: Verify Python wheel package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: dist
          package-name: xberg
          strict: "false"

      - name: Create central archive token
        if: needs.prepare.outputs.dry_run != 'true'
        id: archive-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: python-wheels
          permission-contents: write
      - name: Prepare public Python archive release
        if: needs.prepare.outputs.dry_run != 'true'
        id: archive-release
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: mise run python:publish:archive:prepare
      - name: Archive every Python distribution permanently
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/archive-python@v1
        with:
          packages-dir: dist
          repository: xberg-io/python-wheels
          tag: ${{ steps.archive-release.outputs.tag }}
          expected-version: ${{ needs.prepare.outputs.version }}
          output-dir: python-index
          token: ${{ steps.archive-token.outputs.token }}
      - name: Wait for every distribution in the public Python index
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: mise run python:publish:archive:wait
      - name: Publish primarily to PyPI
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          expected-version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          fallback-index-url: https://xberg-io.github.io/python-wheels/simple/

  publish-cli-proxy:
    name: Publish CLI proxy to PyPI (wheels + sdist)
    needs: [prepare, check-cli, cli-proxy-wheels, finalize-github-release-after-uploads]
    # The sdist is a downloader: installing it resolves the release by tag through the public
    # API, which cannot see a draft. Publishing before finalize would hand users a version that
    # 404s for the length of the run and forever if the run dies, and a PyPI version cannot be
    # replaced. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.dry_run == 'true' || needs.finalize-github-release-after-uploads.result == 'success') && (needs.check-cli.outputs.pypi_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: PyPI (xberg-cli)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            cli-proxy-wheels

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python
          config-ref: ${{ github.sha }}

      - name: Download CLI proxy wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cli-proxy-wheel-*
          path: dist
          merge-multiple: true

      - name: Build CLI proxy sdist (fallback with downloader)
        working-directory: cli-proxy/pypi
        run: |
          pip install hatchling build
          python -m build --sdist
          cp dist/*.tar.gz ../../dist/

      - name: Verify CLI proxy package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: dist
          package-name: xberg-cli
          strict: "false"

      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-rubygems:
    name: Publish Ruby gems
    needs: [prepare, ruby-gem, check-rubygems, publish-crates, validate-versions, check-cratesio]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_ruby == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: RubyGems
          needs: ${{ toJSON(needs) }}
          succeeded: |
            ruby-gem
          succeeded-or-skipped: |
            validate-versions
            check-cratesio
            publish-crates

      # Only the mise config, the canonical notices and the gemspec that names the source gem,
      # so setup-mise installs the locked Ruby and the shared verifier can read canonical-root. ~keep
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mise.toml
            mise*.lock
            mise-tasks
            LICENSE
            THIRD_PARTY_LICENSES.md
            packages/ruby/xberg.gemspec
            scripts/ci/merge-ruby-native-gems.rb

      - uses: actions/download-artifact@v8
        with:
          pattern: rubygems-*
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: rubyext-*
          path: dist

      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: ruby

      - name: Update RubyGems for OIDC trusted publishing
        run: gem update --system

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      # The linux-x86_64 leg keeps the source gem (KEEP_SOURCE=true) beside its native gem, so
      # the four matrix legs contribute five files: one source gem plus four platform gems.
      # Every one is built from the patched gemspec and carries the notices; assert the exact
      # inventory before the shared verifier checks bytes.
      - name: Assert the expected gem inventory
        run: |
          set -euo pipefail
          shopt -s nullglob
          gems=(dist/rubygems-*/*.gem)
          names=()
          for gem in "${gems[@]}"; do names+=("$(basename "$gem")"); done
          # Gem::Specification#file_name is exactly what `rake build` wrote, including the
          # RubyGems prerelease normalization (`1.5.0-rc.1` -> `1.5.0.pre.rc.1`). The raw
          # prepare version would not match for a prerelease.
          expected_source="$(ruby -rrubygems -e 'print Gem::Specification.load("packages/ruby/xberg.gemspec").file_name')"
          platforms=(x86_64-linux aarch64-linux arm64-darwin x64-mingw-ucrt)
          sources=()
          for name in "${names[@]}"; do
            native=0
            for platform in "${platforms[@]}"; do
              [[ "$name" == xberg-*-"$platform".gem ]] && native=1
            done
            [ "$native" -eq 0 ] && sources+=("$name")
          done
          if [ "${#sources[@]}" -ne 1 ] || [ "${sources[0]}" != "$expected_source" ]; then
            echo "::error::expected the retained source gem to be ${expected_source}, found: ${sources[*]:-none}"
            exit 1
          fi
          for platform in "${platforms[@]}"; do
            matches=0
            for name in "${names[@]}"; do
              [[ "$name" == xberg-*-"$platform".gem ]] && matches=$((matches + 1))
            done
            [ "$matches" -eq 1 ] || {
              echo "::error::expected exactly one $platform gem, found $matches: ${names[*]}"
              exit 1
            }
          done
          [ "${#gems[@]}" -eq 5 ] || {
            echo "::error::expected five gems (one source plus four platform gems), found ${#gems[@]}: ${names[*]}"
            exit 1
          }
          printf 'Gem inventory (%d): %s\n' "${#names[@]}" "${names[*]}"
        shell: bash

      # The 3.3 leg of each non-Windows platform built a fat gem holding only the Ruby 3.3 extension;
      # add the 3.4 and 4.0 extensions so one gem per platform loads on every supported Ruby. The
      # script fails unless every ABI is present, and the inventory above is unchanged. ~keep
      - name: Merge the per-Ruby extensions into the platform gems
        run: |
          set -euo pipefail
          ruby scripts/ci/merge-ruby-native-gems.rb dist 3.3.0,3.4.0,4.0.0 \
            linux-x86_64:x86_64-linux linux-aarch64:aarch64-linux macos-arm64:arm64-darwin
        shell: bash

      # The gemspec lists THIRD_PARTY_LICENSES.md, so both notices are already inside each
      # gem's data.tar.gz and checksums.yaml.gz; this only re-reads the built bytes.
      - name: Verify Ruby gem package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: ruby
          artifact-path: dist
          package-name: xberg
          artifact-format: gem
          expected-artifact-count: "5"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .

      - uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-node:
    name: Publish Node packages
    needs: [prepare, node-bindings, node-bindings-musl, node-bindings-manylinux, check-npm]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.release_node == 'true' && (needs.prepare.outputs.dry_run == 'true' || (needs.check-npm.result == 'success' && needs.prepare.outputs.is_tag == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: npm
          needs: ${{ toJSON(needs) }}
          succeeded: |
            node-bindings
            node-bindings-musl
            node-bindings-manylinux

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.checkout_ref || needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: node-bindings-*
          path: node-artifacts
          merge-multiple: true

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Stage platform packages and main package
        shell: bash
        run: |
          # Every node-bindings artifact ships the canonical napi layout
          # (npm/<napi-platform>/{package.json,*.node}); the macOS/Windows legs
          # also carry index.js + index.d.ts at the tarball root. Extract them,
          # pack each platform sub-package that has both a package.json and a
          # built .node, and stamp the main package's optionalDependencies from
          # exactly those sub-packages. Platform dirs that napi created but no
          # job built (e.g. win32-arm64-msvc) have a package.json but no .node —
          # skip them so we never publish an empty package or reference it.
          # Extract each artifact in ISOLATION and copy only the platform dirs
          # that actually contain a built .node. `napi create-npm-dirs` stamps a
          # package.json stub for EVERY platform into EVERY artifact, so a blind
          # `tar -xzf` of all artifacts onto one shared tree lets a later
          # artifact's empty stub clobber the dylib-aware package.json a
          # platform's own artifact produced — resetting `files` to just the
          # .node, which makes `npm pack` silently drop the vendored ORT dylib
          # (rc.21 shipped darwin-arm64/-x64 + linux-arm64-gnu broken this way).
          # Copying only dirs-that-have-a-.node makes the merge a union of
          # populated dirs, immune to extraction order.
          rm -rf crates/xberg-node/npm
          mkdir -p crates/xberg-node/npm
          for pkg in node-artifacts/*.tar.gz; do
            scratch="$(mktemp -d)"
            tar -xzf "${pkg}" -C "${scratch}"
            for dir in "${scratch}"/npm/*/; do
              if ls "${dir}"*.node >/dev/null 2>&1; then
                # strip trailing slash so `cp -R src dest/` copies the dir
                # itself, not its contents (BSD/macOS cp semantics; harmless
                # on the GNU cp used in CI).
                cp -R "${dir%/}" crates/xberg-node/npm/
              fi
            done
            # index.js / index.d.ts ride at the tarball root on the macOS and
            # Windows legs and are identical across targets; copy when present.
            [ -f "${scratch}/index.js" ] && cp -f "${scratch}/index.js" crates/xberg-node/index.js
            [ -f "${scratch}/index.d.ts" ] && cp -f "${scratch}/index.d.ts" crates/xberg-node/index.d.ts
            rm -rf "${scratch}"
          done

          # Pack each platform sub-package (only those that shipped a binary).
          cd crates/xberg-node/npm
          for dir in */; do
            if [ -f "$dir/package.json" ] && ls "$dir"*.node >/dev/null 2>&1; then
              python3 "$GITHUB_WORKSPACE/scripts/ci/package-notices.py" stage "$dir"
              (
                cd "$dir"
                npm pack
                packed=(./*.tgz)
                [ "${#packed[@]}" -eq 1 ] && [ -f "${packed[0]}" ] || {
                  echo "::error::expected one packed npm platform archive"; exit 1;
                }
                python3 "$GITHUB_WORKSPACE/scripts/ci/package-notices.py" verify "${packed[0]}" package
                mv "${packed[0]}" ..
              )
            fi
          done
          cd ../../..

          # Stamp main package's optionalDependencies with the packed platforms.
          # The committed crates/xberg-node/package.json deliberately carries NO
          # optionalDependencies: this assignment overwrites the key wholesale, so any
          # committed value is write-only, and pinning it to the in-development version
          # made `pnpm install --frozen-lockfile` unsatisfiable between the version bump
          # and the npm publish -- which is what kept CI Docs red across every release.
          # Do not reintroduce it. The "Assert every optionalDependency is installable"
          # step below is what guarantees this stamp actually produced something. ~keep
          tmp_pkg_json="$(mktemp)"
          optional_deps_json='{}'
          for platform_pkg_json in crates/xberg-node/npm/*/package.json; do
            dir="$(dirname "$platform_pkg_json")"
            ls "$dir"/*.node >/dev/null 2>&1 || continue
            name="$(jq -r '.name // empty' "$platform_pkg_json")"
            version="$(jq -r '.version // empty' "$platform_pkg_json")"
            [[ -z "$name" || -z "$version" ]] && { echo "Invalid: $platform_pkg_json" >&2; exit 1; }
            optional_deps_json="$(jq -c --arg n "$name" --arg v "$version" '. + {($n): $v}' <<<"$optional_deps_json")"
          done
          jq --argjson deps "$optional_deps_json" '.optionalDependencies = $deps' \
            crates/xberg-node/package.json > "$tmp_pkg_json"
          mv "$tmp_pkg_json" crates/xberg-node/package.json

      - name: Checkout Node dry-run verification tools
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/publish.yaml
            scripts/ci/verify-node-dry-run.py

      - name: Verify and archive local npm packages
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/node-dry-run
          npm pack ./crates/xberg-node --ignore-scripts --pack-destination dist/node-dry-run
          python3 .release-tools/scripts/ci/verify-node-dry-run.py
          cp crates/xberg-node/npm/*.tgz dist/node-dry-run/
      - uses: actions/upload-artifact@v7
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          name: node-dry-run-packages
          path: dist/node-dry-run/*.tgz
          if-no-files-found: error

      # ~keep This job is gated only on the MAIN package being absent from npm
      # (check-npm.outputs.node_exists), so a re-run after a partial failure re-publishes
      # every platform sub-package and the ones that already landed answer 403
      # EPUBLISHCONFLICT. Failing the step on that would make a partially-published
      # release unrecoverable, which is why the tolerance exists. What it must NOT be
      # allowed to do is let the main package ship while a sub-package is genuinely
      # absent: the main package's optionalDependencies are stamped from the tarballs
      # this job packed, not from the registry, so a silently-skipped sub-package would
      # publish @xberg-io/xberg pointing at a version nobody can install. The
      # "Assert every optionalDependency is installable" step below is the real gate for
      # that -- it queries the registry instead of trusting this step's exit code.
      - name: Publish platform sub-packages
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        continue-on-error: true
        uses: xberg-io/actions/publish-npm@v1
        with:
          packages-dir: crates/xberg-node/npm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm indexing (node-linux-x64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/xberg-linux-x64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      - name: Wait for npm indexing (node-linux-arm64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/xberg-linux-arm64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      # The two waits above only cover the two glibc Linux platforms; darwin, win32 and
      # the musl targets had no check at all. Assert that EVERY name in the main
      # package's optionalDependencies actually resolves on the registry at the exact
      # stamped version before publishing it -- otherwise `npm install @xberg-io/xberg`
      # resolves an optionalDependency that 404s. Optional deps are installed
      # best-effort by npm, so a missing one does not fail the consumer's install; it
      # fails later at import time with "Failed to load native binding", which is the
      # failure mode this gate exists to prevent.
      - name: Assert every optionalDependency is installable
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          entries="$(jq -r '.optionalDependencies // {} | to_entries[] | "\(.key)\t\(.value)"' \
            crates/xberg-node/package.json)"
          if [[ -z "$entries" ]]; then
            echo "FATAL: crates/xberg-node/package.json has no optionalDependencies -- the staging step stamped nothing, so the main package would ship with no platform binaries at all." >&2
            exit 1
          fi
          missing=0
          while IFS=$'\t' read -r name version; do
            [[ -n "$name" ]] || continue
            for _ in $(seq 1 30); do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "OK: ${name}@${version}"
                continue 2
              fi
              sleep 10
            done
            echo "FATAL: ${name}@${version} is not on the npm registry" >&2
            missing=1
          done <<<"$entries"
          if [[ "$missing" -ne 0 ]]; then
            echo "FATAL: refusing to publish @xberg-io/xberg -- it would reference platform sub-packages that were never published (the 'Publish platform sub-packages' step is continue-on-error, so check its log)." >&2
            exit 1
          fi
          echo "OK: every optionalDependency resolves on the npm registry"

      - name: Publish main @xberg-io/xberg package
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/xberg-node
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # NOTE (#1246 follow-up): the npm `latest` dist-tag for @xberg-io/xberg-wasm
  # currently still points at a `0.0.1` placeholder published before this
  # workflow's dist-tag logic existed (`npm view @xberg-io/xberg-wasm
  # dist-tags` -> { latest: "0.0.1", next: "1.0.0-rc.29" }). This job always
  # passes npm-tag: ${{ needs.prepare.outputs.npm_tag }}, which is "next" for
  # every prerelease (see determine_npm_tag in
  # scripts/publish/validate-and-compute-release-metadata.sh) and would only
  # become "latest" on a genuine non-prerelease (1.0.0) publish -- so this
  # workflow cannot safely repoint `latest` today without prematurely
  # promoting an rc build. Fixing the stale pointer requires a one-time,
  # out-of-band `npm dist-tag add @xberg-io/xberg-wasm@<version> latest` (or
  # unpublish/deprecate of the 0.0.1 stub) run manually by someone with
  # publish rights on the package; do not automate it here until a real
  # 1.0.0 release exists. ~keep
  publish-wasm:
    name: Publish WASM package
    needs: [prepare, wasm-bindings, check-npm]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.wasm-bindings.result == 'success' && needs.prepare.outputs.release_wasm == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-npm.outputs.wasm_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm-bundle
          path: crates/xberg-wasm

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Assert npm tarball contains the wasm web bundle and fits the CDN size budget
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Regression guard for #1246: crates/xberg-wasm/pkg/web/.gitignore = "*"
          # can silently drop pkg/web from the published tarball unless
          # build:all's `find pkg -name .gitignore -delete` step ran. A missing
          # pkg/web/xberg_wasm.js or pkg/web/xberg_wasm_bg.wasm ships a package
          # that 404s at import time (the live-demo failure this bug reports).
          TARBALL=$(npm pack --silent)
          # List the tarball once, then match against the captured text. Piping
          # `tar -tzf` into `grep -qx` lets grep exit on first match and SIGPIPE
          # `tar` while it is still inflating the ~40 MB gzip; under `pipefail`
          # that makes the pipeline report non-zero and `if !` misreads it as a
          # false "missing" (the bundle is actually present). ~keep
          listing=$(tar -tzf "$TARBALL")
          MISSING=0
          for f in "package/pkg/web/xberg_wasm.js" "package/pkg/web/xberg_wasm_bg.wasm"; do
            if ! grep -qxF "$f" <<<"$listing"; then
              echo "FATAL: npm tarball is missing $f" >&2
              MISSING=1
            fi
          done
          if [[ "$MISSING" -ne 0 ]]; then
            rm -f "$TARBALL"
            echo "FATAL: wasm npm package is missing required web bundle files; aborting publish." >&2
            exit 1
          fi
          echo "OK: npm tarball contains the wasm web bundle (xberg_wasm.js + xberg_wasm_bg.wasm)"

          # Authoritative package-size gate: wasm-bindings already checked the
          # unpacked pkg/ directory, but this is the actual gzip tarball
          # npm/jsDelivr will serve, measured immediately before publish-npm
          # runs so a regression introduced between jobs (or a stale
          # wasm-bundle artifact) still can't reach the registry. Always
          # printed, pass or fail, per #435. ~keep
          tarball_size=$(stat -c%s "$TARBALL")
          rm -f "$TARBALL"
          status="ok"
          if (( tarball_size > WASM_MAX_PACKAGE_BYTES )); then
            status="FAIL"
          fi
          echo "size: npm tarball ($TARBALL) = ${tarball_size} bytes (limit ${WASM_MAX_PACKAGE_BYTES})"
          {
            echo "### WASM npm tarball size budget"
            echo
            echo "| artifact | size (bytes) | limit (bytes) | status |"
            echo "|---|---|---|---|"
            echo "| npm tarball | ${tarball_size} | ${WASM_MAX_PACKAGE_BYTES} | ${status} |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "FAIL" ]]; then
            echo "::error::npm tarball is ${tarball_size} bytes, exceeding the package budget of ${WASM_MAX_PACKAGE_BYTES} bytes (jsDelivr's hard per-package cap is 150 MB). Aborting before publish-npm runs."
            exit 1
          fi

      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/xberg-wasm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-packagist:
    name: Trigger Packagist update
    needs: [prepare, check-php-pie, php-extension, upload-php-pie-release, check-packagist]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_php == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: Packagist
          needs: ${{ toJSON(needs) }}
          # The PHP jobs skip legitimately only when the release already holds every PIE
          # archive; skipped for any other reason (publish-crates failed) blocks Packagist. ~keep
          succeeded: |
            ${{ needs.check-php-pie.outputs.exists != 'true' && 'php-extension' || '' }}
            ${{ needs.check-php-pie.outputs.exists != 'true' && 'upload-php-pie-release' || '' }}
          succeeded-or-skipped: |
            ${{ needs.check-php-pie.outputs.exists == 'true' && 'php-extension' || '' }}
            ${{ needs.check-php-pie.outputs.exists == 'true' && 'upload-php-pie-release' || '' }}

      - uses: xberg-io/actions/publish-packagist@v1
        with:
          packagist-username: xberg-dev
          package-name: xberg-io/xberg
          version: ${{ needs.prepare.outputs.version }}
          repository-url: https://github.com/xberg-io/xberg
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}

  publish-maven:
    name: Publish Maven (Java) package
    needs: [prepare, java-natives, java-natives-musl, check-maven]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_java == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-maven.outputs.java_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: Maven Central
          needs: ${{ toJSON(needs) }}
          succeeded: |
            java-natives
            java-natives-musl

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: java-natives-*
          path: artifacts/java-natives
          merge-multiple: true

      - uses: xberg-io/actions/stage-java-natives@v1
        with:
          resources-dir: packages/java/src/main/resources/natives
          required-classifiers: >-
            linux-x86_64 linux-aarch64 macos-arm64 windows-x86_64
            linux-musl-x86_64 linux-musl-aarch64
          lib-name: xberg_ffi

      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: java maven
          config-ref: ${{ github.sha }}

      # Maven packs src/main/resources verbatim into the main JAR, so the notice set ships under
      # META-INF without editing the alef-generated pom. The sources JAR is not covered: its
      # generated includes filter admits only *.java, so the guarded publication mode in
      # publish-maven@v1 (which also requires notices in the sources JAR) stays unavailable
      # until alef can emit the notice files into that archive.
      - name: Stage canonical notices into the Maven resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/java/src/main/resources/META-INF
          cp LICENSE THIRD_PARTY_LICENSES.md packages/java/src/main/resources/META-INF/

      # The publish action runs `mvn clean deploy` itself, so the uploaded JARs are rebuilt from
      # these same sources. Build that JAR here first so the shared verifier can gate its bytes
      # before deploy.
      - name: Build jar before deploy
        shell: bash
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -f packages/java/pom.xml -P publish \
            -DskipTests -Dgpg.skip=true -Djacoco.skip=true package
          test -f "packages/java/target/xberg-${{ needs.prepare.outputs.version }}.jar"

      - name: Verify jar notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: java
          artifact-path: packages/java/target/xberg-${{ needs.prepare.outputs.version }}.jar
          artifact-format: jar
          expected-artifact-count: "1"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  publish-kotlin-android:
    name: Publish Kotlin Android (Maven Central via Gradle)
    needs: [prepare, kotlin-android-natives, check-maven]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.release_kotlin_android == 'true' || needs.prepare.outputs.release_kotlin == 'true') && (needs.prepare.outputs.dry_run == 'true' || (needs.prepare.outputs.is_tag == 'true' && needs.check-maven.result == 'success' && (needs.check-maven.outputs.kotlin_exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: Maven Central (Kotlin Android)
          needs: ${{ toJSON(needs) }}
          succeeded: |
            kotlin-android-natives

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.source_sha || needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: kotlin-android-*
          path: kotlin-android-artifacts
          merge-multiple: true

      - name: Check out Android release guards from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/verify-android-jni.py
            scripts/ci/verify-android-aar.init.gradle
            scripts/ci/android-aar-notices.py
            scripts/ci/package-notices.py
            scripts/ci/inject-android-aar-notices.init.gradle
          sparse-checkout-cone-mode: false

      - name: Validate and stage both Android JNI libraries
        run: |
          python3 .release-tools/scripts/ci/verify-android-jni.py stage \
            kotlin-android-artifacts packages/kotlin-android/src/main/jniLibs

      # The Android SDK/NDK stays on its setup action (toolchain-management rule). ~keep
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # The generated Gradle project has no hook for extra AAR assets (xberg-io/alef#943), so the
      # canonical notices are injected into the built archive. This proves the release artifact
      # before publication; the publish invocation rebuilds the AAR and re-injects through
      # inject-android-aar-notices.init.gradle, which is what actually ships. ~keep
      - name: Inject canonical notices into the release AAR
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p packages/kotlin-android -Palef.skipAndroidJni=true assembleRelease
          shopt -s nullglob
          aars=(packages/kotlin-android/build/outputs/aar/*-release.aar)
          test "${#aars[@]}" -eq 1 || { echo "::error::expected one release AAR, found ${#aars[@]}"; exit 1; }
          aar="${aars[0]}"
          python3 .release-tools/scripts/ci/android-aar-notices.py inject \
            --canonical-root . --expected-count 1 "$aar"
          python3 .release-tools/scripts/ci/verify-android-jni.py verify-aar "$aar"
          echo "Injected canonical notices into $aar"

      - uses: xberg-io/actions/publish-maven-gradle@v1
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          extra-args: -I ../../.release-tools/scripts/ci/verify-android-aar.init.gradle -I ../../.release-tools/scripts/ci/inject-android-aar-notices.init.gradle -Palef.skipAndroidJni=true
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.tag }}
        env:
          MAVEN_USERNAME: ${{ needs.prepare.outputs.dry_run != 'true' && secrets.CENTRAL_USERNAME || '' }}
          MAVEN_PASSWORD: ${{ needs.prepare.outputs.dry_run != 'true' && secrets.CENTRAL_PASSWORD || '' }}
          MAVEN_GPG_PRIVATE_KEY: ${{ needs.prepare.outputs.dry_run != 'true' && secrets.GPG_PRIVATE_KEY || '' }}
          MAVEN_GPG_PASSPHRASE: ${{ needs.prepare.outputs.dry_run != 'true' && secrets.GPG_PASSPHRASE || '' }}

  publish-nuget:
    name: Publish NuGet package
    needs: [prepare, csharp-natives, csharp-natives-musl, check-nuget]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_csharp == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: NuGet
          needs: ${{ toJSON(needs) }}
          succeeded: |
            csharp-natives
            csharp-natives-musl

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: csharp-natives-*
          path: csharp-natives
          merge-multiple: true

      - name: Stage runtimes/<rid>/native into NuGet project
        run: |
          mkdir -p packages/csharp/Xberg/runtimes
          for dir in csharp-natives/runtimes/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/Xberg/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/Xberg/runtimes/${rid}/native/"
          done
        shell: bash

      # dotnet stays on its setup action: mise.lock cannot lock it (toolchain-management rule). ~keep
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Render runtime.json for the meta-package's RID fallback graph
        # rc.35 still shipped every RID's native closure inside the meta package
        # itself (Xberg.csproj packed `runtimes/**` directly) and nuget.org
        # rejected the push with 413, even though the per-RID runtime.<rid>
        # packages below were already lean and published fine. The meta package
        # must instead carry only the managed assembly + this rendered
        # runtime.json, which tells NuGet's RID-fallback graph which
        # XbergIo.Xberg.runtime.<rid> package to pull in for the consumer's RID
        # — the standard runtime-package split, same shape as e.g. SQLitePCLRaw.
        # The RID list here must match packages/csharp/Xberg/runtime.json.template. ~keep
        run: |
          sed "s/{{VERSION}}/${{ needs.prepare.outputs.version }}/g" \
            packages/csharp/Xberg/runtime.json.template > packages/csharp/Xberg/runtime.json
        shell: bash

      - name: Pack NuGet packages (meta + one per-RID runtime package)
        run: |
          set -euo pipefail
          dotnet pack packages/csharp/Xberg/Xberg.csproj \
            -c Release \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o dist/nuget

          for dir in packages/csharp/Xberg/runtimes/*/; do
            rid="$(basename "$dir")"
            dotnet pack packages/csharp/Xberg.Runtime/Xberg.Runtime.csproj \
              -c Release \
              -p:Version=${{ needs.prepare.outputs.version }} \
              -p:PublishedRID="${rid}" \
              -o dist/nuget
          done
        shell: bash

      # A nupkg is a zip; the notice set goes at the package root, beside the LICENSE
      # dotnet already packs. The expected inventory is pinned to the RIDs the publish
      # matrix builds and cross-checked against runtime.json.template, so a shrunken run
      # cannot satisfy the count by shrinking both sides.
      - name: Inject canonical notices (NuGet)
        id: nuget-notices
        shell: bash
        run: |
          set -euo pipefail
          expected=$(
            python3 - <<'PY'
          import json
          import pathlib
          import sys

          built = ["linux-x64", "linux-arm64", "linux-musl-x64", "linux-musl-arm64", "osx-arm64", "win-x64"]
          # alef renders a runtime package for every PUBLISHED_RUNTIME_IDENTIFIERS entry enabled
          # in alef.toml, but the publish matrix has no leg for these two. Tracked as a known
          # gap: any other unbuilt RID in the template is drift and fails below.
          known_unbuilt = {"osx-x64", "win-arm64"}
          musl_fallbacks = {"linux-musl-x64", "linux-musl-arm64"}
          template = json.loads(pathlib.Path("packages/csharp/Xberg/runtime.json.template").read_text())
          advertised = {
              rid: package
              for rid, entry in template["runtimes"].items()
              for package in entry
              if package != "#import"
          }
          problems = []
          for rid in built:
              matches = sorted(pathlib.Path("dist/nuget").glob(f"XbergIo.Xberg.runtime.{rid}.*.nupkg"))
              if len(matches) != 1:
                  problems.append(f"RID {rid}: expected one runtime package, found {len(matches)}")
          unexpected = sorted(set(advertised) - set(built) - known_unbuilt)
          if unexpected:
              problems.append("runtime.json.template advertises RIDs the matrix does not build: " + ", ".join(unexpected))
          unadvertised = sorted(set(built) - set(advertised) - musl_fallbacks)
          if unadvertised:
              problems.append("built RIDs missing from runtime.json.template: " + ", ".join(unadvertised))
          for rid in sorted(known_unbuilt & set(advertised)):
              print(f"::warning::runtime.json.template advertises {rid}, which has no publish leg", file=sys.stderr)
          for rid in sorted(musl_fallbacks):
              print(f"::warning::runtime package {rid} is not referenced by runtime.json.template", file=sys.stderr)
          for problem in problems:
              print(f"::error::{problem}", file=sys.stderr)
          if problems:
              raise SystemExit(1)
          print(len(built) + 1)
          PY
          )
          echo "expected=${expected}" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          archives=(dist/nuget/*.nupkg)
          [ "${#archives[@]}" -eq "$expected" ] || {
            echo "::error::expected ${expected} nupkg files (meta + runtime packages), found ${#archives[@]}"
            exit 1
          }
          python3 scripts/ci/package-notices.py inject --format nuget --expected-count "$expected" "${archives[@]}"

      - name: Verify NuGet notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: csharp
          artifact-path: dist/nuget
          artifact-format: nuget
          expected-artifact-count: ${{ steps.nuget-notices.outputs.expected }}
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - uses: xberg-io/actions/publish-nuget@v1
        with:
          nuget-user: naaman-xberg
          packages-dir: dist/nuget
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  finalize-github-release-after-uploads:
    name: Finalize GitHub Release (after uploads)
    needs:
      - prepare
      - verify-assets
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-bundle
    # Verification checks the live release, including assets retained on same-tag retries.
    # A skipped verifier provides no evidence: PHP upload failure used to skip it while
    # this finalizer accepted the skipped result and still published the release. ~keep
    # Excluded from dry runs on purpose: finalize-release un-drafts (publishes) the real
    # GitHub Release, an outward-facing, irreversible action with no dry-run mode of its own,
    # and there is no such release to finalize on a dry run in the first place. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.verify-assets.result == 'success' && needs.upload-cli-release.result != 'failure' && needs.upload-go-release.result != 'failure' && needs.upload-c-ffi-release.result != 'failure' && needs.upload-elixir-release.result != 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  publish-hex:
    name: Publish Elixir Hex package
    needs: [prepare, upload-elixir-release, check-hex, publish-crates, validate-versions, check-cratesio]
    # Fetches its NIFs from the release (not run-artifacts), so it needs only the NIF upload,
    # or a skipped upload because the NIFs are already there; finalize also waits on every
    # other channel's upload, and one of those failing used to skip Hex. The Hex package's
    # source fallback resolves the xberg crates from crates.io, hence publish-crates. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_elixir == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-hex.outputs.elixir_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: Hex
          needs: ${{ toJSON(needs) }}
          succeeded-or-skipped: |
            validate-versions
            check-cratesio
            upload-elixir-release
            publish-crates

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      # BEAM stays on its setup action until mise's Erlang/Elixir install is evaluated. ~keep
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Checkout Elixir release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/ci/elixir_nif_assets.py

      - name: Generate NIF checksum file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          NIF_ASSETS: ${{ needs.prepare.outputs.elixir_assets }}
        run: |
          set -euo pipefail
          IFS=, read -ra names <<< "$NIF_ASSETS"
          test "${#names[@]}" -gt 0
          archives="$(mktemp -d)"
          trap 'rm -rf -- "$archives"' EXIT
          patterns=()
          for name in "${names[@]}"; do
            patterns+=(--pattern "$name")
          done
          for attempt in 1 2 3; do
            if gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              "${patterns[@]}" --dir "$archives" --clobber; then
              break
            fi
            test "$attempt" -lt 3
            sleep 5
          done
          python3 .release-tools/scripts/ci/elixir_nif_assets.py checksums \
            packages/elixir/checksum-Elixir.Xberg.Native.exs "${names[@]/#/$archives/}"

      - name: Build Elixir Hex tarball with dependency rewrite
        id: build-hex
        uses: xberg-io/actions/build-elixir-hex@v1
        with:
          package-dir: packages/elixir
          nif-crate-path: packages/elixir/native/xberg_nif
          rewrite-native-deps: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: xberg-io/actions/publish-hex@v1
        with:
          package-dir: packages/elixir
          tarball-path: ${{ steps.build-hex.outputs.archive-path }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  trigger-pubdev:
    name: Trigger pub.dev publish workflow
    needs: [prepare, check-pub, upload-dart-release]
    # Excluded from dry runs on purpose: `gh workflow run` dispatches a separate, real
    # publish-pubdev.yaml run with no dry-run awareness of its own -- an external, irreversible
    # side effect this workflow cannot take back once dispatched. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_dart == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: pub.dev
          needs: ${{ toJSON(needs) }}
          succeeded: |
            upload-dart-release

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      # --ref MUST be the release tag, not github.ref_name. pub.dev's OIDC gate only mints a
      # token for a 'tag' refType, so dispatching on a branch fails at the child's first step
      # with ref_type='branch'. github.ref_name happens to BE the tag on a `release: published`
      # trigger, which is why this read as correct for as long as that was the only path. It is
      # the branch on a workflow_dispatch, so `republish=true` -- the supported recovery for a
      # partially-published release -- silently lost the Dart publish. prepare.outputs.tag is
      # the resolved tag on every trigger. ~keep
      - name: Dispatch publish-pubdev workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run publish-pubdev.yaml \
            --ref ${{ needs.prepare.outputs.tag }} \
            -f ref=${{ needs.prepare.outputs.checkout_ref }}

  publish-zig:
    name: Publish Zig package metadata
    needs: [prepare, upload-c-ffi-release, check-zig, c-ffi-libraries]
    # Consumes this run's c-ffi artifacts, or the release's C FFI archives when
    # c-ffi-libraries was skipped because they are already uploaded. Independent of every
    # other channel: it waits on the C FFI upload, not on finalize. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.release_zig == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-zig.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs this channel publishes from
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: Zig
          needs: ${{ toJSON(needs) }}
          succeeded-or-skipped: |
            c-ffi-libraries
            upload-c-ffi-release

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: false

      - uses: actions/download-artifact@v8
        if: ${{ needs.c-ffi-libraries.result == 'success' }}
        with:
          pattern: c-ffi-*
          path: dist/c-ffi-downloaded
          merge-multiple: false

      - name: Download C FFI archives from the release
        if: ${{ needs.c-ffi-libraries.result != 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'xberg-ffi-*.tar.gz' --dir dist/c-ffi-downloaded/release
          ls -la dist/c-ffi-downloaded/release

      - name: Lay out FFI artifacts for multi-platform Zig bundle
        shell: bash
        run: |
          set -euo pipefail
          # xberg c-ffi tarballs are named by platform label (no version):
          # xberg-ffi-<platform>.tar.gz, each containing <stage>/lib/* and
          # <stage>/include/*.h. Map each platform to the publish-zig RID layout.
          declare -A RID_FOR=(
            ["linux-x86_64"]="linux-x64"
            ["linux-aarch64"]="linux-arm64"
            ["macos-arm64"]="osx-arm64"
            ["windows-x86_64"]="win-x64"
          )
          out="ffi-artifacts"
          mkdir -p "$out/include"
          for art in dist/c-ffi-downloaded/*/xberg-ffi-*.tar.gz; do
            [ -f "$art" ] || continue
            platform="$(basename "$art" .tar.gz)"
            platform="${platform#xberg-ffi-}"
            rid="${RID_FOR[$platform]:-}"
            if [ -z "$rid" ]; then
              echo "::warning::Unknown C FFI platform '$platform' — skipping"
              continue
            fi
            tmp="$(mktemp -d)"
            tar -xzf "$art" -C "$tmp"
            stage_root="$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)"
            mkdir -p "$out/$rid"
            # Ship shared libraries only. packages/zig/build.zig links xberg_ffi
            # dynamically (linkSystemLibrary), so the per-platform static archives
            # (libxberg_ffi.a, 500-760MB each) are dead weight. Bundling all five
            # platforms' .a produced a 1.15GB release tarball whose upload to
            # uploads.github.com failed; shared libs alone are ~70-105MB/platform.
            shopt -s nullglob
            copied=0
            for lib in "$stage_root"/lib/*.so "$stage_root"/lib/*.so.* \
                       "$stage_root"/lib/*.dylib "$stage_root"/lib/*.dll; do
              cp "$lib" "$out/$rid/"
              copied=1
            done
            shopt -u nullglob
            if [ "$copied" -eq 0 ]; then
              echo "::warning::no shared library found for $rid under $stage_root/lib — skipping"
            fi
            # nullglob is unset again just above, so an include/ with no .h would
            # leave the pattern literal and `cp` would fail -- an error previously
            # discarded, publishing a Zig bundle with no C headers to compile
            # against. Collect under nullglob and assert on the count instead of
            # trusting cp's exit status.
            shopt -s nullglob
            headers=("$stage_root"/include/*.h)
            shopt -u nullglob
            if [ "${#headers[@]}" -eq 0 ]; then
              echo "::error::no C headers found under $stage_root/include for $rid (from $art) — refusing to ship a headerless Zig bundle"
              exit 1
            fi
            cp "${headers[@]}" "$out/include/"
            rm -rf "$tmp"
          done
          # include/ is also left empty when the loop body never ran at all -- no
          # artifacts downloaded, or every platform label unknown -- which the
          # per-artifact check above cannot observe.
          shopt -s nullglob
          staged_headers=("$out"/include/*.h)
          shopt -u nullglob
          if [ "${#staged_headers[@]}" -eq 0 ]; then
            echo "::error::$out/include contains no headers — refusing to publish a Zig bundle consumers cannot compile against"
            exit 1
          fi
          ls -la "$out"
          for d in "$out"/*/; do echo "--- $d ---"; ls -la "$d"; done

      # Mint the app token immediately before the upload. GitHub App installation
      # tokens have a hard 1h TTL; laying out the multi-platform FFI bundle (>1GB)
      # can outlast a token minted at job start, causing the release upload to 401. ~keep
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Stage canonical notices into the Zig package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/package-notices.py stage packages/zig
          # Zig materializes only the entries listed in .paths, so asserting the files exist is
          # not enough: the manifest must expose them to `zig fetch` consumers.
          grep -q '"LICENSE"' packages/zig/build.zig.zon
          grep -q '"THIRD_PARTY_LICENSES.md"' packages/zig/build.zig.zon

      - uses: xberg-io/actions/publish-zig@v1
        with:
          working-directory: packages/zig
          tag: ${{ needs.prepare.outputs.tag }}
          # ~keep The action's internal steps use `GH_TOKEN: ${{ inputs.token }}`, which
          # ~keep defaults to the read-only github.token (workflow permissions are
          # ~keep contents:read) — without forwarding the app token here the release
          # ~keep asset upload fails 403 "Resource not accessible by integration".
          token: ${{ steps.app-token.outputs.token }}
          # ~keep Override the auto-detected package-name (`.xberg` from
          # ~keep build.zig.zon) to match the alef-emitted test_app URL pattern
          # ~keep `{crate-name}-zig-v{version}.tar.gz`. Without this, the asset
          # ~keep uploads as `xberg-v{version}.tar.gz` while test_apps/zig
          # ~keep fetches `xberg-zig-v{version}.tar.gz` → 404 + consumer
          # ~keep build.zig.zon placeholder hash.
          package-name: xberg-zig
          multi-platform-ffi-dir: ffi-artifacts
          module-name: xberg
          ffi-lib-name: xberg_ffi
          # The only job that writes the release body (finalize-release edits draft and
          # prerelease flags only), and the append is guarded by a marker, so running beside
          # the other uploads cannot lose or duplicate notes. ~keep
          update-release-notes: "true"
          update-existing: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # The tarball is assembled and uploaded inside the external action, so there is no
      # pre-upload hook: the action leaves its tarball in RUNNER_TEMP and this reopens those
      # exact bytes. The stage step above is what puts them in the tarball.
      - name: Verify canonical notices in the Zig tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/xberg-zig-${{ needs.prepare.outputs.tag }}.tar.gz"
          [ -f "$tarball" ] || {
            echo "::error::Zig tarball not found at $tarball"; exit 1;
          }
          python3 scripts/ci/package-notices.py check --format zig --expected-count 1 "$tarball"

  publish-homebrew-formula:
    name: Update Homebrew formula
    needs: [prepare, check-homebrew, finalize-github-release-after-uploads]
    # The formula builds from the source tarball, so it needs neither crates.io nor a
    # successful crate publish; it follows finalize because the tap commit pins a release-asset
    # URL and the asset-presence step below refuses a release with no CLI assets at all. Before
    # the release is un-drafted that URL 404s, so committing the formula earlier would publish a
    # broken formula for the length of the run (and forever if the run dies). ~keep
    # `always()` also runs on a cancelled workflow: run 38443926351 was cancelled yet this job
    # pushed the 1.3.10 formula while the release had 0 assets (#2119), hence `!cancelled()`. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.dry_run == 'true' || needs.finalize-github-release-after-uploads.result == 'success') && (needs.check-homebrew.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Verify CLI assets exist on the release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          count="$(gh release view "$TAG" --repo xberg-io/xberg --json assets --jq '[.assets[].name | select(startswith("xberg-cli-"))] | length')"
          echo "xberg-cli-* assets on ${TAG}: ${count}"
          [ "$count" -gt 0 ] || {
            echo "::error::release ${TAG} has no xberg-cli-* assets; refusing to update the Homebrew formula"
            exit 1
          }

      - name: Update formula files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP_DIR: ${{ github.workspace }}/homebrew-tap
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: scripts/publish/update-homebrew-formula.sh
        shell: bash

      - name: Commit and push to tap
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/xberg.rb
          git commit -m "xberg ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push to the tap after 5 attempts"
              exit 1
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
        shell: bash

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the action rewrites the manifest in place and commits
  # only when the staged manifest differs from the bucket, so re-running a release is a
  # no-op. It reads the Windows zip from the release rather than this run, so it also runs
  # when the CLI upload was skipped because check-cli found every asset there. It follows
  # finalize: the manifest pins the public release URL, which 404s while the release is a
  # draft. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    needs: [prepare, check-cli, upload-cli-release, finalize-github-release-after-uploads]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_scoop == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.prepare.outputs.dry_run == 'true' || needs.finalize-github-release-after-uploads.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@v3
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}
          commit: "true"

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    # Depends on finalize so the GitHub Release is out of draft before the bottle
    # build's `brew install` fetches the source tarball: the formula now pins a
    # release-asset URL (stable bytes, uploaded by publish-homebrew-formula), and
    # draft-release assets are not publicly downloadable. In dry-run finalize is
    # skipped, so this job is skipped too (no asset is uploaded to point at). ~keep
    needs: [prepare, publish-homebrew-formula, finalize-github-release-after-uploads]
    # Runs once the formula is bumped and the release is finalized (out of draft so
    # `brew install` can fetch the pinned release asset), independent of any sibling
    # channel's result. Builds from source — consumes no cross-job run-artifacts. ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.publish-homebrew-formula.result == 'success' && needs.finalize-github-release-after-uploads.result == 'success' && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, bottle_tag: arm64_tahoe, install_brew: false }
          # ~keep The Intel macOS `sequoia` bottle is deliberately absent, not forgotten.
          # From 2026-09-01 Homebrew serves no `openssl@3` bottle for x86_64 macOS after
          # Apple dropped Intel in macOS 27, so this leg cannot build and no change here
          # can fix it. Unlike some sibling repos, a failed bottle leg does NOT revert this
          # release to a draft -- `publish-homebrew-bottles` tolerates a failed matrix by
          # design and `release-finalize` does not gate on it -- so what the entry actually
          # costs is a permanently red job and a bottle that never appears. Intel macOS
          # falls back to a source build, which is the same outcome the entry produced.
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

          submodules: false
      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      # Build (from source) and STAGE the bottle without uploading. A from-source build on
      # the slow macOS runners can outlast a GitHub App token's hard 1h TTL, so uploading
      # inside this step with a token minted before the build 401s (rc.36 sequoia). ~keep
      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/homebrew-tap
          formulas: |
            xberg
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: xberg-io/xberg
          upload: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bottles=("${{ github.workspace }}/bottle-json/"*.bottle.tar.gz)
          if [[ ${#bottles[@]} -eq 0 ]]; then
            echo "::error::no bottle tarball staged in bottle-json/" >&2
            exit 1
          fi
          for b in "${bottles[@]}"; do
            echo "Uploading $(basename "$b") to ${TAG}"
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$b" --clobber --repo xberg-io/xberg; then break; fi
              if [ "$attempt" = 5 ]; then
                echo "::error::failed to upload $(basename "$b") after 5 attempts" >&2
                exit 1
              fi
              echo "attempt ${attempt}/5 failed; retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, publish-homebrew-formula, homebrew-bottles]
    # Consumes the bottle-json RUN-artifacts. Runs on a PARTIAL bottle set too: with
    # fail-fast:false the matrix legs upload independently, and merge-bottles renders a
    # bottle block from whatever JSON manifests are present (missing platforms fall back
    # to source-build). So a single failed leg (e.g. the slow sequoia runner) must NOT
    # drop the bottle DSL for every platform — hence success OR failure, not just success.
    # (download-artifact only pulls the legs that succeeded.) ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.publish-homebrew-formula.result == 'success' && (needs.homebrew-bottles.result == 'success' || needs.homebrew-bottles.result == 'failure') && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

          submodules: false
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            xberg
          github-repo: xberg-io/xberg

      - name: Commit and push bottle DSL
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/xberg.rb
          git commit -m "xberg ${{ needs.prepare.outputs.version }}: add bottle DSL"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push to the tap after 5 attempts"
              exit 1
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
        shell: bash

  release-finalize:
    name: Finalize GitHub Release (post-publish validation)
    needs:
      - prepare
      - finalize-github-release-after-uploads
      - update-swift-package-manifest
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - publish-nuget
      - publish-hex
      - trigger-pubdev
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
    # Excluded from dry runs on purpose: this is a second finalize-release call (go-module-path
    # flavor) that updates the same real, published GitHub Release as finalize-github-release-
    # after-uploads -- outward-facing and irreversible, and again there is no such release to
    # finalize on a dry run. ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && !cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.finalize-github-release-after-uploads.result == 'success' && needs.publish-crates.result != 'failure' && needs.publish-pypi.result != 'failure' && needs.publish-rubygems.result != 'failure' && needs.publish-node.result != 'failure' && needs.publish-wasm.result != 'failure' && needs.publish-packagist.result != 'failure' && needs.publish-maven.result != 'failure' && needs.publish-kotlin-android.result != 'failure' && needs.publish-nuget.result != 'failure' && needs.publish-hex.result != 'failure' && needs.publish-zig.result != 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'true' || 'false' }}
          go-module-path: ${{ needs.prepare.outputs.release_go == 'true' && 'packages/go' || '' }}
          go-strip-major-version: "false"
          token: ${{ steps.app-token.outputs.token }}

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - publish-nuget
      - publish-hex
      - trigger-pubdev
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-bundle
      - release-finalize
    # Excluded from dry runs on purpose: posts a real, outward-facing announcement to a public
    # Discord channel with no dry-run mode of its own -- irreversible once sent, and would be
    # actively misleading during a dry run (announcing a release that was never published). ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && !cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.is_prerelease != 'true' && needs.prepare.outputs.release_targets == 'all' && !contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/announce-release-discord@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: xberg
          token: ${{ steps.app-token.outputs.token }}

  cli-proxy:
    name: Publish CLI proxy package (npm)
    needs: [prepare, check-cli, upload-cli-release, finalize-github-release-after-uploads]
    # The package resolves the release by tag at install time through the public API, which
    # cannot see a draft. Publishing before finalize would hand users a version that 404s for
    # the length of the run and forever if the run dies, and an npm version cannot be replaced. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.dry_run == 'true' || needs.finalize-github-release-after-uploads.result == 'success') && (needs.check-cli.outputs.npm_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require the CLI release assets the proxy downloads
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: npm (xberg-cli)
          needs: ${{ toJSON(needs) }}
          # Skipped is accepted only when check-cli found every asset on the release. ~keep
          succeeded: ${{ needs.check-cli.outputs.assets_exist != 'true' && 'upload-cli-release' || '' }}
          succeeded-or-skipped: ${{ needs.check-cli.outputs.assets_exist == 'true' && 'upload-cli-release' || '' }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"
      # ~keep The binary ships inside per-platform npm packages (optionalDependencies of the root
      # package) so `npx` works with no network access. A dry run has no release to download from,
      # so it only exercises the root package.
      - name: Configure npm registry authentication
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"

      # ~keep The release carries no checksum file, so the expected digests come from the sha256
      # GitHub recorded for each asset at upload. Every archive is checked against them before it is
      # packaged. Targets the release does not carry are skipped; the binstall archives are not
      # the standalone CLI and are excluded.
      - name: Build the platform packages
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p cli-archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir cli-archives \
            --pattern 'xberg-cli-*.tar.gz' --pattern 'xberg-cli-*.zip' --clobber
          rm -f cli-archives/xberg-cli-binstall-* cli-archives/*-no-gpl-lgpl.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | startswith("xberg-cli-") and (startswith("xberg-cli-binstall-") | not) and (endswith(".tar.gz") or endswith(".zip"))) | "\(.digest // "")  \(.name)"' \
            | grep -E '^sha256:[0-9a-f]{64}  ' | sed 's/^sha256://' > cli-archives/cli-SHA256SUMS
          [ -s cli-archives/cli-SHA256SUMS ] || { echo "::error::the release lists no sha256 digests for its CLI archives"; exit 1; }
          python3 -I scripts/release/package_cli_npm.py --archives cli-archives --version "$VERSION" --out cli-npm-packages

      # ~keep Platform packages first and the root last: a partial failure never leaves a root whose
      # optionalDependencies are unpublished, and a rerun skips what is already on npm.
      - name: Publish the platform packages
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          count=0
          for dir in cli-npm-packages/*-*; do
            name="$(node -p "require('./$dir/package.json').name")"
            count=$((count + 1))
            if [ -n "$(pnpm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already published"
              continue
            fi
            (cd "$dir" && pnpm publish --provenance --access public --tag "$NPM_TAG" --no-git-checks)
          done
          [ "$count" -gt 0 ] || { echo "::error::no platform packages were built"; exit 1; }
          cp cli-npm-packages/root/package.json cli-proxy/npm/package.json

      - name: Wait for the platform packages
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for dir in cli-npm-packages/*-*; do
            name="$(node -p "require('./$dir/package.json').name")"
            for _ in $(seq 1 60); do
              [ -n "$(pnpm view "$name@$VERSION" version 2>/dev/null)" ] && continue 2
              sleep 5
            done
            echo "::error::$name@$VERSION is not visible on npm"
            exit 1
          done

      # dry-run must be threaded explicitly: prepare synthesizes a dry-run tag, so this job's
      # `is_tag == 'true'` gate does not exclude dry runs (same reasoning as the elixir-natives
      # upload-artifact step elsewhere in this file), and check-cli.outputs.exists only guards
      # re-run idempotency -- it happens to be true today but is not a dry-run safeguard. ~keep
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: cli-proxy/npm
          access: public
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-mcp-registry:
    name: Publish MCP Registry entry
    needs: [prepare, check-cli, cli-proxy]
    # The registry validates the entry against the published npm package (existence and the
    # `mcpName` ownership proof), so it runs after the npm proxy is on the registry: either
    # cli-proxy just published it, or check-cli found that version already there. Dry runs
    # synthesize a tag but publish nothing, so they must not reach the registry. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.cli-proxy.result == 'success' || (needs.cli-proxy.result == 'skipped' && needs.check-cli.outputs.npm_exists == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # ~keep Pinned: a floating latest would land an upstream release in a publish job
      # unreviewed. Bump deliberately; the cosign step below verifies the download.
      MCP_PUBLISHER_VERSION: v1.8.13
    steps:
      - name: Require the npm proxy this entry points at
        uses: xberg-io/actions/require-job-results@v1
        with:
          channel: MCP Registry (xberg)
          needs: ${{ toJSON(needs) }}
          succeeded: ${{ needs.check-cli.outputs.npm_exists != 'true' && 'cli-proxy' || '' }}
          succeeded-or-skipped: ${{ needs.check-cli.outputs.npm_exists == 'true' && 'cli-proxy' || '' }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Check server.json matches the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          jq -e --arg v "$VERSION" '.version == $v and ([.packages[].version] | all(. == $v))' server.json >/dev/null \
            || { echo "::error::server.json version does not match release $VERSION; run mise run version:sync"; exit 1; }

      # Registry versions are immutable, so a re-run (or force_republish) must skip rather
      # than fail on a version it already holds. 404 is the only "absent" answer; anything
      # else unexpected fails the job instead of being read as absent. ~keep
      - name: Check the registry for this version
        id: registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="$(jq -r '.name | @uri' server.json)"
          version="$(jq -rn --arg v "$VERSION" '$v | @uri')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/${version}")"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "::notice::MCP Registry already holds $VERSION" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected HTTP $status from the MCP Registry"; exit 1 ;;
          esac

      - name: Install cosign
        if: ${{ steps.registry.outputs.exists != 'true' }}
        uses: sigstore/cosign-installer@v4.1.3 # ~keep no v4 major tag exists

      - name: Download and verify mcp-publisher
        if: ${{ steps.registry.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Validate server.json
        if: ${{ steps.registry.outputs.exists != 'true' }}
        run: ./mcp-publisher validate server.json

      - name: Authenticate to the MCP Registry
        if: ${{ steps.registry.outputs.exists != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        if: ${{ steps.registry.outputs.exists != 'true' }}
        run: ./mcp-publisher publish server.json

  # --- First-party integrations (lockstep with core; see integrations/README.md) ---
  # These are additive best-effort stages: they publish the integrations that ship
  # with this core version, but are intentionally NOT part of release-finalize /
  # announce-discord `needs`, so an integration hiccup never blocks the core release.
  # Each depends on the matching core publish job so the core artifact lands first. ~keep

  publish-integrations-pypi:
    name: Publish integrations to PyPI
    needs: [prepare, publish-pypi]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-pypi.result != 'failure' && needs.prepare.outputs.release_python == 'true' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
          config-ref: ${{ github.sha }}
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Build integration distributions
        run: |
          set -euo pipefail
          mkdir -p integrations-dist
          pkgs=(
            integrations/python/crewai
            integrations/python/txtai
            integrations/python/surrealdb
            integrations/python/langchain
            integrations/python/llama-index/readers/llama-index-readers-xberg
            integrations/python/llama-index/node_parsers/llama-index-node-parser-xberg
          )
          for p in "${pkgs[@]}"; do
            echo "::group::build $p"
            uv build --sdist --wheel --out-dir integrations-dist "$p"
            echo "::endgroup::"
          done
          ls -la integrations-dist
      # Every integration PyPI project trusts (xberg-io/xberg, publish.yaml, env pypi),
      # so a single OIDC upload publishes all of them. ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: integrations-dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-integrations-maven:
    name: Publish spring-ai integration to Maven Central
    needs: [prepare, publish-maven]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-maven.result != 'failure' && needs.prepare.outputs.release_java == 'true' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: maven
          config-ref: ${{ github.sha }}
      - name: Wait for core artifact on Maven Central
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          XBERG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # spring-ai depends on io.xberg:xberg:$XBERG_VERSION, published by the core
          # `publish-maven` job. `needs: publish-maven` guarantees that job finished but NOT
          # that the Central Portal has synced the artifact to repo1.maven.org, where mvn
          # resolves it — that indexing lag (minutes to tens of minutes) is what failed the
          # rc.36 spring-ai deploy ("Could not find artifact io.xberg:xberg:jar in central").
          url="https://repo1.maven.org/maven2/io/xberg/xberg/${XBERG_VERSION}/xberg-${XBERG_VERSION}.pom"
          for attempt in $(seq 1 60); do
            if curl -fsSL -o /dev/null "$url"; then
              echo "core artifact available after attempt ${attempt}: ${url}"
              exit 0
            fi
            echo "attempt ${attempt}/60: not yet on Central; sleeping 30s (${url})"
            sleep 30
          done
          echo "::error::io.xberg:xberg:${XBERG_VERSION} did not appear on Maven Central within ~30m; re-run this job once it syncs" >&2
          exit 1
      - uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: integrations/java/spring-ai/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  publish-integrations-npm:
    name: Publish ${{ matrix.package }} to npm
    needs: [prepare, check-npm, publish-node]
    # A skipped core publish is usable for a real release only when the exact version is already on npm.
    # Dry runs can use the published fallback version resolved below. ~keep
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() &&
          needs.prepare.result == 'success' && needs.check-npm.result == 'success' &&
          needs.prepare.outputs.release_node == 'true' && needs.prepare.outputs.is_tag == 'true' &&
          (needs.publish-node.result == 'success' ||
           (needs.publish-node.result == 'skipped' &&
            (needs.check-npm.outputs.node_exists == 'true' || needs.prepare.outputs.dry_run == 'true')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - n8n-nodes-xberg
          - langchain-xberg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"
      # Dry runs never publish the release version to npm (see the job comment above), so pin
      # to whatever IS on npm right now instead of the unresolvable release version. Best-effort:
      # if nothing has ever been published for this package, leave the pin alone and let `npm
      # install` fail exactly as it would without this step. ~keep
      - name: Resolve core dependency for dry run
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        working-directory: integrations/node/${{ matrix.package }}
        run: |
          set -euo pipefail
          published_version="$(npm view @xberg-io/xberg version 2>/dev/null || true)"
          if [[ -z "$published_version" ]]; then
            echo "::warning::@xberg-io/xberg has no published version on npm; leaving the pin as-is"
          else
            jq --arg v "$published_version" '.dependencies["@xberg-io/xberg"] = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
            echo "Pinned @xberg-io/xberg to published version ${published_version} for this dry run"
          fi
      - name: Build
        working-directory: integrations/node/${{ matrix.package }}
        # `npm install` (not `npm ci`): the integration pins `@xberg-io/xberg` to the exact rc,
        # which is published to npm only by the preceding `publish-node` job of THIS run — so a
        # committed lockfile can never pre-match it (the stale rc.32 lockfile broke rc.36's npm
        # publish). install reconciles the core entry against the just-published version while
        # preserving the third-party pins already recorded in package-lock.json. ~keep
        # n8n-nodes-xberg only compiles TypeScript, but its dev dependency isolated-vm (pulled in
        # through n8n-workflow) builds a V8 addon that does not compile against Node 26. Skip
        # install scripts for that package; no other build step needs them. ~keep
        run: |
          if [[ "${{ matrix.package }}" == "n8n-nodes-xberg" ]]; then
            npm install --no-audit --no-fund --ignore-scripts
          else
            npm install --no-audit --no-fund
          fi
          npm run build
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: integrations/node/${{ matrix.package }}
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the integrations above: intentionally NOT part of
  # release-finalize / announce-discord `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content on full releases (version tracks core), so
  # each guards against an already-published version. `needs: [prepare]` only — the plugin
  # has no build- or runtime-dependency on the core packages (mcp-launch.sh resolves the CLI
  # at runtime), so it publishes in parallel with the core jobs. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode and Pi plugin to npm
    needs: [prepare]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_targets == 'all' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install Node and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"
      - name: Verify plugin bundles match the pinned generator
        run: |
          ai-rulez verify --plugin
          node --test scripts/tests/opencode-plugin.test.mjs
      - name: Verify Pi and OpenCode resources in the npm archive
        run: python3 scripts/verify_pi_package.py
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (publish-npm has no built-in skip-existing). ~keep
      - name: Skip if already on npm
        id: guard
        run: |
          name="$(node -p "require('./plugin/package.json').name")"
          ver="$(node -p "require('./plugin/package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${name}@${ver} already on npm; skipping"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: xberg-io/actions/publish-npm@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          package-dir: plugin
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_targets == 'all' && needs.prepare.outputs.is_tag == 'true') }}
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
          config-ref: ${{ github.sha }}
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Verify plugin source and generated artifacts
        uses: xberg-io/actions/verify-ai-rulez-plugin@v1
        with:
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_integration_versions.py
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-plugin-artifacts:
    name: Publish all plugin runtime artifacts
    permissions:
      contents: write
    needs: [prepare, release-finalize]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.release_targets == 'all' && needs.prepare.outputs.dry_run != 'true' && needs.release-finalize.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Verify public skill exports
        run: python3 scripts/sync_public_skills.py --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@v1
        with:
          cursor-marketplace: "true"
          tag: ${{ needs.prepare.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_integration_versions.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.prepare.outputs.tag }}
          PLUGIN_PRODUCT: xberg
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256

  plugin-release-report:
    name: Verify all plugin distribution jobs succeeded
    needs: [prepare, publish-plugin-artifacts, publish-plugin-opencode, publish-plugin-hermes]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.prepare.outputs.release_targets == 'all' && needs.prepare.outputs.dry_run != 'true' && startsWith(needs.prepare.outputs.tag, 'v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject failed or skipped plugin distribution
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ['RESULTS_JSON'])
          expected = {'prepare', 'publish-plugin-artifacts', 'publish-plugin-opencode', 'publish-plugin-hermes'}
          if set(results) != expected:
              raise SystemExit('Expected preparation and exactly three plugin distribution jobs')
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f"Incomplete plugin distribution: {', '.join(failed)}")
          print('Verified preparation and 3/3 plugin distribution jobs succeeded')
          PYTHON

  dispatch-plugin-npm:
    name: Publish missing npm plugin version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins-only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Node and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Verify plugin versions and generated resources
        uses: xberg-io/actions/verify-ai-rulez-plugin@v1
        with:
          version-sync-script: scripts/sync_integration_versions.py
      - name: Read and check the exact npm version
        id: package
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          package = json.loads(Path('plugin/package.json').read_text())
          name, version = package['name'], package['version']
          if not name or not version:
              raise SystemExit('Missing plugin package identity')
          url = 'https://registry.npmjs.org/' + urllib.parse.quote(name, safe='')
          url += '/' + urllib.parse.quote(version, safe='')
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = json.load(response)
              if published['name'] != name or published['version'] != version:
                  raise SystemExit('Registry returned an unexpected package identity')
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={version}\nexists={str(exists).lower()}\n")
              output.write(f"tag={'next' if '-' in version else 'latest'}\n")
          print(f"{name}@{version}: {'already published; skipping' if exists else 'not published'}")
          PYTHON
      - name: Verify the packed Pi and OpenCode resources
        if: steps.package.outputs.exists != 'true'
        run: python3 scripts/verify_pi_package.py
      - name: Publish missing npm version with trusted publishing
        if: steps.package.outputs.exists != 'true'
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: plugin
          expected-version: ${{ steps.package.outputs.version }}
          npm-tag: ${{ steps.package.outputs.tag }}
          access: public
          provenance: "true"

  dispatch-plugin-hermes:
    name: Publish missing Hermes plugin version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins-only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-
      - name: Verify plugin versions and generated resources
        uses: xberg-io/actions/verify-ai-rulez-plugin@v1
        with:
          version-sync-script: scripts/sync_integration_versions.py
      - name: Read the verified Hermes version
        id: package
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if not package['name'].endswith('-hermes-plugin') or not package['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={package['version']}\n")
          PYTHON
      - name: Build verified Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Publish missing Hermes version with trusted publishing
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          expected-version: ${{ steps.package.outputs.version }}
