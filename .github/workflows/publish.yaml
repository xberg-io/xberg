      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
