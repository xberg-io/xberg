  wasm-bindings:
    name: Build WASM package
    needs: [prepare, check-npm]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_wasm == 'true' && (needs.check-npm.outputs.wasm_exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The WASM package is a best-effort publish gate, not part of the core release: a WASM
    # build failure must not block publishing the crate/PyPI/npm/Maven/etc. artifacts that
    # depend only on `prepare`. downstream `publish-wasm` requires
    # needs.wasm-bindings.result == 'success', so a failure here still correctly skips
    # publishing a broken WASM package -- it just doesn't fail the whole run. ~keep
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          cache-key-prefix: wasm-bindings

      - uses: xberg-io/actions/install-wasi-sdk@v1

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-wasm-package@v1
        with:
          crate-dir: crates/xberg-wasm
          pack-tarball: "true"
          # The wasm-pack nodejs glue carries unresolvable require("env") /
          # require("wasi_snapshot_preview1") calls (from the WASI-cross-compiled
          # Tesseract in ocr-wasm) that throw on load. fix-wasi-imports.mjs stubs
          # them post-build. This override is the durable hook: alef regenerates
          # crates/xberg-wasm/package.json scripts and drops any hand-added
          # suffix, so we invoke the patch here (publish.yaml is not generated)
          # rather than relying on a package.json script surviving regen. ~keep
          # CARGO_PROFILE_RELEASE_OPT_LEVEL=z: the workspace `[profile.release]` is
          # tuned for native throughput (`opt-level = 3`), and only the thin
          # `xberg-wasm` glue crate carries a per-package `opt-level = "z"` — every
          # dependency that actually fills the blob (xberg, crawlberg, candle,
          # tract, tokenizers, the WASI Tesseract) was still generated at 3. On
          # wasm32 that inflates the `code` section by ~48%: measured on this
          # revision, code 37,885,900 -> 25,543,030 bytes and the shipped
          # `pkg/web/xberg_wasm_bg.wasm` 52,208,780 -> 40,020,247 (-23.3%), with
          # `data` unchanged (14.07 MB, mostly bundled eng.traineddata) and the
          # Node load smoke test still reporting the same 364 exports. That is what
          # brings the artifact back under WASM_MAX_FILE_BYTES without dropping a
          # feature. It is set here rather than in `.cargo/config.toml`, because a
          # `[target.wasm32-unknown-unknown] rustflags` entry is silently discarded
          # whenever RUSTFLAGS is set (CI sets `-D warnings`) — see
          # crates/xberg-wasm/build.rs — and rather than in package.json, which alef
          # regenerates. Keep it in step with mise-tasks/rust.toml's
          # `rust:wasm:build:all` so a local build measures what publish ships. ~keep
          build-command: "CARGO_PROFILE_RELEASE_OPT_LEVEL=z pnpm run build:all && node scripts/fix-wasi-imports.mjs"

      - name: Enforce WASM CDN size budget (jsDelivr limits)
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Early warning, deliberately NOT the blocking gate: this job carries a
          # job-level `continue-on-error: true`, so a failure here does not
          # reliably stop publish-wasm from running. The authoritative check is
          # the npm-tarball measurement inside publish-wasm, which runs before
          # the publish step in a job that is not continue-on-error. This step
          # exists to surface the number early, against the build output rather
          # than the packed tarball, so growth toward the jsDelivr caps is
          # visible on every run instead of being discovered from a broken
          # demo. Sizes print whether or not the budget is breached. ~keep
          FAIL=0
          {
            echo "### WASM CDN size budget (crates/xberg-wasm)"
            echo
            echo "| artifact | size (bytes) | limit (bytes) | status |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"

          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            rel="crates/xberg-wasm/${file#./}"
            status="ok"
            if (( size > WASM_MAX_FILE_BYTES )); then
              status="FAIL"
              FAIL=1
              echo "::error::${rel} is ${size} bytes, exceeding the per-file budget of ${WASM_MAX_FILE_BYTES} bytes (jsDelivr's hard per-file cap is 50 MB). Trim this artifact (or feature-gate the dependency that grew it) before it can publish."
            fi
            echo "size: ${rel} = ${size} bytes (limit ${WASM_MAX_FILE_BYTES})"
            echo "| ${rel} | ${size} | ${WASM_MAX_FILE_BYTES} | ${status} |" >>"$GITHUB_STEP_SUMMARY"
          done < <(find pkg -name '*.wasm' -print0)

          total=$(du -sb pkg | cut -f1)
          status="ok"
          if (( total > WASM_MAX_PACKAGE_BYTES )); then
            status="FAIL"
            FAIL=1
            echo "::error::crates/xberg-wasm/pkg is ${total} bytes, exceeding the package budget of ${WASM_MAX_PACKAGE_BYTES} bytes (jsDelivr's hard per-package cap is 150 MB). Trim the published bundle before it can publish."
          fi
          echo "size: crates/xberg-wasm/pkg (total) = ${total} bytes (limit ${WASM_MAX_PACKAGE_BYTES})"
          echo "| crates/xberg-wasm/pkg (total) | ${total} | ${WASM_MAX_PACKAGE_BYTES} | ${status} |" >>"$GITHUB_STEP_SUMMARY"

          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi

      - name: Smoke test — Node can load the wasm web bundle
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Guards the rc.21/rc.22 regression: the wasm-pack glue carried
          # unresolvable "env" / "wasi_snapshot_preview1" imports (from the
          # WASI-cross-compiled Tesseract in ocr-wasm) that threw on load.
          # scripts/fix-wasi-imports.mjs (run via the build-command override
          # above) must have stripped and stubbed them; if not, importing the
          # bundle throws here and fails the job before a broken package can
          # publish. The package is web-only (single ESM target under pkg/web),
          # so import it as an ES module — this exercises the same env/wasi ESM
          # shim path. Load-only (no tessdata needed): fast and network-free.
          node --input-type=module -e '
            const wasm = await import("./pkg/web/xberg_wasm.js");
            if (typeof wasm.extract !== "function" || typeof wasm.WasmExtractInput !== "function") {
              console.error("wasm web glue loaded but expected exports are missing"); process.exit(1);
            }
            console.log("wasm web glue loaded; exports present:", Object.keys(wasm).length);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: |
            crates/xberg-wasm/dist/**
            crates/xberg-wasm/dist-node/**
            crates/xberg-wasm/dist-web/**
            crates/xberg-wasm/pkg/**
            crates/xberg-wasm/package.json
          retention-days: 14

  ruby-gem:
    name: Build Ruby gem (${{ matrix.label }}, ruby ${{ matrix.ruby }})
    needs: [prepare, check-rubygems, publish-crates]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_ruby == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    env:
      RB_SYS_CARGO_PROFILE: release
      # Alef's target dependency override selects `windows-gnu-target`, but the generated
      # binding crate's default forwarding features otherwise union ORT back into xberg.
      # MinGW has no ORT prebuilt, so compile the wrapper with only the cfg-gated APIs that
      # the Windows GNU surface supports. The target dependency still supplies the complete
      # `windows-gnu-target` implementation feature set.
      RB_SYS_EXTRA_CARGO_ARGS: ${{ matrix.ruby_cargo_args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ruby "3.3" leg of each platform builds that platform's gem; the 3.4 and 4.0 legs only
          # contribute their extension, which publish-rubygems merges into the 3.3 leg's gem so one
          # platform gem loads on every supported Ruby. Windows ships a 3.3-pinned gem. ~keep
          - { os: ubuntu-latest, label: linux-x86_64, gem_platform: x86_64-linux, ruby: "3.3", layout: fat }
          - { os: ubuntu-latest, label: linux-x86_64, gem_platform: x86_64-linux, ruby: "3.4", layout: extension }
          - { os: ubuntu-latest, label: linux-x86_64, gem_platform: x86_64-linux, ruby: "4.0", layout: extension }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, gem_platform: aarch64-linux, ruby: "3.3", layout: fat }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, gem_platform: aarch64-linux, ruby: "3.4", layout: extension }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, gem_platform: aarch64-linux, ruby: "4.0", layout: extension }
          - { os: macos-26, label: macos-arm64, gem_platform: arm64-darwin, ruby: "3.3", layout: fat }
          - { os: macos-26, label: macos-arm64, gem_platform: arm64-darwin, ruby: "3.4", layout: extension }
          - { os: macos-26, label: macos-arm64, gem_platform: arm64-darwin, ruby: "4.0", layout: extension }
          - os: windows-latest
            label: windows-x86_64
            gem_platform: x64-mingw-ucrt
            ruby: "3.3"
            layout: pinned
            # This leg's binding features and the core features actually compiled are two
            # separate switches: `--no-default-features` here turns xberg-rb's OWN
            # `#[cfg(feature = "...")]`-gated match arms/fields off, while the Windows target
            # dep in packages/ruby/ext/xberg_rb/native/Cargo.toml unconditionally asks the core
            # for the whole `windows-gnu-target` bundle (crates/xberg/Cargo.toml), regardless of
            # what is listed here. Whenever a core feature inside that bundle also has a
            # same-named xberg-rb feature (a pure forward, e.g. `office = ["xberg/office"]`),
            # that xberg-rb feature MUST be listed below too, or the core keeps a variant/field
            # the generated binding lost the match arm for (E0004 non-exhaustive match, E0063
            # missing struct field, E0609 unknown field -- previously 827 E0004s on
            # `From<KeywordAlgorithm>` alone, from `svg`/`keywords-yake`/`keywords-rake` missing
            # here). This list is exactly xberg-rb's own `default` feature set (see the
            # generated `packages/ruby/ext/xberg_rb/native/Cargo.toml`) minus the four entries
            # `windows-gnu-target` deliberately excludes: `candle-ocr` and `ocr-wasm` (not part
            # of the bundle -- native `ocr` is used instead) and `reranker`/`late-interaction`
            # (the ORT-backed engines; `windows-gnu-target` keeps only their ORT-free
            # `reranker-presets`/`late-interaction-presets` siblings, since MinGW has no ORT
            # prebuilt). `excluded_default_features = ["heic"]` in alef.toml only keeps `heic`
            # out of xberg-rb's own default list; it does not make the released gems heic-free.
            # All four gem legs (linux x86_64/aarch64, macos arm64, windows x86_64) request
            # `wordperfect`, so every gem links libwpd/librevenge (MPL-2.0). The three
            # non-Windows legs request `full`, which also includes `heic` (libheif, LGPL).
            # There is no macos-x86_64 gem leg; that unreleased macos-intel config and this
            # Windows leg are the only heic-free ones. Adding a new xberg-rb feature later
            # means adding it here too whenever `windows-gnu-target` (or its core feature)
            # also carries it. ~keep
            ruby_cargo_args: --no-default-features --features api,api-types,auto-rotate-types,captioning,chunking,chunking-tokenizers,classification,diff,embedding-presets,heuristics,html,keywords-rake,keywords-yake,late-interaction-presets,layout-types,liter-llm,markdown-footnotes,mcp,ocr,office,paddle-ocr-types,pdf,presets,quality,redaction,redaction-rehydrate,reranker-presets,sparse-embedding-presets,svg,tokio-runtime,transcription-types,tree-sitter,url-config-types,url-ingestion,xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # RubyInstaller's Windows Ruby is built against the UCRT/MinGW ABI (gem
      # platform `x64-mingw-ucrt`, already declared in packages/ruby/Rakefile's
      # CROSS_PLATFORMS), not MSVC — unlike the Python/Node/PHP/C# Windows legs
      # in this workflow, which all target genuine MSVC binaries. rb_sys's
      # create_rust_makefile detects the host Ruby's platform and asks cargo to
      # build for the matching Rust target, so the host Rust toolchain itself
      # must be the GNU one; a MSVC-hosted rustc cross-building that target
      # would need a mingw sysroot dance rb_sys does not set up. Selecting it
      # through setup-rust's own `toolchain` input (rather than a later
      # `rustup default`) keeps the action's verify-install step checking the
      # toolchain we actually build with.
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || '' }}
          # sccache's rustc spawn hits Windows error 206 on long GNU compiler arguments. ~keep
          use-sccache: ${{ runner.os == 'Windows' && 'false' || 'true' }}

      # Windows keeps setup-ruby: the gem's native build needs the RubyInstaller MSYS2/UCRT devkit, which
      # mise's RubyInstaller archive does not provide (ruby on Windows is a lock gap). ~keep
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # Ruby 3.3, 3.4 and 4.0 are the ABIs the release gems ship; mise.ci.toml locks them. After the system
      # dependencies: install-macos.sh prepends /opt/homebrew/bin to PATH, and Homebrew's ruby@3.4 then built every
      # macOS leg (1.5.3 shipped a 3.4-only darwin gem; 1.5.4's ABI merge refused it). ~keep
      - uses: xberg-io/actions/setup-mise@v1
        if: runner.os != 'Windows'
        with:
          tools: ruby=${{ matrix.ruby }}
          mise-env: ci
          config-ref: ${{ github.sha }}

      - name: Require the leg's Ruby
        shell: bash
        env:
          RUBY_MINOR: ${{ matrix.ruby }}
        run: |
          ruby -e 'abort("::error::building with Ruby #{RUBY_VERSION} (#{RbConfig.ruby}), expected #{ENV["RUBY_MINOR"]}") unless RUBY_VERSION.start_with?("#{ENV["RUBY_MINOR"]}.")'
          echo "Ruby $(ruby -e 'print RUBY_VERSION') at $(command -v ruby)"

      # `spec.files` is built from a glob that only matches LICENSE*, so stage the notice and
      # extend that glob before `gem build`. Without this the file is absent from data.tar.gz,
      # `gem contents` under-reports it, and uninstall leaves it behind; alef has no config
      # knob for extra package files yet.
      - name: Stage canonical notices into the gem source
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD_PARTY_LICENSES.md packages/ruby/
          ruby -e '
            path = "packages/ruby/xberg.gemspec"
            text = File.read(path)
            unless text.include?("THIRD_PARTY_LICENSES.md")
              File.write(path, text.sub(".glob(%W[README* LICENSE*", ".glob(%W[README* LICENSE* THIRD_PARTY_LICENSES.md"))
            end
          '
          grep -q "THIRD_PARTY_LICENSES.md" packages/ruby/xberg.gemspec

      - uses: xberg-io/actions/build-ruby-gem@v1
        with:
          package-dir: packages/ruby
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Checkout Ruby packaging verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/ci/package-ruby-native-gem.rb

      - name: Package and verify native gem
        working-directory: packages/ruby
        shell: bash
        env:
          GEM_PLATFORM: ${{ matrix.gem_platform }}
          GEM_VERSION: ${{ needs.prepare.outputs.version }}
          KEEP_SOURCE: ${{ matrix.label == 'linux-x86_64' && matrix.layout != 'extension' }}
          GEM_LAYOUT: ${{ matrix.layout }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            GEM_VERSION="$(ruby -rrubygems -e 'puts Gem::Specification.load("xberg.gemspec").version')"
          fi
          # Gem::Package names the source and native files with Gem::Version#to_s, which
          # normalizes prereleases (`1.5.0-rc.1` -> `1.5.0.pre.rc.1`); the raw prepare version
          # would not match those paths.
          GEM_VERSION="$(ruby -rrubygems -e 'print Gem::Version.new(ENV.fetch("GEM_VERSION"))')"
          ruby ../../.release-tools/scripts/ci/package-ruby-native-gem.rb "$GEM_PLATFORM" "$GEM_VERSION" "$KEEP_SOURCE" "$GEM_LAYOUT"

      - uses: actions/upload-artifact@v7
        if: matrix.layout != 'extension'
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/pkg/*.gem
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: matrix.layout == 'extension'
        with:
          name: rubyext-${{ matrix.label }}-ruby${{ matrix.ruby }}
          path: packages/ruby/pkg/ext
          if-no-files-found: error
          retention-days: 14

  php-extension:
    name: Build PHP extension (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, check-php-pie, publish-crates]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_php == 'true' &&
          ((needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.php_registry_core_available == 'true') ||
           (needs.prepare.outputs.dry_run != 'true' && needs.publish-crates.result != 'failure' &&
            (needs.check-php-pie.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ${{ matrix.platform.os }}
    env:
      MISE_ENV: ci
      MISE_ZIG_VERSION: "0.13.0"
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        platform:
          # ~keep Ubuntu 26.04 can mix Clang headers and libclang during PHP bindgen.
          - { os: ubuntu-24.04, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, label: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-26, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-2022, label: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.php_checkout_sha }}
          fetch-depth: 0

          submodules: false
      # PHP stays on its setup action (toolchain-management rule). ~keep
      - uses: xberg-io/actions/setup-php@v1
        env:
          phpts: nts
        with:
          php-version: ${{ matrix.php }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.platform.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # PIE installs one file, so on macOS the HEIF stack (libheif, libde265, libaom: decode
      # only) is linked into xberg.so statically rather than shipped as sibling dylibs, which
      # PIE would drop (#2547). Tagged source retries use this workflow revision's tools. ~keep
      - name: Checkout macOS HEIF tools
        if: runner.os == 'macOS'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/build-macos-heif-deps.sh
            scripts/ci/notices/GPL-3.0.txt
            scripts/ci/smoke-php-macos-heif.sh
            scripts/ci/stage-php-macos-notices.sh
            scripts/ci/verify-php-macos-extension.sh
            scripts/lib/retry.sh
            scripts/lib/macho.sh

      - name: Build the static HEIF stack at the macOS floor
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export XBERG_HEIF_PROFILE=php-static
          export XBERG_HEIF_PREFIX="$RUNNER_TEMP/xberg-php-heif"
          bash .release-tools/scripts/ci/build-macos-heif-deps.sh
          {
            echo "XBERG_HEIF_PREFIX=$XBERG_HEIF_PREFIX"
            echo "PKG_CONFIG_PATH=$XBERG_HEIF_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "SYSTEM_DEPS_LIBHEIF_LINK=static"
          } >> "$GITHUB_ENV"

      # ~keep ext-php-rs bindgen uses the runner's libclang 18. Zig 0.17 ships newer
      # ARM headers that libclang 18 cannot parse (`__mfp8` and NEON type failures).
      # Zig 0.13 uses LLVM 18 headers while retaining glibc-versioned targets; the job's
      # MISE_ZIG_VERSION selects it from mise.ci.toml.
      - name: Setup Zig for PHP glibc floor
        if: contains(matrix.platform.target, '-linux-gnu')
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: zig
          config-ref: ${{ github.sha }}

      - name: Build liblzma statically for PHP glibc floor
        if: contains(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      # See the equivalent step on python-wheels for the DirectML root cause
      # (xberg-io/xberg#1456). This leg had no ORT setup step at all on
      # Windows, so it defaulted to the pyke download strategy every time.
      - name: Setup ONNX Runtime (Windows)
        if: contains(matrix.platform.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-php

      # The pyke static libonnxruntime.a is built against GCC 13 libstdc++; zigbuild links
      # libc++ instead, leaving ~1,800 std:: symbols undefined and unversioned, so the
      # extension cannot be dlopen'd on Debian 12. Link Microsoft's glibc-clean ONNX Runtime
      # dynamically (ORT_STRATEGY=system) like the Dart/Java/C#/Python legs, and ship it
      # beside xberg.so below. ~keep
      - name: Setup ONNX Runtime (Linux)
        if: contains(matrix.platform.target, '-linux-gnu')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-php

      - uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: xberg-php
          lib-name: xberg_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: "false"

      # build-php-extension runs rewrite-native-deps, which strips `path =` from every
      # root [workspace.dependencies] entry so deinherit_workspace() can copy literal
      # values into the out-of-workspace crate. Past the build that mutation has no
      # consumer -- the PIE archive holds only the built shared library -- but it leaves
      # the root graph resolving BOTH a registry and a path copy of the
      # `links = "xberg_libwpd"` crate, which cargo rejects. `alef publish package` below
      # resolves `from_registry` source_crates via `cargo metadata` on this manifest and
      # would trip over it. Scoped to PHP on purpose: python-sdist genuinely ships a
      # manifest maturin resolves against the mutated root, so do not widen this. ~keep
      - name: Restore workspace manifest after the out-of-workspace PHP build
        shell: bash
        run: git checkout -- Cargo.toml Cargo.lock

      # The registry-isolated build above validates the package dependency graph, but
      # GitHub's Ubuntu image sets the artifact ABI floor. Rebuild only the shipped Linux
      # binary through Zig after restoring the workspace: v1.3.6 proved that adding
      # `-static-libstdc++` alone still emitted GLIBC_2.39 and GLIBCXX_3.4.31. ~keep
      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.platform.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.platform.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"

      - name: Rebuild PHP extension at the glibc floor
        id: php_floor_build
        if: contains(matrix.platform.target, '-linux-gnu')
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          # All three linux-arm64 legs of v1.3.10 died with exit 143 ("runner received a shutdown
          # signal", not the 90 min timeout) 16-26 min into the final xberg-php fat-LTO compile
          # of this second cold build, while the first build had finished in 17 min. Thin LTO
          # bounds the single-module memory peak, like the release-musl profile; x86_64 keeps fat LTO. ~keep
          CARGO_PROFILE_RELEASE_LTO: ${{ contains(matrix.platform.target, 'aarch64') && 'thin' || 'fat' }}
        run: |
          set -euo pipefail
          # zig's linker never emits the __cxa_finalize(__dso_handle) crtbegin does, so the
          # __cxa_atexit handlers of xberg.so's static C++ objects survive PHP's dlclose and
          # jump into unmapped memory at exit() (SIGSEGV, docker exit 139). NODELETE makes
          # dlclose a no-op for this DSO. ~keep
          export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-Wl,-z,nodelete"
          TARGET_ARG="${TARGET}.${GLIBC_FLOOR}"
          cargo zigbuild --locked -p xberg-php --release --target "${TARGET_ARG}"
          source="target/${TARGET}/release/libxberg_php.so"
          [ -f "$source" ] || {
            echo "::error::cargo zigbuild produced no PHP extension at $source"
            exit 1
          }
          echo "sha256=$(sha256sum "$source" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # alef is a third-party tool. The job-wide `-D warnings` turns its own
      # lint warnings into build errors, which has no bearing on this repo. ~keep
      - uses: xberg-io/actions/install-alef@v1
        env:
          RUSTFLAGS: ""

      - uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ contains(matrix.platform.target, 'windows') && 'vs17' || '' }}
          version: ${{ needs.prepare.outputs.version }}
          dry-run: "false"
          output-dir: dist/php-package

      # The static stack's LGPL components (libheif, libde265) need their license texts and the
      # pinned source inventory to travel with the binary. The gate then rejects any archive whose
      # xberg.so imports a non-system library, imports any HEIF or codec library, or targets above
      # the floor. ~keep
      - name: Ship codec notices and verify the macOS extension imports no codec
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/php-package/php_*.tgz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one PHP macOS archive, found ${#archives[@]}"
            exit 1
          }
          bash .release-tools/scripts/ci/stage-php-macos-notices.sh "${archives[0]}" "$XBERG_HEIF_PREFIX" "$GITHUB_WORKSPACE"
          bash .release-tools/scripts/ci/verify-php-macos-extension.sh "${archives[0]}"

      # The import gate proves what the extension does not need; this proves it still works. It
      # loads the archived binary with the job's PHP and decodes the upstream HEIC and AVIF
      # examples through it. ~keep
      - name: Load the macOS extension and decode HEIC and AVIF
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/php-package/php_*.tgz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one PHP macOS archive, found ${#archives[@]}"
            exit 1
          }
          bash .release-tools/scripts/ci/smoke-php-macos-heif.sh "${archives[0]}"

      # xberg.so carries DT_NEEDED libonnxruntime.so.1 with a $ORIGIN rpath. The archive
      # holds only xberg.so, so add the runtime beside it and refresh the checksum sidecar.
      - name: Ship ONNX Runtime beside xberg.so (Linux)
        if: contains(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/php-package/php_*.tgz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one PHP Linux archive, found ${#archives[@]}"
            exit 1
          }
          bash scripts/ci/stage-php-linux-ort.sh "${archives[0]}" "${ORT_LIB_LOCATION:?}"

      # Tagged source retries must use the verification fixes from this workflow revision. ~keep
      - name: Checkout release verification tools
        if: contains(matrix.platform.target, '-linux-gnu') || runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-php-linux-abi.sh
            scripts/ci/smoke-test-php-debian12.sh
            scripts/ci/verify-windows-dll-closure.ps1
            scripts/ci/vendor-windows-native-closure.ps1
            scripts/ci/windows_wheel_closure.py
            scripts/ci/windows_raw_staging.py
            mise.toml
            mise.lock

      - name: Setup Python for Windows release closure
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: .release-tools
          tools: python

      - name: Verify PHP Linux ABI is compatible with Debian 12
        if: contains(matrix.platform.target, '-linux-gnu')
        shell: bash
        env:
          EXPECTED_XBERG_SHA256: ${{ steps.php_floor_build.outputs.sha256 }}
        run: |
          shopt -s nullglob
          archives=(dist/php-package/php_*.tgz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one PHP Linux archive, found ${#archives[@]}"
            exit 1
          }
          bash "$GITHUB_WORKSPACE/.release-tools/scripts/ci/verify-php-linux-abi.sh" "${archives[0]}" 2.36 3.4.30 1.3.13

      - name: Load PHP extension on Debian 12
        if: contains(matrix.platform.target, '-linux-gnu')
        shell: bash
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          shopt -s nullglob
          archives=(dist/php-package/php_*.tgz)
          [ "${#archives[@]}" = 1 ] || {
            echo "::error::expected exactly one PHP Linux archive, found ${#archives[@]}"
            exit 1
          }
          bash "$GITHUB_WORKSPACE/.release-tools/scripts/ci/smoke-test-php-debian12.sh" "${archives[0]}" "$PHP_VERSION"

      # The PIE action owns packaging. Repair and audit the exact files it produced. ~keep
      - name: Stage and audit PHP Windows package closure
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
        run: |
          $archives = @(Get-ChildItem -Path dist/php-package -Include "php_*.zip", "php_*.tgz" -Recurse -File)
          if ($archives.Count -eq 0) { throw "No Windows PHP archives to audit" }
          $phpHost = (Get-Command php.exe -CommandType Application -ErrorAction Stop).Source
          $closureTools = Join-Path $env:GITHUB_WORKSPACE ".release-tools/scripts/ci"
          $ortRuntime = Get-Item -LiteralPath $env:ORT_DYLIB_PATH -ErrorAction Stop
          foreach ($archive in $archives) {
            & (Join-Path $closureTools "vendor-windows-native-closure.ps1") -Archive $archive.FullName -DllSourceDir $ortRuntime.DirectoryName -NativeGlob "xberg.dll" -PhpHost $phpHost -PhpVersion $env:EXPECTED_PHP_VERSION
            if ($LASTEXITCODE -ne 0) { throw "Windows PHP closure staging failed for $($archive.FullName)" }
            & (Join-Path $closureTools "verify-windows-dll-closure.ps1") -Artifact $archive.FullName -NativeGlob "xberg.dll" -ArtifactKind raw -RequireCrtNotices -PhpHost $phpHost -PhpVersion $env:EXPECTED_PHP_VERSION
            if ($LASTEXITCODE -ne 0) { throw "Windows PHP closure audit failed for $($archive.FullName)" }
            $sha256Path = "$($archive.FullName).sha256"
            if (Test-Path -LiteralPath $sha256Path) {
              (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $archive.Name | Set-Content -LiteralPath $sha256Path
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

  cli-binaries:
    name: Build CLI binary (${{ matrix.target }}${{ matrix.archive_suffix }})
    needs: [prepare, check-cli]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ort-dynamic` keeps ONNX Runtime out of the link: the CLI loads the pinned runtime
        # shipped beside it on first model use, so text-only runs never map it. The Windows
        # archives still link onnxruntime.dll; their closure gates require that import.
        # `heic-dynamic` does the same for libheif and its codecs on the Unix legs (ADR-0019).
        # `order_file` lays out the code a training run touches contiguously (ADR-0020); the thin-LTO
        # aarch64 gnu leg renames promoted local functions per module, so its names would not match. ~keep
        include:
          - {
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
              extra_cargo_args: "--features ort-dynamic,mcp,mcp-http,api,heic,heic-dynamic",
              order_file: true,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              extra_cargo_args: "--features ort-dynamic,mcp,mcp-http,api,heic,heic-dynamic",
            }
          - {
              os: macos-26,
              target: aarch64-apple-darwin,
              extra_cargo_args: "--features ort-dynamic,mcp,mcp-http,api,heic,heic-dynamic,candle-metal",
              order_file: true,
            }
          - {
              os: macos-26-intel,
              target: x86_64-apple-darwin,
              extra_cargo_args: "--features ort-dynamic,mcp,mcp-http,api,heic,heic-dynamic",
              order_file: true,
            }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          # Second Windows x64 archive without `heic`. The default Windows build links the vcpkg
          # libheif stack. Until #3338 that stack carried the port's default `hevc` feature (x265,
          # GPL-2.0-or-later); it is now installed as `libheif[core,aom,libde265]` and linked as
          # the dynamic triplet's DLLs (#3339), so the default archive is permissive too. This
          # archive still compiles the HEIC/HEIF codecs out entirely for redistributors that will
          # not ship libheif/libde265 at all (#3294). `formats-no-heic` stays in `default`, so PDF
          # and Office extraction are unchanged. ~keep
          - {
              os: windows-2022,
              target: x86_64-pc-windows-msvc,
              archive_suffix: "-no-gpl-lgpl",
              cargo_features: "mcp,mcp-http,api",
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          # v2: vcpkg-rs keeps no rerun-if-env-changed for VCPKGRS_*, so a restored target/
          # could reuse libheif-sys built against the static triplet (#3339). ~keep
          cache-key-prefix: cli-native-v2

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # Homebrew's libheif bottle links the GPL-2.0 x265 encoder, and
      # vendor-native-closure-macos.sh then bundles that dylib into the tarball.
      # Build the decode-only stack from source at the macOS floor instead, as the
      # Node, Python and PHP jobs already do (#1243, #3338). ~keep
      - name: Build libheif stack for the macOS floor
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=15.0
          bash scripts/ci/build-macos-heif-deps.sh
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            echo "PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      # vcpkg-rs reads these process-wide and has no rerun-if-env-changed, and an empty
      # value still counts as set, so export them only on the Windows leg instead of
      # giving every other runner a VCPKGRS_DYNAMIC that is present but empty. ~keep
      - name: Select the dynamic libheif triplet
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "VCPKGRS_TRIPLET=x64-windows"
            echo "VCPKGRS_DYNAMIC=1"
          } >>"$GITHUB_ENV"

      # `heic-dynamic` calls libheif only through dlopen'd wrappers, but `libheif-sys` still asks
      # cargo to link it, which on macOS records an LC_LOAD_DYLIB that dyld maps at every start.
      # A build-script override for its `links = "heif"` key replaces that request with nothing.
      # It lives in the runner's cargo home, outside the checkout, so no tracked file changes. ~keep
      - name: Keep libheif out of the CLI link (heic-dynamic)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          config="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$config")"
          printf '\n[target.%s.heif]\nrustc-link-lib = []\n' "$TARGET" >>"$config"
          cat "$config"

      # ADR-0020. Symbol names match only if this build shares every input of cargo's -C metadata
      # with the release build below: profile (so the same LTO override), features and --target.
      # RUSTFLAGS is not one of them, which is where the instrumentation goes. Its own target dir
      # keeps the instrumented artifacts out of the rust cache and is removed afterwards. ~keep
      - name: Generate the linker order file
        if: matrix.order_file
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'thin' || 'fat' }}
          TARGET: ${{ matrix.target }}
          EXTRA_CARGO_ARGS: ${{ matrix.extra_cargo_args }}
        run: |
          set -euo pipefail
          read -r -a cargo_args <<<"$EXTRA_CARGO_ARGS"
          CARGO_TARGET_DIR="$RUNNER_TEMP/order-file-target" python3 scripts/ci/rust/order_file.py generate \
            --work-dir "$RUNNER_TEMP/order-file" --target "$TARGET" --out "$RUNNER_TEMP/xberg.order" \
            -- "${cargo_args[@]}"
          rm -rf "$RUNNER_TEMP/order-file-target"
          {
            echo "XBERG_ORDER_FILE=$RUNNER_TEMP/xberg.order"
            echo "XBERG_LINK_MAP=$RUNNER_TEMP/xberg.map"
          } >>"$GITHUB_ENV"

      # The v1.4.0 aarch64-gnu leg died with exit 143 ("runner received a shutdown signal"). The log
      # shows no output after the last `Compiling` line, then the runner kill. Thin LTO bounds the single-module memory peak, like the other
      # ARM64 legs and the musl CLI profile; every other target keeps fat LTO. ~keep
      - uses: xberg-io/actions/build-rust-cli@v1
        id: build
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'thin' || 'fat' }}
        with:
          package-name: xberg-cli
          binary-name: xberg
          target: ${{ matrix.target }}
          # `heic` re-adds HEIC/HEIF to the prebuilt binaries — the CLI default
          # dropped it so `cargo install` works on stock Windows (#1361); CI has
          # libheif so the official binaries keep HEIC. The no-GPL archive names its
          # features in `cargo_features`, which the license gate below also audits. ~keep
          extra-cargo-args: ${{ matrix.cargo_features && format('--features {0}', matrix.cargo_features) || matrix.extra_cargo_args || '--features mcp,mcp-http,api,heic' }}

      # A name mismatch or an ignored order file still links; the link map is the only proof. ~keep
      - name: Verify the linker applied the order file
        if: matrix.order_file
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/rust/order_file.py verify-map \
            --order-file "${XBERG_ORDER_FILE:?}" --map "${XBERG_LINK_MAP:?}"

      # Stage Microsoft's digest-pinned ONNX Runtime after the build so the ort-dynamic
      # compile is unaffected. Linux re-verifies the archive digest even on a cache hit.
      # Microsoft ships no x86_64 macOS build after 1.23.2, so Intel macOS pins that
      # last self-contained release. ~keep
      - name: Setup ONNX Runtime (ort-dynamic CLI)
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ matrix.target == 'x86_64-apple-darwin' && '1.23.2' || '1.24.2' }}
          arch-id: ${{ startsWith(matrix.target, 'x86_64-') && 'x64' || 'arm64' }}
          dest-dir: crates/xberg-cli
          verify-linux-archive: "true"

      # Ship the unversioned name the runtime resolver looks for beside the binary. The
      # archive and NuGet layouts both point it at the versioned library. ~keep
      - name: Select ONNX Runtime library to ship
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          case "$RUNNER_OS" in
            Linux) lib="${ORT_LIB_LOCATION:?}/libonnxruntime.so" ;;
            macOS) lib="${ORT_LIB_LOCATION:?}/libonnxruntime.dylib" ;;
            *) echo "::error::no ONNX Runtime library name for $RUNNER_OS"; exit 1 ;;
          esac
          test -f "$lib"
          echo "ORT_VENDOR_LIB=$lib" >> "$GITHUB_ENV"

      # Retries of older source tags must use closure and gate tools from this
      # workflow revision, on every runner: the release checkout can predate them. ~keep
      - name: Checkout release closure and gate tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-windows-dll-closure.ps1
            scripts/ci/vendor-windows-native-closure.ps1
            scripts/ci/verify_no_gpl_cli_archive.py
            scripts/ci/verify_no_gpl_codecs.py
            scripts/ci/verify-release-archive.sh
            scripts/ci/verify_windows_heif_archive.py
            scripts/ci/stage_windows_heif_dlls.py
            scripts/ci/windows_wheel_closure.py
            scripts/ci/windows_raw_staging.py
            scripts/ci/notices/LGPL-3.0.txt
            scripts/ci/notices/GPL-3.0.txt
            scripts/ci/notices/GPL-SOURCE-OFFER-windows-heif.txt
            mise.toml
            mise.lock

      - name: Setup Python for Windows release closure
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: .release-tools
          tools: python

      - name: Package CLI artifact
        env:
          BINARY_PATH: ${{ steps.build.outputs.binary-path }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.archive_suffix }}
        shell: bash
        run: |
          STAGE="xberg-cli-${TARGET}${SUFFIX}"
          mkdir -p "$STAGE"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$BINARY_PATH" "$STAGE/xberg.exe"
            # libheif and libde265 are LGPL-3.0 and are linked as shared libraries, never
            # into xberg.exe (#3339). Stage only the codec roots and the DLLs they actually
            # import; a blind *.dll copy would also ship unrelated DLLs. z.dll is staged separately below.
            # Then the §4(b) texts and the §3/§6 corresponding-source offer.
            # The no-GPL archive compiles `heic` out and stays codec-free. ~keep
            CLOSURE_TOOLS="$GITHUB_WORKSPACE/.release-tools/scripts/ci"
            if [[ "$SUFFIX" != "-no-gpl-lgpl" ]]; then
              HEIF_BIN="$(cygpath -u "${XBERG_LIBHEIF_DLL_DIR:?}")"
              HEIF_SHARE="$(cygpath -u "${XBERG_LIBHEIF_NOTICE_DIR:?}")"
              python "$CLOSURE_TOOLS/stage_windows_heif_dlls.py" \
                --source "$HEIF_BIN" --destination "$STAGE"
              NOTICES="$GITHUB_WORKSPACE/.release-tools/scripts/ci/notices"
              cp "$NOTICES/LGPL-3.0.txt" "$NOTICES/GPL-3.0.txt" "$STAGE/"
              cp "$NOTICES/GPL-SOURCE-OFFER-windows-heif.txt" "$STAGE/GPL-SOURCE-OFFER.txt"
              cp "$HEIF_SHARE/libheif/copyright" "$STAGE/libheif-COPYING"
              cp "$HEIF_SHARE/libde265/copyright" "$STAGE/libde265-COPYING"
              cp "$HEIF_SHARE/aom/copyright" "$STAGE/aom-COPYING"
            fi
            # libz-sys resolves the vcpkg zlib installed for the dynamic triplet, so xberg.exe
            # itself imports z.dll in both archive variants; the closure gate rejects the ZIP
            # without it. zlib is permissively licensed and covered by THIRD_PARTY_LICENSES.md. ~keep
            ZLIB_DLL="$(cygpath -u "${XBERG_LIBHEIF_DLL_DIR:?}")/z.dll"
            test -f "$ZLIB_DLL"
            cp "$ZLIB_DLL" "$STAGE/z.dll"
            ORT_RUNTIME_DLL="$(cygpath -u "${ORT_DYLIB_PATH:?}")"
            test -f "$ORT_RUNTIME_DLL"
            pwsh -NoProfile -File "$CLOSURE_TOOLS/vendor-windows-native-closure.ps1" -Artifact "$STAGE" -DllSourceDir "$(cygpath -w "$(dirname "$ORT_RUNTIME_DLL")")" -NativeGlob "xberg.exe"
            # Remove workspace-provided ORT before the staged startup smoke check.
            # The final archive audit independently checks hard and delayed imports. ~keep
            WORKSPACE_POSIX="$(pwd)"
            CLEAN_PATH=""
            while IFS= read -r path_entry; do
              [ -n "$path_entry" ] || continue
              case "$path_entry" in
                "$WORKSPACE_POSIX" | "$WORKSPACE_POSIX"/*)
                  continue
                  ;;
              esac
              # Drop host copies of every DLL the archive must vendor, so a green smoke
              # test cannot come from the runner's own vcpkg tree (the codec DLLs are
              # staged before this loop; a missing one must fail here, not resolve from
              # C:\xberg-vcpkg-*). ~keep
              masked=""
              for dll in onnxruntime.dll heif.dll libheif.dll libde265.dll aom.dll; do
                if [ -e "$path_entry/$dll" ]; then
                  masked="$dll"
                  break
                fi
              done
              if [ -n "$masked" ]; then
                echo "Dropping PATH entry providing $masked: $path_entry"
                continue
              fi
              CLEAN_PATH="${CLEAN_PATH:+$CLEAN_PATH:}$path_entry"
            done <<<"${PATH//:/$'\n'}"
            # The loader always searches System32 ahead of PATH, so a DLL there
            # can still mask a missing vendored copy. Say so in the log rather
            # than let a green step imply more than it proves.
            if [ -e "/c/Windows/System32/onnxruntime.dll" ]; then
              echo "::warning title=Windows CLI smoke test is weakened::C:\\Windows\\System32\\onnxruntime.dll exists on this runner and is searched before PATH, so xberg.exe --version may succeed here on a host DLL that end users do not have"
            fi
            PATH="$CLEAN_PATH" "$STAGE/xberg.exe" --version
            echo "Windows CLI smoke test passed: $STAGE/xberg.exe --version ran without a host-provided onnxruntime.dll or HEIF codec DLL"
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            pwsh -NoProfile -File "$CLOSURE_TOOLS/verify-windows-dll-closure.ps1" -Artifact "${STAGE}.zip" -NativeGlob "xberg.exe" -ArtifactKind raw -RequireCrtNotices
          else
            cp "$BINARY_PATH" "$STAGE/xberg"
            # The ort-dynamic CLI loads ONNX Runtime from beside the executable on first
            # model use (ort_discovery::resolve_ort_library). Prove the binary does not
            # link it, so text-only extraction never maps the library at startup. ~keep
            if [[ "$TARGET" == *-apple-darwin ]]; then
              linked="$(otool -L "$STAGE/xberg")"
            else
              linked="$(readelf -d "$STAGE/xberg")"
            fi
            if grep -qi onnxruntime <<<"$linked"; then
              echo "::error::xberg links ONNX Runtime at load time; the ort-dynamic build must not"
              echo "$linked"
              exit 1
            fi
            if [[ "$TARGET" == *-apple-darwin ]]; then
              cp -L "${ORT_VENDOR_LIB:?}" "$STAGE/libonnxruntime.dylib"
              chmod u+w "$STAGE/libonnxruntime.dylib"
              if [[ "$TARGET" == "x86_64-apple-darwin" ]]; then
                install_name_tool -id "@loader_path/libonnxruntime.dylib" "$STAGE/libonnxruntime.dylib"
                codesign --force -s - "$STAGE/libonnxruntime.dylib" || true
              fi
              # Microsoft's runtime links only system frameworks, so the one file is the
              # whole closure; arm64 kills a dlopen of an unsigned library. ~keep
              deps="$(otool -L "$STAGE/libonnxruntime.dylib" | tail -n +3 | awk '{print $1}' \
                | grep -E '^(/opt/homebrew|/usr/local)/' || true)"
              if [[ -n "$deps" ]]; then
                echo "::error::vendored ONNX Runtime links non-system libraries:"; echo "$deps"; exit 1
              fi
              if ! codesign --verify --strict "$STAGE/libonnxruntime.dylib"; then
                codesign --force -s - "$STAGE/libonnxruntime.dylib"
                codesign --verify --strict "$STAGE/libonnxruntime.dylib"
              fi
            fi
            if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
              cp -L "${ORT_VENDOR_LIB:?}" "$STAGE/libonnxruntime.so"
              missing="$(ldd "$STAGE/libonnxruntime.so" | grep -F 'not found' || true)"
              if [[ -n "$missing" ]]; then
                echo "::error::vendored ONNX Runtime has unresolved dependencies:"; echo "$missing"; exit 1
              fi
            fi
            # heic-dynamic opens libheif on the first HEIF decode, from beside the executable
            # (ADR-0019), so the binary must not link it and the closure walk below no longer
            # reaches it. Ship the library pkg-config resolves, the one libheif-sys built against,
            # and vendor its codec closure beside it. ~keep
            if grep -qi libheif <<<"$linked"; then
              echo "::error::xberg links libheif at load time; the heic-dynamic build must not"
              echo "$linked"
              exit 1
            fi
            heif_libdir="$(pkg-config --variable=libdir libheif)"
            if [[ "$TARGET" == *-apple-darwin ]]; then
              cp -L "$heif_libdir/libheif.1.dylib" "$STAGE/libheif.1.dylib"
              chmod u+w "$STAGE/libheif.1.dylib"
              bash scripts/ci/vendor-native-closure-macos.sh "$STAGE/libheif.1.dylib"
            else
              cp -L "$heif_libdir/libheif.so.1" "$STAGE/libheif.so.1"
              chmod u+w "$STAGE/libheif.so.1"
              bash scripts/ci/vendor-native-closure.sh "$STAGE/libheif.so.1"
            fi
            # Bundle any remaining non-system dylib imports of the binary next to it
            # and rewrite their load commands to @loader_path so the tarball is
            # self-contained rather than carrying an absolute Homebrew path that is
            # absent on users' machines (xberg-io/xberg#1357). The dlopen'd ONNX
            # Runtime and libheif are not link-time dependencies, so this closure
            # walk does not disturb them.
            if [[ "$TARGET" == *-apple-darwin ]]; then
              bash scripts/ci/vendor-native-closure-macos.sh "$STAGE/xberg"
              "$STAGE/xberg" --version
            fi
            # Ship the complete non-system dependency closure of the Linux binary.
            if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
              bash scripts/ci/vendor-native-closure.sh "$STAGE/xberg"
              env -u LD_LIBRARY_PATH "$STAGE/xberg" --version
            fi
            bash scripts/ci/smoke-cli-heif.sh "$STAGE"
            bash scripts/ci/smoke-cli-ort.sh "$STAGE"
            tar -czf "${STAGE}.tar.gz" "$STAGE"
          fi

      # `cargo deny` cannot see C codecs and the macOS/Linux closures are walked by
      # filename, not by what the linked bytes reference. Open the finished artifact
      # and fail on an x265 file name, a `libx265` load command/DT_NEEDED entry or an
      # `x265_*` symbol. Both Windows archives are audited: the default one links the
      # vcpkg libheif stack, the no-GPL one compiles it out.
      - name: Verify CLI archive is free of the GPL x265 encoder
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          set -euo pipefail
          gate=.release-tools/scripts/ci/verify-release-archive.sh
          test -f "$gate" || { echo "::error::missing $gate; the gate must come from github.workflow_sha"; exit 1; }
          bash "$gate" "xberg-cli-${TARGET}${SUFFIX}.*"

      - name: Setup cargo-deny for the no-GPL license audit
        if: runner.os == 'Windows' && matrix.archive_suffix == '-no-gpl-lgpl'
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "true"
          install-args: cargo-deny

      # Cargo metadata alone cannot prove this artifact is GPL-free: libheif and libde265 are C
      # libraries reached through `libheif-sys` and the vcpkg port, so the crate license graph
      # stays clean whether or not they are in the binary. `cargo deny` covers the Rust crates
      # of the exact shipped feature graph (no `heic`), and the archive audit covers the
      # linked/bundled codecs in xberg.exe and its sibling DLLs. ~keep
      - name: Verify no GPL/LGPL codecs in the no-GPL CLI archive
        if: runner.os == 'Windows' && matrix.archive_suffix == '-no-gpl-lgpl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.archive_suffix }}
          FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          STAGE="xberg-cli-${TARGET}${SUFFIX}"
          # Naming the tool keeps `mise exec` from auto-installing every other tool in mise.toml;
          # the unrelated dotnet install failed on this runner in 1.5.1 and 1.5.2. ~keep
          mise exec cargo-deny -- cargo deny --manifest-path crates/xberg-cli/Cargo.toml --locked \
            --features "$FEATURES" --target "$TARGET" check licenses
          "$STAGE/xberg.exe" formats --format json > "$RUNNER_TEMP/xberg-formats.json"
          python .release-tools/scripts/ci/verify_no_gpl_cli_archive.py \
            --archive "${STAGE}.zip" \
            --formats-json "$RUNNER_TEMP/xberg-formats.json" \
            --require-format pdf \
            --require-format docx \
            --require-format xlsx

      # The default Windows archive carries the LGPL-3.0 libheif/libde265 codecs (#3339). This
      # gate reads the shipped bytes: xberg.exe must import heif.dll, the codec DLL closure
      # must resolve inside the archive, and LGPL-3.0.txt, GPL-3.0.txt, the upstream port
      # copyright files and THIRD_PARTY_LICENSES.md must travel with it. A return to static
      # linking fails the import check instead of shipping without relink material. ~keep
      - name: Verify the Windows HEIF archive links libheif dynamically
        if: runner.os == 'Windows' && matrix.archive_suffix != '-no-gpl-lgpl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python .release-tools/scripts/ci/verify_windows_heif_archive.py \
            --archive "xberg-cli-${TARGET}.zip"

      - name: Checkout Linux CLI installer verification tools
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .cli-release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/install.sh
            scripts/ci/smoke-test-cli-installer.sh
            scripts/ci/fixtures/musl-python-smoke.pdf
            crates/xberg/tests/fixtures/office/merged_cells.docx

      - name: Smoke test packaged Linux CLI in a clean container
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          test -n "$VERSION"
          docker pull ubuntu:24.04
          docker run --rm --network none -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/.cli-release-tools/scripts/ci/smoke-test-cli-installer.sh "/src/xberg-cli-${TARGET}.tar.gz" "$VERSION" gnu

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}${{ matrix.archive_suffix }}
          path: |
            xberg-cli-${{ matrix.target }}${{ matrix.archive_suffix }}.tar.gz
            xberg-cli-${{ matrix.target }}${{ matrix.archive_suffix }}.zip
          if-no-files-found: ignore
          retention-days: 14

  cli-binaries-musl:
    name: Build CLI binary (${{ matrix.target }})
    needs: [prepare, check-cli]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      - name: Build CLI via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-build \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --output type=local,dest=./build-output .

      - name: Package CLI artifact (with bundled lib/)
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="xberg-cli-${TARGET}"
          mkdir -p "$STAGE/lib"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          cp build-output/xberg "$STAGE/xberg"
          cp build-output/xberg.bin "$STAGE/xberg.bin"
          cp -a build-output/lib/. "$STAGE/lib/"
          chmod +x "$STAGE/xberg"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      # Retries of older source tags must use gate tools from this workflow revision. ~keep
      - name: Checkout release archive gate tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-release-archive.sh
            scripts/ci/verify_no_gpl_codecs.py

      # The closure copy walks whatever Alpine's libheif plugins pull in; prove the
      # packed archive carries no x265 plugin or x265-linked binary. ~keep
      - name: Verify musl CLI archive is free of the GPL x265 encoder
        shell: bash
        run: |
          set -euo pipefail
          gate=.release-tools/scripts/ci/verify-release-archive.sh
          test -f "$gate" || { echo "::error::missing $gate; the gate must come from github.workflow_sha"; exit 1; }
          bash "$gate" 'xberg-cli-*.tar.gz'

      - name: Checkout Linux CLI installer verification tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .cli-release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/install.sh
            scripts/ci/smoke-test-cli-installer.sh
            scripts/ci/fixtures/musl-python-smoke.pdf
            crates/xberg/tests/fixtures/office/merged_cells.docx

      - name: Smoke test packaged Linux CLI in a clean container
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          test -n "$VERSION"
          docker pull debian:12-slim
          # A republish may build an older checkout using the current workflow's smoke script. ~keep
          test -r docker/Dockerfile.musl-build
          mimalloc_required=0
          if grep -Fxq '# xberg-release-smoke: mimalloc-required ~keep' docker/Dockerfile.musl-build; then
            mimalloc_required=1
          fi
          docker run --rm --network none -e "SMOKE_REQUIRE_MIMALLOC=$mimalloc_required" -v "$PWD:/src:ro" debian:12-slim \
            bash /src/.cli-release-tools/scripts/ci/smoke-test-cli-installer.sh "/src/xberg-cli-${TARGET}.tar.gz" "$VERSION" musl

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: xberg-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Fully static musl CLI for `cargo binstall xberg-cli`. binstall extracts only
  # the binary from the archive, so this ships ONE static ELF (no sibling dylibs,
  # unlike the bundled cli-binaries-musl tarball). x86_64 gets Candle OCR
  # (binstall-ocr); aarch64 is extraction-only (binstall) since candle's gemm-f16
  # needs fullfp16, absent on the musl aarch64 baseline. Assets are named
  # `xberg-cli-binstall-<target>` so upload-cli-release attaches them via its
  # existing `xberg-cli-*` glob, and `[package.metadata.binstall]` points here.
  cli-binaries-binstall:
    name: Build static binstall CLI (${{ matrix.target }})
    needs: [prepare, check-cli]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, features: binstall-ocr }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, features: binstall }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      - name: Build static CLI via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.binstall-musl \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --build-arg FEATURES=${{ matrix.features }} \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      - name: Package binstall CLI artifact (single static binary)
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="xberg-cli-binstall-${TARGET}"
          mkdir -p "$STAGE"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          cp build-output/xberg "$STAGE/xberg"
          chmod +x "$STAGE/xberg"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      # Retries of older source tags must use gate tools from this workflow revision. ~keep
      - name: Checkout release archive gate tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-release-archive.sh
            scripts/ci/verify_no_gpl_codecs.py

      # The binstall profile is decode-only (`formats-no-heic`), but the artifact is
      # still a release binary: prove it carries no x265 rather than infer it from
      # the feature list. ~keep
      - name: Verify binstall CLI archive is free of the GPL x265 encoder
        shell: bash
        run: |
          set -euo pipefail
          gate=.release-tools/scripts/ci/verify-release-archive.sh
          test -f "$gate" || { echo "::error::missing $gate; the gate must come from github.workflow_sha"; exit 1; }
          bash "$gate" 'xberg-cli-binstall-*.tar.gz'

      - uses: actions/upload-artifact@v7
        with:
          name: cli-binstall-${{ matrix.target }}
          path: xberg-cli-binstall-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  go-ffi-libraries:
    name: Build Go FFI library (${{ matrix.platform }})
    needs: [prepare, check-go]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_go == 'true' &&
          (needs.prepare.outputs.dry_run == 'true' || needs.check-go.outputs.exists != 'true' ||
           needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, musl: false }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu, musl: false }
          - { os: macos-26, platform: macos-arm64, target: aarch64-apple-darwin, musl: false }
          - { os: macos-26-intel, platform: macos-x86_64, target: x86_64-apple-darwin, musl: false }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, musl: false }
          - { os: ubuntu-latest, platform: linux-x86_64-musl, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64-musl, target: aarch64-unknown-linux-musl, musl: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # Zig is used only by the linux-gnu legs' glibc 2.28 floor build; one setup-mise call per
      # job keeps the mise cache for this key from carrying tools another call installed. ~keep
      - name: Set up mise and install Zig for GNU targets
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: ${{ contains(matrix.target, '-linux-gnu') && 'true' || 'false' }}
          install-args: zig
          config-ref: ${{ github.sha }}

      - uses: xberg-io/actions/setup-rust@v1
        if: ${{ !matrix.musl }}
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        if: ${{ !matrix.musl }}
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows') || contains(matrix.target, '-linux-gnu')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - name: Install alef CLI
        if: ${{ !matrix.musl }}
        uses: xberg-io/actions/install-alef@v1

      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"

      - name: Package versioned Go archive with static-link metadata
        if: ${{ !matrix.musl }}
        shell: bash
        run: mise run go:publish:package "${{ matrix.target }}" "${{ needs.prepare.outputs.version }}"

      - name: Build and package musl Go archive
        if: ${{ matrix.musl }}
        shell: bash
        run: mise run go:publish:package:musl "${{ matrix.target }}" "${{ matrix.platform }}" "${{ needs.prepare.outputs.version }}"

      - name: Ship + verify ONNX Runtime (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/go-ffi/*.tar.gz; do
            shipped=1
            bash scripts/ci/vendor-native-closure.sh "$t"
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-${{ matrix.platform }}
          path: dist/go-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  c-ffi-libraries:
    name: Build C FFI distribution (${{ matrix.platform }})
    needs: [prepare, check-c-ffi]
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_c_ffi == 'true' && (needs.check-c-ffi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-26, platform: macos-arm64, target: aarch64-apple-darwin }
          # CRT staging requires a reviewed Visual Studio 2022 installation. ~keep
          - { os: windows-2022, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows') || contains(matrix.target, '-linux-gnu')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: zig
          config-ref: ${{ github.sha }}

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - name: Install verified cargo-zigbuild for GNU targets
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          disable-cache: "true"
          install-llvm-cov: "false"
          cargo-zigbuild-revision: "89c352ae6ff0bbafe17788da327764d9ef92240b"

      - id: build_ffi
        uses: xberg-io/actions/build-rust-ffi@v1
        with:
          crate-name: xberg-ffi
          target: ${{ matrix.target }}
          glibc-version: ${{ contains(matrix.target, '-linux-gnu') && env.GLIBC_FLOOR || '' }}
          require-static: "true"

      # Retries of older source tags must use closure tools from this workflow revision. ~keep
      - name: Checkout Windows release closure tools
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/verify-windows-dll-closure.ps1
            scripts/ci/vendor-windows-native-closure.ps1
            scripts/ci/windows_wheel_closure.py
            scripts/ci/windows_raw_staging.py
            mise.toml
            mise.lock

      - name: Setup Python for Windows release closure
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: .release-tools
          tools: python

      - name: Stage C FFI distribution
        env:
          FFI_NATIVE_STATIC_LIBS: ${{ steps.build_ffi.outputs.native-static-libs-path }}
          FFI_SHARED_LIBRARY: ${{ steps.build_ffi.outputs.shared-library-path }}
          FFI_STATIC_LIBRARY: ${{ steps.build_ffi.outputs.static-library-path }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="xberg-ffi-${PLATFORM}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          [ -n "$FFI_SHARED_LIBRARY" ] && [ -f "$FFI_SHARED_LIBRARY" ] || {
            echo "::error::shared FFI library output is missing"
            exit 1
          }
          [ -n "$FFI_STATIC_LIBRARY" ] && [ -f "$FFI_STATIC_LIBRARY" ] || {
            echo "::error::static FFI library output is missing"
            exit 1
          }
          cp "$FFI_SHARED_LIBRARY" "$FFI_STATIC_LIBRARY" "$STAGE/lib/"
          if [ -n "$FFI_NATIVE_STATIC_LIBS" ]; then
            [ -f "$FFI_NATIVE_STATIC_LIBS" ] || {
              echo "::error::native static-link metadata output does not exist"
              exit 1
            }
            cp "$FFI_NATIVE_STATIC_LIBS" "$STAGE/lib/native-static-libs.txt"
          elif [[ "$TARGET" != *-linux-gnu ]]; then
            echo "::error::native static-link metadata is missing"
            exit 1
          fi
          cp crates/xberg-ffi/include/xberg.h "$STAGE/include/"
          python3 scripts/ci/package-notices.py stage "$STAGE"
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            ORT_RUNTIME_DLL="$(cygpath -u "${ORT_DYLIB_PATH:?}")"
            test -f "$ORT_RUNTIME_DLL"
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/.release-tools/scripts/ci/vendor-windows-native-closure.ps1" -Artifact "$STAGE" -DllSourceDir "$(cygpath -w "$(dirname "$ORT_RUNTIME_DLL")")" -NativeGlob "xberg_ffi.dll"
          fi
          mkdir -p dist/c-ffi
          tar -czf "dist/c-ffi/${STAGE}.tar.gz" "$STAGE"
          python3 scripts/ci/package-notices.py verify "dist/c-ffi/${STAGE}.tar.gz" "$STAGE"

      - name: Audit final Windows C FFI distribution
        if: contains(matrix.target, '-pc-windows-msvc')
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.release-tools\scripts\ci\verify-windows-dll-closure.ps1" -Artifact "dist/c-ffi/xberg-ffi-${{ matrix.platform }}.tar.gz" -NativeGlob "xberg_ffi.dll" -ArtifactKind raw -RequireCrtNotices
          if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed" }

      - name: Ship + verify ONNX Runtime (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/c-ffi/*.tar.gz; do
            shipped=1
            bash scripts/ci/vendor-native-closure.sh "$t"
            notice_root="$(basename "$t" .tar.gz)"
            python3 scripts/ci/package-notices.py verify "$t" "$notice_root"
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      - uses: actions/upload-artifact@v7
        with:
          name: c-ffi-${{ matrix.platform }}
          path: dist/c-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

