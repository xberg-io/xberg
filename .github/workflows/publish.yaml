name: Publish Release

on:
  workflow_dispatch:
    inputs:
      plugins-only:
        description: "Publish only missing plugin registry versions from main"
        type: boolean
        default: false
      tag:
        description: "Release tag to build (e.g., v5.0.0-rc.1)"
        required: false
        type: string
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      targets:
        description: "Comma-separated list of release targets, or 'all'"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Prepare artifacts without publishing"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete and re-create the tag on current HEAD before publishing"
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Force republish targets whose registry version already exists"
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

env:
  GLIBC_FLOOR: "2.28"
  # Windows runners check out with core.autocrlf=true, which turns LICENSE and THIRD_PARTY_LICENSES.md
  # into CRLF and fails every notice-byte gate against the canonical LF bytes. ~keep
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  # jsDelivr (which serves the published @xberg-io/xberg-wasm package to the
  # live browser demo) hard-caps a single file at 50 MB and rejects the whole
  # package past 150 MB total -- either cap breached serves a 403 to every
  # consumer, which has already happened once (commit 8ad6b2f4ccf dropped
  # tree-sitter from wasm-target purely to get back under the per-file cap).
  # jsDelivr's caps are BINARY, not decimal -- measured against the live CDN on
  # 2026-08-13, not read off the docs (which never state a byte count): a
  # 52,190,688-byte npm file is served 200 and 52,537,424 is refused 403, so the
  # per-file cap is 50 MiB = 52,428,800. Decimal 50,000,000 is ruled out by that
  # served file. Package cap likewise 150 MiB = 157,286,400, measured on UNPACKED
  # size, not the tarball. Note the npm per-file cap is UNDOCUMENTED (jsDelivr's
  # README states only the 20 MiB GitHub figure), so it can move without notice.
  #
  # The per-file budget was 40 MiB (80% of the cap). The bundle is now 50,394,309
  # bytes -- 120% of that budget but still only 96.1% of the real cap, so the gate
  # was failing while jsDelivr was not. Raised to 49 MiB, which still fails CI
  # BEFORE jsDelivr 403s every consumer, but stops blocking a package that is
  # genuinely servable. This is deliberately tight: it leaves ~1 MB, and the
  # bundle grew +2.46 MB in the 2.5 weeks to 2026-08-12 (~1 MB/week), so this
  # buys roughly a week and then demands the real cut rather than another bump.
  # The cut is tracked and is NOT a config flip: dropping `ner-candle-wasm` fails
  # to compile because crates/xberg-wasm/src/bridge/ner_model.rs (hand-written)
  # imports CandleBackend unconditionally and bridge/mod.rs declares it ungated,
  # and xberg-wasm/Cargo.toml is alef-generated with no ner feature to gate on --
  # so it needs an alef.toml feature + regen + source gating. ~keep
  WASM_MAX_FILE_BYTES: "51380224" # 49 MiB; jsDelivr per-file hard cap is 50 MiB (52,428,800)
  WASM_MAX_PACKAGE_BYTES: "125829120" # 120 MiB; jsDelivr per-package hard cap is 150 MiB (157,286,400)

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || github.event.inputs.tag)) || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    if: >-
      ${{ !inputs.plugins-only && (github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && github.actor != 'xberg-dev-publisher[bot]')) }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      source_sha: ${{ steps.release-source.outputs.commit }}
      php_registry_core_available: ${{ steps.php-registry-core.outputs.available }}
      php_checkout_sha: ${{ steps.php-source.outputs.sha }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      matrix_ref: ${{ steps.meta.outputs.matrix_ref }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      release_targets: ${{ steps.meta.outputs.release_targets }}
      release_any: ${{ steps.meta.outputs.release_any }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_cli: ${{ steps.meta.outputs.release_cli }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      elixir_assets: ${{ steps.elixir-assets.outputs.names }}
      elixir_assets_multiline: ${{ steps.elixir-assets.outputs.multiline }}
      cli_assets: ${{ steps.cli-assets.outputs.names }}
      cli_assets_multiline: ${{ steps.cli-assets.outputs.multiline }}
      release_c_ffi: ${{ steps.meta.outputs.release_c_ffi }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
      release_kotlin: ${{ steps.meta.outputs.release_kotlin }}
      release_kotlin_android: ${{ steps.meta.outputs.release_kotlin_android }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        id: release-source
        uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.republish == true && (inputs.ref || github.event.repository.default_branch)) || inputs.ref || inputs.tag || ((inputs.dry_run == true || inputs.dry_run == 'true' || github.event.client_payload.dry_run == true || github.event.client_payload.dry_run == 'true') && github.sha) || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"

      - name: Retag for republish
        if: >-
          ${{ (inputs.republish == true || github.event.client_payload.republish == true) &&
              inputs.dry_run != true && inputs.dry_run != 'true' &&
              github.event.client_payload.dry_run != true && github.event.client_payload.dry_run != 'true' }}
        uses: xberg-io/actions/retag-for-republish@v1
        with:
          tag: ${{ inputs.tag || github.event.client_payload.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1

      - name: List expected Elixir NIF assets
        id: elixir-assets
        if: steps.meta.outputs.release_elixir == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Keep these targets in sync with alef.toml and the three Elixir NIF build matrices. ~keep
          suffix="-v${VERSION}-nif-2.16"
          names=()
          for target in aarch64-apple-darwin {aarch64,x86_64}-unknown-linux-{gnu,musl}; do
            names+=("libxberg_nif${suffix}-${target}.so.tar.gz")
          done
          names+=("xberg_nif${suffix}-x86_64-pc-windows-msvc.dll.tar.gz")
          {
            (IFS=,; echo "names=${names[*]}")
            printf 'multiline<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${names[@]}")"
          } >> "$GITHUB_OUTPUT"

      - name: List expected CLI release assets
        id: cli-assets
        # The single source of truth for the CLI release asset set. `check-cli`,
        # `upload-cli-release` and `verify-assets` all read these two outputs, so a target
        # cannot be required by one gate and silently dropped by another: v1.4.1 and v1.4.2
        # published without `xberg-cli-x86_64-pc-windows-msvc.zip` because `check-cli`
        # accepted seven names, the upload gate never ran on the re-run, and the local-glob
        # verifier matched the plain zip in place of the missing no-GPL one. Emitted on
        # every run (not just CLI releases) so the list is never conditionally empty. ~keep
        shell: bash
        run: |
          set -euo pipefail
          names=(
            xberg-cli-aarch64-apple-darwin.tar.gz
            xberg-cli-x86_64-apple-darwin.tar.gz
            xberg-cli-aarch64-unknown-linux-gnu.tar.gz
            xberg-cli-x86_64-unknown-linux-gnu.tar.gz
            xberg-cli-aarch64-unknown-linux-musl.tar.gz
            xberg-cli-x86_64-unknown-linux-musl.tar.gz
            xberg-cli-x86_64-pc-windows-msvc.zip
            xberg-cli-x86_64-pc-windows-msvc-no-gpl-lgpl.zip
            xberg-cli-binstall-aarch64-unknown-linux-musl.tar.gz
            xberg-cli-binstall-x86_64-unknown-linux-musl.tar.gz
          )
          test "${#names[@]}" -eq 10
          {
            (IFS=,; echo "names=${names[*]}")
            printf 'multiline<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${names[@]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PHP source commit
        id: php-source
        if: steps.meta.outputs.release_php == 'true'
        shell: bash
        env:
          PHP_CHECKOUT_REF: ${{ steps.meta.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify --end-of-options "${PHP_CHECKOUT_REF:?}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check exact registry core for PHP qualification
        id: php-registry-core
        if: steps.meta.outputs.release_php == 'true' && steps.meta.outputs.dry_run == 'true'
        shell: bash
        env:
          PHP_SOURCE_SHA: ${{ steps.php-source.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(git show "$PHP_SOURCE_SHA:Cargo.toml" | sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p')"
          test -n "$version"
          index="$(curl --fail --silent --show-error --retry 3 --max-time 60 https://index.crates.io/xb/er/xberg)"
          available="$(jq -s --arg version "$version" 'any(.[]; .vers == $version and .yanked == false)' <<< "$index")"
          printf 'available=%s\n' "$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" != true ]]; then
            echo "::notice::Skipping registry-backed PHP qualification: xberg $version is unavailable or yanked"
          fi

      # Created as a draft so publication is reversible: the release is only un-drafted by
      # `finalize-github-release-after-uploads`, which requires `verify-assets` to pass.
      # v1.4.1 and v1.4.2 were created non-draft and stayed public with 0 and 8 CLI assets
      # respectively, which no gate could retract. Assets upload into the draft over the run;
      # publish-docker.yaml triggers on `published`, so images still publish only once the
      # asset gate has passed. ~keep
      - name: Ensure GitHub Release exists for tag
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          target: ${{ steps.meta.outputs.target_sha }}
          notes: "Release ${{ steps.meta.outputs.tag }}"
          draft: "true"
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  validate-versions:
    name: Validate language manifest versions
    needs: prepare
    # Runs on dry runs too. Checkout + a version comparison, no secret, no mutation, so there
    # is nothing to guard against -- and catching a language manifest that disagrees with the
    # release version is precisely what a dry run is for. It can legitimately go red when the
    # version has not been bumped yet; that is the intended signal, not a flake. ~keep
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Validate versions
        uses: xberg-io/actions/validate-versions@v1
        with:
          version: ${{ needs.prepare.outputs.version }}

  check-pypi:
    name: Check PyPI for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_python == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pypi
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          # One wheel per python-wheels / python-wheels-musl leg plus the sdist. A version
          # PyPI holds only part of (1.3.9: no Windows wheel, no sdist) reads as missing, so
          # the builds re-run and publish-pypi uploads just the absent files. ~keep
          required-files: |
            *-macosx_*_arm64.whl
            *-macosx_*_x86_64.whl
            *-manylinux_*_aarch64.whl
            *-manylinux_*_x86_64.whl
            *-musllinux_*_aarch64.whl
            *-musllinux_*_x86_64.whl
            *-win_amd64.whl
            *.tar.gz

  check-npm:
    name: Check npm for existing versions
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.release_node == 'true' || needs.prepare.outputs.release_wasm == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      node_exists: ${{ steps.check.outputs.exists }}
      wasm_exists: ${{ fromJSON(steps.check.outputs.results).wasm_exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/xberg"
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            wasm_exists=@xberg-io/xberg-wasm

  check-rubygems:
    name: Check RubyGems for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_ruby == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: rubygems
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-maven:
    name: Check Maven Central for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' &&
          (needs.prepare.outputs.release_java == 'true' ||
           (needs.prepare.outputs.dry_run != 'true' &&
            (needs.prepare.outputs.release_kotlin_android == 'true' || needs.prepare.outputs.release_kotlin == 'true')))) }}
    runs-on: ubuntu-latest
    outputs:
      java_exists: ${{ steps.check.outputs.exists }}
      kotlin_exists: ${{ fromJSON(steps.check.outputs.results).kotlin_exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: maven
          package: "io.xberg:xberg"
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            kotlin_exists=io.xberg:xberg-android

  check-nuget:
    name: Check NuGet for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_csharp == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: nuget
          # Must match <PackageId> in packages/csharp/Xberg/Xberg.csproj. ~keep
          package: XbergIo.Xberg
          version: ${{ needs.prepare.outputs.version }}

  check-packagist:
    name: Check Packagist for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_php == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: packagist
          # Must match the "name" in the root composer.json. ~keep
          package: xberg-io/xberg
          version: ${{ needs.prepare.outputs.version }}

  # PIE archives are gated on the release, not on Packagist: Packagist syncs every tag on its
  # own, so it lists the version before any archive exists, and gating on it skipped the PHP
  # builds on every re-run (v1.4.1: on Packagist, zero release assets). ~keep
  check-php-pie:
    name: Check GitHub Release for PHP PIE assets
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_php == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: List expected PIE assets
        id: names
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Keep in sync with the php-extension matrix and verify-assets. ~keep
          names=()
          for php in 8.3 8.4 8.5; do
            for platform in x86_64-linux-glibc arm64-linux-glibc arm64-darwin-bsdlibc; do
              names+=("php_xberg-${TAG}_php${php}-${platform}-nts.tgz")
            done
            names+=("php_xberg-${TAG}-${php}-nts-vs17-x86_64.zip")
          done
          (IFS=,; echo "names=${names[*]}") >>"$GITHUB_OUTPUT"

      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          assets: ${{ steps.names.outputs.names }}

  check-cratesio:
    name: Check crates.io for existing versions
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && ((needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_crates == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      xberg_exists: ${{ steps.check.outputs.exists }}
      all_exist: ${{ steps.check.outputs.all-exist }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: cratesio
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            tesseract_exists=xberg-tesseract
            paddle_exists=xberg-paddle-ocr
            candle_exists=xberg-candle-ocr
            libheif_exists=xberg-libheif
            gliner_exists=xberg-gliner
            libwpd_exists=xberg-libwpd
            native_pdf_exists=xberg-native-pdf
            pdfium_exists=xberg-pdfium-render
            cli_exists=xberg-cli

  check-hex:
    name: Check Hex.pm for existing versions
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      elixir_exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: hex
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-pub:
    name: Check pub.dev for existing version
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_dart == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pub
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-zig:
    name: Check Zig package presence
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && ((needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_zig == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          assets: xberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz

  check-homebrew:
    name: Check Homebrew tap for formula
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_homebrew == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: homebrew
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          tap-repo: xberg-io/homebrew-tap

  check-cli:
    name: Check GitHub Release for CLI assets
    needs: prepare
    # Run in dry-run too (mirrors the zig check gate) so a `dry_run` dispatch does
    # not skip check-cli — otherwise every CLI build job (which `needs` this) would
    # cascade-skip, and the CLI lane (incl. the static binstall Docker build) could
    # never be exercised without cutting a real tag.
    if: >-
      ${{ !inputs.plugins-only && ((needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_cli == 'true') }}
    runs-on: ubuntu-latest
    # `prepare` creates the release as a draft, and `GET /releases/tags/<tag>` only returns a
    # draft to a token with push access. Without `contents: write` every re-run of a failed
    # release would read "no assets", rebuild all seven CLI legs, and clobber the hashes of
    # archives that are already there; with it, the ten-name check below sees the draft and
    # rebuilds only what is actually missing. ~keep
    permissions:
      contents: write
    # `exists` gates the CLI builds, so it also covers the PyPI xberg-cli wheels built from
    # them: with only the release assets checked, a re-run after a failed PyPI upload skipped
    # the builds and the proxy publish alike. The npm proxy downloads the binaries at install
    # time, so it is checked separately and needs no rebuild. ~keep
    outputs:
      exists: ${{ steps.check.outputs.exists == 'true' && steps.pypi.outputs.exists == 'true' }}
      assets_exist: ${{ steps.check.outputs.exists }}
      npm_exists: ${{ steps.npm.outputs.exists }}
      pypi_exists: ${{ steps.pypi.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: xberg-cli-
          # The ten-name list from `prepare`: a re-run must rebuild a CLI leg whose archive
          # is absent rather than accept a partial set (v1.4.2 kept its seven pre-no-GPL
          # names and skipped the rebuild). ~keep
          assets: ${{ needs.prepare.outputs.cli_assets }}

      - id: npm
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/xberg-cli"
          version: ${{ needs.prepare.outputs.version }}

      - id: pypi
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pypi
          package: xberg-cli
          version: ${{ needs.prepare.outputs.version }}
          required-files: |
            *-macosx_*_arm64.whl
            *-macosx_*_x86_64.whl
            *-manylinux_*_aarch64.whl
            *-manylinux_*_x86_64.whl
            *-musllinux_*_aarch64.whl
            *-musllinux_*_x86_64.whl
            *-win_amd64.whl
            *.tar.gz

  check-swift:
    name: Check GitHub Release for the Swift artifact bundle
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.release_swift == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        if: needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          assets: Xberg-rs.artifactbundle.zip

  check-go:
    name: Check GitHub Release for Go FFI assets
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && ((needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_go == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          assets: >-
            xberg-go-v${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-macos-x86_64.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-macos-x86_64.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-windows-x86_64.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-windows-x86_64.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-linux-x86_64-musl.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-linux-x86_64-musl.tar.gz.sha256,xberg-go-v${{ needs.prepare.outputs.version }}-linux-aarch64-musl.tar.gz,xberg-go-v${{ needs.prepare.outputs.version }}-linux-aarch64-musl.tar.gz.sha256

  check-c-ffi:
    name: Check GitHub Release for C FFI assets
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_c_ffi == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          # One archive per c-ffi-libraries matrix platform; a prefix match alone took a
          # single archive as the whole set. ~keep
          assets: >-
            xberg-ffi-linux-x86_64.tar.gz,xberg-ffi-linux-aarch64.tar.gz,xberg-ffi-macos-arm64.tar.gz,xberg-ffi-windows-x86_64.tar.gz

  check-elixir-release:
    name: Check GitHub Release for Elixir NIF assets
    needs: prepare
    if: >-
      ${{ !inputs.plugins-only && (needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          assets: ${{ needs.prepare.outputs.elixir_assets }}

  python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: [prepare, check-pypi]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_python == 'true' &&
          (needs.prepare.outputs.dry_run == 'true' ||
           (needs.prepare.outputs.is_tag == 'true' && needs.check-pypi.result == 'success' &&
            (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ~keep Runtime staging requires the reviewed Visual Studio 2022 redistributable.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-2022, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # pyke's default download strategy links a Windows ORT build that always
      # imports DirectML.dll (ort-sys's static_link_prerequisites is
      # unconditional on windows targets), which this repo never ships and
      # which no arm of ort_discovery.rs ever selects -- so `import xberg`
      # fails on a clean Windows host before any Rust code runs
      # (xberg-io/xberg#1456). This step forces ORT_STRATEGY=system (the same
      # strategy every other Windows leg in this workflow already uses),
      # which hits an early return in ort-sys before static_link_prerequisites
      # runs, so the DirectML import is never introduced in the first place.
      - name: Setup ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-py

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@v1
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp311-*"
          upload-artifact: "false"
          build-libheif: "true"
          manylinux-x86_64-image: "manylinux_2_28"
          manylinux-aarch64-image: "manylinux_2_28"
          cibw-before-build-linux: |
            set -euo pipefail
            if [ "$(uname -m)" = aarch64 ]; then
              if [ "${CARGO_PROFILE_RELEASE_LTO:-}" != thin ]; then
                echo "ARM64 manylinux build requires CARGO_PROFILE_RELEASE_LTO=thin" >&2
                exit 1
              fi
              printf 'ARM64 manylinux Cargo release LTO: %s\n' "$CARGO_PROFILE_RELEASE_LTO"
            fi
            pip install maturin uv
            source ~/.cargo/env
            # Prevent GCC 14+ from emitting C23-versioned glibc symbols (__isoc23_strtoll etc.)
            # that require glibc ≥ 2.38. Fixes #588: ensures wheels work on Debian 12 (glibc 2.36),
            # Ubuntu 22.04 LTS (2.35), and RHEL 8 (2.28).
            export CFLAGS="-std=gnu11"
            export CXXFLAGS="-std=gnu++17"
            export CPPFLAGS="-std=gnu11"
            export CMAKE_C_FLAGS="${CFLAGS}"
            export CMAKE_CXX_FLAGS="${CXXFLAGS}"
            export CC="gcc ${CFLAGS}"
            export CXX="g++ ${CXXFLAGS}"
            # Link Microsoft's glibc-clean ONNX Runtime, not the pyke prebuilt; auditwheel bundles it (#1284).
            ort_version=1.24.2
            case "$(uname -m)" in aarch64 | arm64) ort_arch=aarch64 ;; *) ort_arch=x64 ;; esac
            ort_integrity="{project}/scripts/ci/actions/setup-onnx-runtime"
            ort_tmp=$(mktemp -d)
            ort_archive="$ort_tmp/onnxruntime-linux-${ort_arch}-${ort_version}.tgz"
            trap 'rm -f -- "$ort_archive"; rmdir -- "$ort_tmp"' EXIT
            bash "$ort_integrity/verify-archive.sh" "$ort_archive" "$ort_integrity/checksums.sha256" --known
            set -- --retry 5 --retry-delay 5
            if curl --retry-all-errors --version >/dev/null 2>&1; then
              set -- "$@" --retry-all-errors
            fi
            if curl --proto '=https' --proto-redir '=https' "$@" -fsSL -o "$ort_archive" \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ort_version}/${ort_archive##*/}"; then
              bash "$ort_integrity/verify-archive.sh" "$ort_archive" "$ort_integrity/checksums.sha256"
              mkdir -p /opt/msort
              tar -xzf "$ort_archive" -C /opt/msort --strip-components=1
            else
              case "$ort_arch" in aarch64) ort_rid=linux-arm64 ;; *) ort_rid=linux-x64 ;; esac
              RUNNER_TEMP="$ort_tmp" bash "$ort_integrity/nuget-fallback.sh" "$ort_version" "$ort_rid" /opt/msort "$ort_integrity/checksums.sha256"
            fi
          cibw-environment: >-
            MATURIN_BUILD_ARGS="--compatibility manylinux_2_28"
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc
            CC_x86_64_unknown_linux_gnu=gcc CC_aarch64_unknown_linux_gnu=gcc CXX_x86_64_unknown_linux_gnu=g++ CXX_aarch64_unknown_linux_gnu=g++
            ORT_STRATEGY=system ORT_LIB_LOCATION=/opt/msort/lib ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1 LD_LIBRARY_PATH=/opt/msort/lib
            ${{ matrix.os == 'ubuntu-24.04-arm' && 'CARGO_PROFILE_RELEASE_LTO=thin' || '' }}
          # The deployment target is the wheel's macOS floor, 15.0: the oldest macOS Apple
          # still supports. delocate bundles the libheif closure, so the hook builds it
          # from source at the target and PKG_CONFIG_PATH links the wheel against it
          # instead of Homebrew's runner-OS bottles (#1243). ~keep
          cibw-before-build-macos: bash {project}/scripts/ci/build-macos-heif-deps.sh
          cibw-environment-macos: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true MACOSX_DEPLOYMENT_TARGET=15.0 PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig'
          cibw-before-build-windows: "rustup install 1.100.0-x86_64-pc-windows-msvc --profile minimal --component rust-src --component rustfmt --component clippy && rustup target add x86_64-pc-windows-msvc --toolchain 1.100.0-x86_64-pc-windows-msvc && pip install maturin uv && set PATH=%USERPROFILE%\\.cargo\\bin;%PATH%"
          cibw-environment-windows: 'MATURIN_BUILD_ARGS="--target x86_64-pc-windows-msvc" RUSTUP_TOOLCHAIN="1.100.0-x86_64-pc-windows-msvc" RUSTC_WRAPPER='

      - name: Vendor ONNX Runtime into wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # auditwheel's default repair only bundles libs it can resolve via ldd
          # at repair time; it has been observed to drop libonnxruntime.so here
          # (#1284 follow-up). Vendor explicitly, same as every other native
          # target in this workflow, instead of depending on auditwheel alone.
          for w in wheelhouse/*.whl; do bash scripts/ci/vendor-native-closure.sh "$w"; done

      - name: Test Windows wheel closure contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: mise run python:wheel:closure:test

      - name: Vendor ONNX Runtime into wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # System-strategy dynamic linking (switched above) no longer bakes ORT
          # into the .pyd the way the pyke static-link strategy did, so it must
          # be vendored explicitly -- same rationale as the Linux step above.
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\vendor-windows-wheel-closure.ps1" -Wheel $_.FullName -DllSourceDir "$env:ORT_LIB_LOCATION" -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "vendor-windows-wheel-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel-local PE dependency closure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact $_.FullName -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel glibc floor + bundled ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/verify-glibc-floor.sh "$w" "$GLIBC_FLOOR"; done

      # The checks above only prove a file exists (or, for Linux/Windows,
      # inspect symbols/imports statically) -- none of them ever import or
      # run the wheel. This installs it into a real venv on this same runner
      # (matching glibc/macOS/Windows -- the family it was actually built
      # for, unlike the musl leg which needs a separate Alpine container) and
      # runs a real extraction against a known fixture, asserting the exact
      # expected text comes back. See scripts/ci/smoke_test_python_wheel.py
      # for why import-only is not enough. No continue-on-error: a broken
      # wheel must fail this job, not merely warn.
      - name: Smoke-test wheel (real extraction, not just import)
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find wheelhouse -name '*.whl' | head -n1)"
          python="python3"
          venv_python="smoke-venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python="python"
            venv_python="smoke-venv/Scripts/python.exe"
          fi
          "$python" -m venv smoke-venv
          "$venv_python" -m pip install --no-cache-dir --quiet "$wheel"
          "$venv_python" scripts/ci/smoke_test_python_wheel.py \
            scripts/ci/fixtures/musl-python-smoke.pdf "XBERG MUSL SMOKE 490"

      # The wheel bundles the libheif/libde265/libaom closure and links libwpd; PEP 639 puts
      # license files under .dist-info/licenses, which is also where the shared verifier
      # expects them. `inject` rewrites METADATA, RECORD and the notice files; the shared
      # verify-package-contents action then re-reads the final bytes. ~keep
      - name: Inject canonical notices (wheel)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(wheelhouse/*.whl)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::expected exactly one wheel in wheelhouse, found ${#archives[@]}"; exit 1;
          }
          python="${{ runner.os == 'Windows' && 'python' || 'python3' }}"
          "$python" scripts/ci/package-notices.py inject --format wheel --expected-count 1 "${archives[@]}"

      # The shared verifier runs `python3`; Windows only guarantees `python` on PATH.
      - name: Expose python3 for the shared verifier (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python3-shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/python3-shim/python3"
          chmod +x "$RUNNER_TEMP/python3-shim/python3"
          echo "$RUNNER_TEMP/python3-shim" >> "$GITHUB_PATH"

      - name: Verify wheel notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: wheelhouse
          artifact-format: wheel
          expected-artifact-count: "1"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  python-wheels-musl:
    name: Build Python wheels (musl-${{ matrix.arch }})
    needs: [prepare, check-pypi]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_python == 'true' &&
          (needs.prepare.outputs.dry_run == 'true' ||
           (needs.prepare.outputs.is_tag == 'true' && needs.check-pypi.result == 'success' &&
            (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      # The v1.4.0 aarch64 leg died with exit 143 ("runner received a shutdown signal") after
      # 1h38m in the fat-LTO compile, where v1.3.9 finished in 55 min. Thin LTO bounds the
      # single-module memory peak, like the other ARM64 legs; x86_64 keeps fat LTO. ~keep
      - name: Build Python wheel via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-python \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --build-arg TARGET=${{ matrix.target }} \
            --build-arg CARGO_PROFILE_RELEASE_LTO=${{ matrix.arch == 'aarch64' && 'thin' || 'fat' }} \
            --output type=local,dest=./build-output .

      - name: Verify musl wheel produced
        run: |
          test -n "$(find build-output -name '*.whl')" || {
            echo "::error::no wheel produced by musl build for ${{ matrix.target }}"; exit 1; }

      # Closes xberg-io/xberg#490: the wheel-existence check above only proves a
      # file was produced, never that it installs and extracts correctly on the
      # musl libc family it was cross-compiled for. This installs it into a real
      # Alpine container and runs an actual extraction against a known fixture,
      # asserting the exact expected text comes back. No continue-on-error: a
      # broken wheel must fail this job, not merely warn.
      - name: Smoke-test musl wheel (real extraction, not just import)
        run: |
          wheel="$(find build-output -name '*.whl' | head -n1)"
          bash scripts/ci/smoke-test-musl-python-wheel.sh "$wheel"

      - name: Inject canonical notices (wheel)
        run: |
          set -euo pipefail
          # The local buildx exporter writes build-output as root; the injection rewrites the
          # wheel in place, so hand the tree to the runner first.
          sudo chown -R "$(id -u):$(id -g)" build-output
          shopt -s nullglob
          archives=(build-output/*.whl)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::expected exactly one musl wheel, found ${#archives[@]}"; exit 1;
          }
          python3 scripts/ci/package-notices.py inject --format wheel --expected-count 1 "${archives[@]}"

      - name: Verify musl wheel notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: build-output
          artifact-format: wheel
          expected-artifact-count: "1"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-musl-${{ matrix.arch }}
          path: build-output/*.whl
          if-no-files-found: error
          retention-days: 14

  python-sdist:
    name: Build Python sdist
    needs: [prepare, check-pypi, publish-crates]
    # Skipped on dry runs. The sdist is built out of the workspace with internal `path = "..."` keys
    # stripped, so `cargo generate-lockfile` must resolve `xberg = "^<version>"` from crates.io. A dry
    # run's `publish-crates` succeeds without actually publishing, so that version is never on the
    # registry and resolution fails by construction — the job can only ever be red here, whatever the
    # code does. (`is_tag` is NOT the right predicate: dry runs synthesize a tag and set it true.)
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python
          config-ref: ${{ github.sha }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-python-sdist@v1
        with:
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Inject canonical notices (sdist)
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::expected exactly one sdist, found ${#archives[@]}"; exit 1;
          }
          python3 scripts/ci/package-notices.py inject --format sdist --expected-count 1 "${archives[@]}"

      - name: Verify sdist notice bytes
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python-sdist
          artifact-path: dist
          artifact-format: sdist
          expected-artifact-count: "1"
          required-notice-files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          canonical-root: .
          strict: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

  node-bindings:
    name: Build Node bindings (${{ matrix.target }})
    needs: [prepare, check-npm]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_node == 'true' &&
          (needs.prepare.outputs.dry_run == 'true' || (needs.prepare.outputs.is_tag == 'true' && needs.check-npm.result == 'success' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, target: aarch64-apple-darwin }
          # x86_64-apple-darwin (Intel macOS) intentionally omitted: pyke ships
          # no static ORT for it and Microsoft's last dylib is 1.23.2. Kept in
          # sync with alef's [crates.node].exclude_platforms=["darwin-x64"]. ~keep
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}
      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      # Build the libheif closure from source at the macOS floor (#1243) and
      # make the .node link it instead of Homebrew's runner-OS bottles. ~keep
      - name: Build libheif stack for the macOS floor
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=15.0
          bash scripts/ci/build-macos-heif-deps.sh
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            echo "PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Build NAPI binding
        uses: xberg-io/actions/build-node-napi@v1
        with:
          crate-dir: crates/xberg-node
          target: ${{ matrix.target }}
          use-napi-cross: "false"
          pack-target-tarball: node-bindings-${{ matrix.target }}.tar.gz

      - name: Ship the alef-generated index.d.ts, not napi's regenerated one
        shell: bash
        run: |
          set -euo pipefail
          # `napi build` (run inside build-node-napi) regenerates
          # crates/xberg-node/index.d.ts from the Rust napi idents, reintroducing
          # dangling `Js*` type references that TypeScript resolves to `any`
          # (#1351). The committed file is alef-generated and correct, so restore
          # it and repack the per-target tarball so the clean declaration file is
          # what ships. On macOS the vendor step below repacks again with the
          # dylib closure, reusing this restored file; on the other targets this
          # repack produces the final tarball (build-node-napi does not repack).
          git checkout HEAD -- crates/xberg-node/index.d.ts
          notice_roots=()
          for platform_dir in crates/xberg-node/npm/*/; do
            ls "$platform_dir"*.node >/dev/null 2>&1 || continue
            python3 scripts/ci/package-notices.py stage "$platform_dir"
            notice_roots+=("npm/$(basename "$platform_dir")")
          done
          [ "${#notice_roots[@]}" -gt 0 ] || { echo "::error::no populated NAPI platform packages"; exit 1; }
          members=(npm)
          [ -f crates/xberg-node/index.js ] && members+=(index.js)
          [ -f crates/xberg-node/index.d.ts ] && members+=(index.d.ts)
          tar -czf "node-bindings-${{ matrix.target }}.tar.gz" -C crates/xberg-node "${members[@]}"
          python3 scripts/ci/package-notices.py verify "node-bindings-${{ matrix.target }}.tar.gz" "${notice_roots[@]}"

      - name: Vendor macOS dylib closure (libheif + codecs) into the .node package
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          # build-node-napi staged the .node (+ @rpath-relocatable ONNX Runtime)
          # into crates/xberg-node/npm/<platform>/ and packed the tarball. The
          # libheif closure is still absolute paths in the .node, so vendor it
          # beside the .node (@loader_path) and repack.
          node_file="$(find crates/xberg-node/npm -maxdepth 2 -name '*.node' -type f | head -1)"
          [ -n "$node_file" ] || { echo "::error::no .node staged under crates/xberg-node/npm"; exit 1; }
          platform_dir="$(dirname "$node_file")"
          python3 scripts/ci/package-notices.py stage "$platform_dir"
          bash scripts/ci/vendor-macos-node-dylibs.sh "$platform_dir"
          # Reconcile the platform package.json `files` with every binary now on
          # disk so npm pack ships the whole closure.
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.argv[1];
            const p = path.join(dir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            const ship = /\.(node|dylib|dll)$|\.so(\.[0-9]+)*$/;
            const onDisk = fs.readdirSync(dir).filter((f) => ship.test(f));
            pkg.files = [...new Set([...(pkg.files || []), ...onDisk])].sort();
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("reconciled files:", JSON.stringify(pkg.files));
          ' "$platform_dir"
          # Repack the per-target tarball with the same layout build-node-napi
          # uses (npm/ tree + root index.js/index.d.ts), overwriting the
          # pre-vendor one.
          members=(npm)
          [ -f crates/xberg-node/index.js ] && members+=(index.js)
          [ -f crates/xberg-node/index.d.ts ] && members+=(index.d.ts)
          tar -czf "node-bindings-${{ matrix.target }}.tar.gz" -C crates/xberg-node "${members[@]}"
          python3 scripts/ci/package-notices.py verify "node-bindings-${{ matrix.target }}.tar.gz" "npm/$(basename "$platform_dir")"

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          retention-days: 14

  node-bindings-musl:
    name: Build Node bindings (linux-musl-${{ matrix.arch }})
    needs: [prepare, check-npm]
    if: >-
      ${{ !inputs.plugins-only && (!cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.release_node == 'true' &&
          (needs.prepare.outputs.dry_run == 'true' || (needs.prepare.outputs.is_tag == 'true' && needs.check-npm.result == 'success' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true')))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, napi_arch: x64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, napi_arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      # `.dockerignore` excludes `**/.git/`, so build.rs cannot derive XBERG_BUILD_ID inside the
      # container and falls back to `""`, collapsing every artifact built at one crate version into
      # a single OCR cache key space (#1845). Asserted non-empty here because an empty
      # `--build-arg` is indistinguishable from the bug it fixes.
      - name: Resolve build id
        id: build_id
        run: |
          set -euo pipefail
          id=$(git rev-parse HEAD)
          [ -n "$id" ] || { echo "::error::git rev-parse HEAD produced an empty build id"; exit 1; }
          echo "value=$id" >> "$GITHUB_OUTPUT"

      - name: Build Node NAPI binding via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-node \
            --build-arg XBERG_BUILD_ID=${{ steps.build_id.outputs.value }} \
            --build-arg TARGET=${{ matrix.target }} \
            --build-arg CARGO_PROFILE_RELEASE_LTO=${{ matrix.arch == 'aarch64' && 'thin' || 'fat' }} \
            --output type=local,dest=./build-output .
      - name: Stage .node into napi platform dir for npm
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          mkdir -p "staging/npm/${platform}"
          find build-output -name "*.node" -exec cp {} "staging/npm/${platform}/" \;
          test -n "$(find "staging/npm/${platform}" -name '*.node')" || {
            echo "::error::no .node produced by musl build for ${platform}"; exit 1; }
          # Ship the .node's vendored shared-lib closure (libonnxruntime + codecs)
          # beside it — the .node's RUNPATH is $ORIGIN, so co-located libs resolve
          # at require() time. Without them consumers hit ERR_DLOPEN_FAILED.
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          if ls build-output/*.so* >/dev/null 2>&1; then
            cp -v build-output/*.so* "staging/npm/${platform}/"
          else
            echo "::error::no vendored shared libs produced by musl build for ${platform}"; exit 1
          fi
          cp "crates/xberg-node/npm/${platform}/package.json" "staging/npm/${platform}/package.json"
          python3 scripts/ci/package-notices.py stage "staging/npm/${platform}"
          # Reconcile `files` with the binaries on disk — napi create-npm-dirs
          # regenerates the committed package.json to list only *.node, so the
          # vendored libs must be re-added here or npm publish drops them.
          python3 -c '
          import json, os, re, sys
          d = sys.argv[1]; p = os.path.join(d, "package.json")
          pkg = json.load(open(p))
          ship = re.compile(r"\.(node|dylib|dll)$|\.so(\.[0-9]+)*$")
          on_disk = sorted(f for f in os.listdir(d) if ship.search(f))
          pkg["files"] = sorted(set(pkg.get("files", [])) | set(on_disk))
          with open(p, "w") as fh:
              json.dump(pkg, fh, indent=2); fh.write("\n")
          print("reconciled files:", pkg["files"])
          ' "staging/npm/${platform}"
          tar -czf node-bindings-${{ matrix.target }}.tar.gz -C staging npm
          python3 scripts/ci/package-notices.py verify "node-bindings-${{ matrix.target }}.tar.gz" "npm/${platform}"

      - name: Check out Node smoke launcher from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/ci/smoke-test-musl-node-binding.sh
          sparse-checkout-cone-mode: false

      # The steps above only prove a .node file (and its vendored shared-lib
      # closure) exist on disk -- never that require()ing it actually works.
      # This installs it into a real Alpine (musl libc) container and runs a
      # real extraction against a known fixture, asserting the exact expected
      # text comes back. See scripts/ci/smoke_test_node_binding.js for what
      # this catches and why a require()-only check is not enough. No
      # continue-on-error: a broken binding must fail this job, not merely
      # warn.
      - name: Smoke-test musl Node binding (real extraction, not just require)
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          bash .release-tools/scripts/ci/smoke-test-musl-node-binding.sh "staging/npm/${platform}" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

