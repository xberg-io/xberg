name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
concurrency:
  group: ai-rulez-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: xberg-io/actions/.github/workflows/reusable-ai-rulez-validation.yml@v1
    with:
      mise-install-args: python
      expected-config-count: "2"
      additional-config-directories: "plugin/.ai-rulez"
      verify-plugin: true
      version-sync-script: "scripts/sync_integration_versions.py"
      public-skills-check-script: "scripts/sync_public_skills.py"
      budgets: |
        claude=5950
        codex=6950
