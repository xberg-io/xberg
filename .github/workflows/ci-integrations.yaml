name: CI Integrations

on:
  push:
    branches: [main]
    paths:
      - "vendored/**"
      - "integrations/**"
      - "crates/xberg/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-py/**"
      - "crates/xberg-node/**"
      - "crates/xberg-ffi/**"
      - "packages/python/**"
      - "packages/java/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise-tasks/**"
      - ".cargo/config.toml"
      - ".github/actions/install-system-deps/**"
      - ".github/actions/setup-onnx-runtime/**"
      - "scripts/ci/install-system-deps/**"
      - "scripts/ci/actions/setup-onnx-runtime/**"
      - ".github/workflows/ci-integrations.yaml"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
  workflow_dispatch:

concurrency:
  group: ci-integrations-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: full
  RUST_MIN_STACK: 16777216
  ORT_VERSION: "1.24.2"
  BUILD_PROFILE: "ci"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TESSDATA_PREFIX: "/usr/share/tesseract-ocr/5/tessdata"

permissions:
  contents: read

jobs:
  build-bindings:
    name: Build local integration bindings
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository == 'xberg-io/xberg' && github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
      MISE_PYTHON_VERSION: "3.11.18"
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: ci-integrations-bindings
          use-sccache: "true"

      - name: Install Python, uv, Node, pnpm, Java and Maven
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv node pnpm java maven
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}
          strategy: system

      - name: Setup native library paths
        run: mise run integrations:ci:configure-native-paths

      - name: Build abi3 Python wheel
        run: mise run integrations:ci:build:python-binding

      - name: Install pnpm workspace dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Add pnpm bin to PATH
        shell: bash
        run: pnpm bin >> "$GITHUB_PATH"

      - name: Build Node package
        run: mise run integrations:ci:build:node-binding

      - name: Build and stage Java binding
        run: mise run integrations:ci:build:java-binding

      - name: Upload Python binding
        uses: actions/upload-artifact@v7
        with:
          name: xberg-python-linux-x64
          path: dist/python/*.whl
          retention-days: 7
          if-no-files-found: error

      - name: Upload Node binding
        uses: actions/upload-artifact@v7
        with:
          name: xberg-node-linux-x64
          path: dist/node/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Java binding
        uses: actions/upload-artifact@v7
        with:
          name: xberg-java-linux-x64
          path: |
            dist/m2/io/xberg/xberg/
            dist/java/
          retention-days: 7
          if-no-files-found: error

  python:
    name: Python (py${{ matrix.python }})
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository == 'xberg-io/xberg' && github.event.pull_request.draft != true) }}
    needs: [build-bindings]
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
      MISE_PYTHON_VERSION: ${{ matrix.python }}
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10.22"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      - name: Resolve the mise Python version
        id: mise-python
        shell: bash
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ steps.mise-python.outputs.version }}-

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}
          strategy: system

      - name: Setup native library paths
        run: mise run integrations:ci:configure-native-paths

      - name: Download local Python binding
        uses: actions/download-artifact@v8
        with:
          name: xberg-python-linux-x64
          path: local-xberg

      - name: Test integrations against local Xberg wheel
        run: >
          mise run integrations:ci:test:python-all
          --wheel-dir "${GITHUB_WORKSPACE}/local-xberg"

  node:
    name: Node
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository == 'xberg-io/xberg' && github.event.pull_request.draft != true) }}
    needs: [build-bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}
          strategy: system

      - name: Setup native library paths
        run: mise run integrations:ci:configure-native-paths

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('integrations/node/*/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Download local Node binding
        uses: actions/download-artifact@v8
        with:
          name: xberg-node-linux-x64
          path: local-xberg

      - name: Test integrations against local Node binding
        run: >
          mise run integrations:ci:test:node-all
          --binding-dir "${GITHUB_WORKSPACE}/local-xberg"

  java:
    name: Java (spring-ai)
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.repository == 'xberg-io/xberg' && github.event.pull_request.draft != true) }}
    needs: [build-bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install Java and Maven
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: java maven

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}
          strategy: system

      - name: Setup native library paths
        run: mise run integrations:ci:configure-native-paths

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Download local Java binding
        uses: actions/download-artifact@v8
        with:
          name: xberg-java-linux-x64
          path: local-xberg

      - name: Test spring-ai against the local Maven repository
        run: >
          mise run integrations:ci:test:java
          --binding-dir "${GITHUB_WORKSPACE}/local-xberg"
