

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "unmaintained only; paste 1.0.15 is a proc-macro dependency with no maintained drop-in replacement" },
  { id = "RUSTSEC-2026-0543", reason = "unmaintained only, no safe upgrade; chrono arrives through nom-exif and hf-hub (hf-xet, xet-*), with no maintained drop-in replacement yet" },
  { id = "RUSTSEC-2026-0542", reason = "unmaintained only, wraps chrono; arrives transitively through xet-data" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "bzip2-1.0.6",
  "BSL-1.0",
  "OpenSSL",
  "NCSA",
  "MIT-0",
]
confidence-threshold = 0.8

# Every entry here is asserted matched: `mise run rust:check:licenses` fails when no checked
# graph encounters one, so a renamed or removed dependency cannot leave a stale acceptance
# behind. The benchmark-only `inferno` (CDDL-1.0, tools/benchmark-harness `profiling`) and
# `intel-mkl-src` (an unrecognized Intel license file, only reachable through `candle-mkl`)
# deliberately have none: the check is rooted at each shipped manifest, neither crate is in
# those graphs, and accepting either would hide it from every shipped graph too. Crates whose
# manifest omits `license` are held to an explicit list in that script instead of passing on a
# cargo-deny warning.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cbindgen" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # colored is pulled transitively by hf-xet (hf-hub 1.0's Xet transfer backend).
  # MPL-2.0 is file-level weak copyleft; merely linking it imposes no obligation
  # on xberg. Unavoidable while on hf-hub 1.0. ~keep
  { allow = ["MPL-2.0"], crate = "colored" },
  { allow = ["MPL-2.0"], crate = "symphonia" },
  { allow = ["MPL-2.0"], crate = "symphonia-core" },
  { allow = ["MPL-2.0"], crate = "symphonia-common" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-mkv" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
  { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-adpcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
]

#[[licenses.clarify]]
#{ path = "LICENSE", hash = 0xbd0eed23 }

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

#[[bans.features]]

skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
