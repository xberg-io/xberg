[scan]
include = [
  ".github/workflows/**/*.yml",
  ".github/workflows/**/*.yaml",
  ".github/actions/**/action.yml",
  ".github/actions/**/action.yaml",
  "action.yml",
  "action.yaml",
]
exclude = []
recursive = false

[cache]
enabled = true
ttl = "6h"

[update]
mode = "latest-tag"
pin_style = "major"
# These actions publish full version tags without major aliases.
allow_full = ["ruby/setup-ruby", "rubygems/configure-rubygems-credentials", "sigstore/cosign-installer"]
include_prereleases = false
preserve_major = false
missing_ref = "warn"

[output]
format = "human"
color = "auto"

[github]
api_url = "https://api.github.com"

[performance]
