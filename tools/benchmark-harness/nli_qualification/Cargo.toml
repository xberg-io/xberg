[package]
name = "nli-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace]

[features]
runtime = ["xberg/classification-onnx", "dep:tokio", "dep:ort"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
xberg = { path = "../../../crates/xberg", default-features = false, features = ["classification-onnx-types"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-18"], optional = true }

[dev-dependencies]
tempfile = "3.27"

[patch.crates-io]
sysinfo = { path = "../../../vendored/sysinfo" }
