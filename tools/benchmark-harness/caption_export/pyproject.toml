[project]
name = "xberg-caption-export"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxruntime==1.28.0",
  "pytest==9.1.1",
  "tokenizers==0.23.3",
  "torch==2.14.1",
  "transformers==5.20.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
