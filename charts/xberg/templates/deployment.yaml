apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xberg.fullname" . }}
  labels:
    {{- include "xberg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "xberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "xberg.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "xberg.serviceAccountName" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.cache.enabled .Values.cache.initChown }}
      initContainers:
        - name: init-cache
          image: busybox:1.37-glibc
          command: ['sh', '-c', 'mkdir -p /app/.xberg && chown -R 1000:1000 /app/.xberg']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN"]
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /app/.xberg
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "xberg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.xberg.logLevel | quote }}
            - name: TESSDATA_PREFIX
              value: {{ .Values.xberg.tessdataPrefix | quote }}
            - name: XBERG_OCR_LANGUAGE
              value: {{ .Values.xberg.ocrLanguage | quote }}
            - name: XBERG_CACHE_DIR
              value: "/app/.xberg"
            - name: HF_HOME
              value: "/app/.xberg/huggingface"
            {{- with .Values.xberg.apiTokenSecret }}
            {{- if .name }}
            - name: XBERG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | default "token" | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.xberg.allowUnauthenticated }}
            - name: XBERG_ALLOW_UNAUTHENTICATED
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The cache directory is always mounted from a writable volume (PVC
            # when cache.enabled, ephemeral emptyDir otherwise) so HF_HOME and
            # XBERG_CACHE_DIR stay writable under a read-only root filesystem.
            - name: cache
              mountPath: /app/.xberg
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          {{- if .Values.cache.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "xberg.fullname" . }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
