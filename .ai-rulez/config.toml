
version = "5.0"
default_layers = ["plugins"]
name = 'Xberg'
description = 'Rust document intelligence library with active Python, TypeScript/Node, Ruby, PHP, Go, Java, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
# ~keep The manifest is committed so CI can detect stale generated files.
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode", "pi", "hermes", "gemini", "copilot"]
builtins = ["!agent-delegation", "!git-workflow", "default-commands"]

# No builtin exists for Dart, Swift, Zig, Kotlin Android or the raw C ABI. Those five are
# governed only by their specialist agents in agent-conventions/modules/languages/agents/
# plus the shared binding-architecture skill. Do not enable 'polyglot-bindings' to paper over
# it: it ships ffi-engineer + polyglot-architect agents that collide with the tuned copies in
# agent-conventions/modules/core/agents/. ~keep

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-infrastructure'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/infrastructure'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

ref = "8fd2cf190d7f1523e3aec8753a850d37e5acccc9"
[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'


[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[lock]
include_outputs = false

[lint]
allow_overrides = ["python-conventions"]

# The CLI reference documents the product's own install channels; pinning a version there would go stale every release. ~keep
[[lint.ignore_rules]]
rules = ["AR021"]
paths = ["**/references/cli-reference.md"]
reason = "Install instructions for this project's own CLI, which track the latest release by design."

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
