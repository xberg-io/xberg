
version = "5.0"
default_layers = ["plugins"]
name = 'Xberg'
description = 'Rust document intelligence library with active Python, TypeScript/Node, Ruby, PHP, Go, Java, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
# ~keep The manifest is committed so CI can detect stale generated files.
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode"]
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "!testing/tdd-workflow",
  "!token-efficiency/output-awareness",
  "!token-efficiency/task-runner",
  "!ai-governance/explain-reasoning",
  "!security/least-privilege",
  "!security/input-validation",
  "!polyglot-bindings/rust-polyglot-conventions",
  "default-commands",
  "polyglot-bindings",
]

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-infrastructure'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/infrastructure'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-bindings'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/bindings'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-document-corpora'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/document-corpora'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-docs-sites'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/docs-sites'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'
ref = "fc96f3c0ca138d0667144a0ae7e37b5ef04b420c"

[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'


[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[lock]
include_outputs = false

[lint]
# ~keep The local feature-flag-conventions skill carries the languages module's shared flag contract verbatim plus the
# Xberg feature sets, so one skill is listed instead of two. Re-copy the shared part when that module changes it.
allow_overrides = ["feature-flag-conventions"]
# ~keep Generated plugin bundle copies, checked through plugin/.ai-rulez and verify --plugin. Codex never lists them,
# but AR964 counts every tracked SKILL.md copy toward its skill listing.
ignore_paths = [
  "plugin/.cursor-plugin/**",
  "plugin/.hermes/**",
  "plugin/.opencode/**",
  "plugin/.pi/**",
  "plugin/skills/**",
]

[lint.load_budgets]
# ~keep AR964's 8000-char Codex skill-listing figure is unverified; the counted listing after folding the fallback
# skills (11650 on 5.9.2), plus about 12% to stay out of AR964's 10% info band. Trim skill descriptions to
# lower it; re-measure on every pin bump.
codex-skill-listing = 13000

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
# ~keep One path-gated skill per directory keeps the Codex skill listing short (AR964).
scoped_fallback_group = "directory"
