# Rust core tasks, included from mise.toml [task_config]. ~keep

["rust:check:tesseract-dynamic"]
description = "Verify OCR links host Tesseract without touching the vendor cache"
depends = ["os:require linux"]
run = "bash scripts/ci/rust/check-tesseract-dynamic.sh"

["rust:check:packages"]
description = "Package and verify every crates.io crate standalone with warnings denied, as cargo publish does"
run = "python3 scripts/ci/rust/verify-crate-packages.py"

["rust:check:libheif-runtime"]
description = "Verify real v1_19 Rust decoding against the selected system runtime"
depends = ["os:require linux"]
run = "bash scripts/ci/rust/check-libheif-runtime.sh"

["rust:build:dev"]
description = "Build all Rust crates in debug mode"
run = [{ task = "rust:build", args = ["dev"] }]

["rust:build:profiling"]
description = "Build all Rust crates with profiling features (for flamegraph generation)"
env = { ENABLE_PROFILING = "true" }
run = [
  "cargo build --locked --workspace --profile profiling --features full,profiling,api,mcp,otel --exclude xberg-php --exclude xberg-node --exclude xberg-wasm",
  "cargo build --locked --manifest-path tools/benchmark-harness/Cargo.toml --profile profiling --features profiling",
]

["rust:bench"]
description = "Run one criterion benchmark of a crate"
usage = """
arg "<bench>" help="Benchmark target name (the [[bench]] name)"
flag "-p --package <package>" default="xberg-native-pdf" help="The crate that owns the benchmark"
flag "--features <features>" help="Comma-separated features the benchmark requires"
arg "[filter...]" help="Criterion benchmark ID filter, e.g. extract_text/type0_cjk"
"""
run = 'cargo bench --locked -p "$usage_package" --bench "$usage_bench" ${usage_features:+--features "$usage_features"} ${usage_filter:+-- $usage_filter}'

["rust:cli:build"]
description = "Build CLI binary"
usage = 'flag "--target <triple>" env="TARGET" help="Cross-compile for this target triple"'
run = 'cargo build --locked --release --package xberg-cli ${usage_target:+--target "$usage_target"}'

# The workspace `[profile.release]` targets native throughput (`opt-level = 3`); on wasm32 that
# costs ~12 MB of `code` section and pushes the bundle over jsDelivr's 50 MiB per-file cap.
# Mirrors the same override in .github/workflows/publish.yaml's build-wasm-package step so a local
# build measures the artifact publish actually ships. ~keep
["rust:wasm:build:all"]
description = "Build all WASM targets (web/bundler/nodejs/deno) plus the TypeScript wrapper"
dir = "{{config_root}}/crates/xberg-wasm"
env = { CARGO_PROFILE_RELEASE_OPT_LEVEL = "z" }
run = "pnpm run build:all"

["rust:test"]
description = "Run all Rust tests"
depends = ["os:require linux darwin"]
run = "bash scripts/ci/rust/run-unit-tests.sh"

["rust:test:ci"]
description = "Run Rust tests in CI mode with tessdata setup"
depends = ["os:require linux darwin"]
env = { CARGO_TERM_COLOR = "always" }
run = 'RUST_BACKTRACE="${RUST_BACKTRACE:-1}" bash scripts/ci/rust/run-unit-tests.sh'

["rust:test:focused-pr"]
description = "Run the exact PDF, OCR, office page or API jobs checks used on pull requests"
depends = ["os:require linux darwin"]
usage = 'arg "<suite>" help="Fixed suite: pdf-ocr, pdf-sparse-paddle, office-pages, api-jobs or pdf-table-paint"'
run = 'bash scripts/ci/rust/run-focused-pr-tests.sh "$usage_suite"'

["rust:test:ort-discovery"]
description = "Verify dynamic ONNX Runtime discovery through the Sceptre OCR and shared environment routes"
run = "bash scripts/ci/rust/run-ort-discovery-tests.sh"

["rust:test:jpeg-recovery"]
description = "Qualify nine real OCR recovery controls with verified English"
depends = ["os:require linux darwin"]
usage = """
arg "<features>" help="Use the existing Rust test feature closure"
flag "--no-default-features" help="Disable default features for a narrow local closure"
"""
run = 'bash scripts/ci/rust/run-jpeg-recovery-tests.sh "$usage_features" "${usage_no_default_features:-false}"'

["rust:test:explicit-sideways"]
description = "Qualify explicit sideways OCR with pinned offline model artifacts"
depends = ["os:require linux darwin"]
usage = 'arg "<profile>" help="Use warm or paddle for the classifier controls (paddle adds Paddle OCR) or native for the classifier-free controls"'
run = 'bash scripts/ci/rust/run-explicit-sideways-tests.sh "$usage_profile"'

["rust:test:deferred-osd"]
description = "Qualify deferred native OSD on a warm retry engine"
depends = ["os:require linux darwin"]
run = "bash scripts/ci/rust/run-deferred-osd-test.sh"

["rust:test:khmer-native-retention"]
description = "Qualify native Khmer preservation with the direct English OCR backend"
depends = ["os:require linux darwin"]
run = "bash scripts/ci/rust/run-khmer-native-retention-test.sh"

["rust:test:mime"]
description = "Verify MIME declaration handling without tree-sitter"
depends = ["os:require linux darwin"]
run = "bash scripts/ci/rust/run-mime-tests.sh"

["rust:test:vlm-auto-gate"]
description = "Verify native VLM layout restoration without formula recognition"
depends = ["os:require linux darwin"]
run = "bash scripts/ci/rust/run-vlm-auto-gate-tests.sh"

["rust:lint:workspace"]
description = "Lint every workspace crate and target at its default features"
run = "cargo clippy --workspace --all-targets -- -D warnings"

["rust:lint:features"]
description = "Lint all targets of one crate with the given features"
usage = """
arg "<features>" help="Comma-separated features to enable"
flag "-p --package <package>" default="xberg" help="The crate to lint"
flag "--no-default-features" help="Disable the crate's default features"
"""
run = 'cargo clippy --locked -p "$usage_package" $([ "${usage_no_default_features:-false}" = true ] && echo --no-default-features) --features "$usage_features" --all-targets -- -D warnings'

["rust:lint:feature"]
description = "Lint the library with one standalone feature enabled"
usage = 'arg "<feature>" env="FEATURE" help="The single library feature to enable"'
run = 'cargo clippy --locked -p xberg --lib --no-default-features --features "$usage_feature" -- -D warnings'

["rust:lint:email"]
description = "Lint all targets with only the email feature enabled"
run = "cargo clippy --locked -p xberg --no-default-features --features email --all-targets -- -D warnings"
