# Per-binding build, format, lint, test, dependency and packaging tasks, included from mise.toml
# [task_config]. Rust core tasks are in rust.toml and e2e suites in e2e.toml. ~keep

# ---- Dependency refreshes (`deps` is the shared toolchains engine, `deps:local` xberg's) -------

# ---- Python ------------------------------------------------------------------------------------

["python:callback:smoke"]
description = "Build a Linux Python wheel and test OCR callback exception identity"
shell = "bash -c"
run = '''
set -euo pipefail
scratch=$(mktemp -d)
trap 'rm -rf -- "$scratch"' EXIT
venv="$scratch/venv"

UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --only-dev --no-install-project --no-install-workspace
(
  cd packages/python
  "$venv/bin/maturin" build --locked --compatibility linux --interpreter "$venv/bin/python" --out "$scratch/wheels"
)

set -- "$scratch"/wheels/*.whl
if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
  echo "Expected exactly one Python wheel in $scratch/wheels" >&2
  exit 1
fi

uv pip install --python "$venv/bin/python" --no-deps "$1"
HF_HUB_OFFLINE=1 "$venv/bin/python" -I - <<'PYTHON'
from importlib.machinery import ExtensionFileLoader
from pathlib import Path
import sys
import unittest

import xberg._xberg as native

if (
    not isinstance(native.__loader__, ExtensionFileLoader)
    or not Path(native.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
):
    raise SystemExit("OCR callback smoke requires the native extension from the new wheel")

expected = 3
suite = unittest.defaultTestLoader.discover("packages/python/tests", pattern="test_ocr_callback_exceptions.py")
count = suite.countTestCases()
if count != expected:
    raise SystemExit(f"Expected {expected} callback tests, collected {count}")

result = unittest.TextTestRunner(verbosity=2).run(suite)
if result.testsRun != expected or result.skipped or result.expectedFailures or not result.wasSuccessful():
    raise SystemExit("All callback tests must execute and pass without skips or expected failures")
PYTHON
'''

["python:wheel:closure:test"]
description = "Test wheel-local Windows PE dependency and runtime packaging contracts"
run = "python scripts/ci/test_windows_wheel_closure.py -v"

["python:wheel:clean-host:test"]
description = "Test fail-closed Windows container wheel qualification guards"
run = "python scripts/ci/test_windows_wheel_clean_host.py -v"

["python:wheel:clean-host"]
description = "Qualify a wheel in disposable Windows userspace without global VC runtime"
usage = '''
arg "<wheel-directory>" help="Directory containing exactly one Windows wheel"
arg "<source-sha>" help="Exact checked-out source SHA"
arg "<output-directory>" help="New path for qualification receipts"
'''
run = 'pwsh -NoProfile -File scripts/ci/qualify-windows-wheel-clean-host.ps1 -WheelDirectory "$usage_wheel_directory" -SourceSha "$usage_source_sha" -OutputDirectory "$usage_output_directory"'

["python:publish:archive:prepare"]
description = "Validate combined Python artifacts and prepare their public archive release"
run = "python3 scripts/ci/python_archive_publication.py prepare"

["python:publish:archive:wait"]
description = "Refresh the central Python index and wait for verified public artifacts"
run = "python3 scripts/ci/python_archive_publication.py wait"

["python:publish:archive:test"]
description = "Test Python archive publication and its bounded readiness gate"
run = "uv run --frozen --only-dev --with PyYAML==6.0.3 python -m pytest scripts/ci/test_python_archive_publication.py -v"

# ---- Go ----------------------------------------------------------------------------------------

["go:publish:package"]
description = "Package a versioned Go FFI release archive with static-link metadata"
usage = '''
arg "<target>" help="Rust target triple of the built FFI library"
arg "<version>" help="Release version the archive carries"
flag "--output-dir <dir>" env="OUTPUT_DIR" default="dist/go-ffi" help="Directory the archive is written to"
'''
run = 'bash scripts/ci/package-go-release.sh "$usage_target" "$usage_version" "$usage_output_dir"'

["go:publish:package:musl"]
description = "Build and package a versioned dynamic Go FFI archive for musl"
usage = '''
arg "<target>" help="Rust musl target triple"
arg "<platform>" help="Release platform name of the archive"
arg "<version>" help="Release version the archive carries"
flag "--output-dir <dir>" env="OUTPUT_DIR" default="dist/go-ffi" help="Directory the archive is written to"
'''
run = '''
bash scripts/ci/package-go-musl-release.sh "$usage_target" "$usage_platform" "$usage_version" "$usage_output_dir"
'''

# ---- PHP, WASM, Java, C# -----------------------------------------------------------------------

["wasm:build:all"]
description = "Alias for rust:wasm:build:all (build all WASM targets + TS wrapper)"
depends = ["rust:wasm:build:all"]

["java:build:release"]
description = "Build the Java binding via Maven (mvn package)"
dir = "{{config_root}}/packages/java"
run = "mvn -B -DskipTests package"

["csharp:build:release"]
description = "Build the C# binding in Release configuration"
dir = "{{config_root}}/packages/csharp/Xberg"
run = "dotnet build --configuration Release"

# ---- Dart --------------------------------------------------------------------------------------

["dart:format:context"]
description = "Resolve Dart package language versions before formatting generated output"
run = ["cd packages/dart && dart pub get", "cd e2e/dart && dart pub get --enforce-lockfile"]

["dart:setup"]
description = "Setup Dart binding (codegen + native lib build + post-processing via alef)"
run = "alef build --lang dart --release"
