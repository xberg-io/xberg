# Generated by scripts/toolchains.py sync from xberg-io/toolchains v1.12.2.
# Do not edit: change the set in xberg-io/toolchains, or list the task under task_overrides in
# toolchains.toml and define it in this repository.
# Task sets: alef-bindings, alef-version, bats-lib, deps-refresh, docs-site, docs-snippets, governance, governance-check, lint-format, plugin, rust

# Task set: alef-bindings
# alef language bindings: build and test.

["alef:build"]
description = "Build all language bindings"
run = "alef build"

["test:bindings"]
description = "Run binding test suites only"
run = "alef test"

# Task set: alef-version
# Version bumps through alef sync-versions, for a Cargo workspace.
# requires: version:sync (repository-owned: propagates the version to everything alef does not manage)

["version:show"]
description = "Show current version from Cargo.toml"
file = "mise-tasks/.shared/alef-version/show.sh"

["version:bump:major"]
description = "Bump major version (X.0.0) and sync"
run = ["alef sync-versions --bump major", { task = "version:sync" }]

["version:bump:minor"]
description = "Bump minor version (0.X.0) and sync"
run = ["alef sync-versions --bump minor", { task = "version:sync" }]

["version:bump:patch"]
description = "Bump patch version (0.0.X) and sync"
run = ["alef sync-versions --bump patch", { task = "version:sync" }]

# Task set: bats-lib
# The shared Bats helper library. Runs the repository script scripts/task/sync-bats-lib.sh.

["test:scripts:lib:check"]
description = "Fail when the vendored Bats helper library has drifted from its pinned source"
run = "scripts/task/sync-bats-lib.sh --check"

["test:scripts:lib:sync"]
description = "Refresh the vendored Bats helper library from xberg-io/actions"
run = "scripts/task/sync-bats-lib.sh sync"

# Task set: deps-refresh
# Dependency refresh engine. Set DEPS_LANGS and the DEPS_* directories in the repository's mise.toml [env].

[deps]
description = "Update or upgrade one ecosystem's dependencies, or every ecosystem in DEPS_LANGS"
hide = true
file = "mise-tasks/.shared/deps-refresh/refresh.sh"

# Task set: docs-site
# Starlight documentation site. DOCS_DIR (default docs-site) names its directory.

["docs:build"]
description = "Build documentation"
run = ['pnpm --dir "${DOCS_DIR:-docs-site}" install --frozen-lockfile', 'pnpm --dir "${DOCS_DIR:-docs-site}" build']

["docs:serve"]
description = "Serve documentation locally with live reload"
run = ['pnpm --dir "${DOCS_DIR:-docs-site}" install', 'pnpm --dir "${DOCS_DIR:-docs-site}" dev']

# Task set: docs-snippets
# alef documentation snippets under the docs site. DOCS_DIR (default docs-site) names its directory.

["docs:snippets:audit"]
description = "Audit snippet structure under the docs site"
run = 'alef snippets audit --snippets "${DOCS_DIR:-docs-site}/src/snippets"'

["docs:snippets:gaps"]
description = "Report unreferenced snippets + missing language variants"
run = 'alef snippets gaps --snippets "${DOCS_DIR:-docs-site}/src/snippets" --docs "${DOCS_DIR:-docs-site}/src/content/docs"'

# Task set: governance
# AI governance: the reviewed poly hooks.

["governance:hooks:install"]
description = "Provision machine preferences and install reviewed AI governance hooks"
file = "mise-tasks/.shared/governance/hooks-install.sh"

# Task set: governance-check
# AI governance: the ai-rulez output check.
# ai-rulez is never pinned: npx runs its newest release, which needs node 22 or later. Task `tools` pins
# match baseline.toml.

["governance:check"]
description = "Check materialized local governance outputs against shared sources"
tools = { node = "26.12.1" }
run = "npx -y ai-rulez@latest generate --check --no-local --strict-config"

# Task set: lint-format
# Repository-wide lint and format through poly.

[lint]
description = "Run all linters via poly"
run = "poly lint ."

[format]
description = "Format all code via poly"
run = "poly fmt --fix ."

["format:check"]
description = "Check code formatting without modifications"
run = "poly fmt --check ."

# Task set: plugin
# ai-rulez plugin bundles and public skills.
# ai-rulez is never pinned: npx runs its newest release on the baseline node.
# Runs repository scripts: scripts/sync_public_skills.py and scripts/tests/test_public_skills.py.

["plugin:generate"]
description = "Regenerate the plugin bundles + marketplace from plugin/.ai-rulez"
tools = { node = "26.12.1" }
run = ["npx -y ai-rulez@latest generate --plugin", "python3 scripts/sync_public_skills.py"]

["plugin:verify"]
description = "Verify generated plugin bundles match source (byte + BLAKE3 provenance)"
tools = { node = "26.12.1" }
run = ["npx -y ai-rulez@latest verify --plugin", "python3 scripts/sync_public_skills.py --check"]

["plugin:skills:test"]
description = "Verify public skill ownership and resource freshness"
run = ["python3 scripts/tests/test_public_skills.py", "python3 scripts/sync_public_skills.py --check"]

# Task set: rust
# Cargo workspace one-liners.

["rust:format"]
description = "Format Rust code (with modifications)"
run = "cargo fmt --all"

["rust:clean"]
description = "Clean Rust build artifacts"
run = "cargo clean"
