# Loaded only with MISE_ENV=ci, so the versions CI selects with MISE_<TOOL>_VERSION stay locked. ~keep
# python: 3.10 is the requires-python floor the integration smoke tests run on; 3.11 is what the
# benchmark, profiling and integration build jobs run on; 3.13 supports the frozen caption model lock.
# ruby: 3.3 matches the gem the release
# builds; 3.2 is the profiling job's Ruby. zig: 0.13 ships the LLVM 18 headers the PHP release
# build's libclang 18 bindgen needs. ~keep
[tools]
python = ["3.15.2", "3.13.18", "3.11.18", "3.10.22"]
ruby = ["4.0.9", "3.3.13", "3.2.11"]
zig = ["0.17.0", "0.13.0"]
